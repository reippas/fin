 drill:[['I would like to cancel my booking.',['haluaisin peruuttaa varaukseni']],['The flight is cancelled.',['lento on peruttu']],['The train is late.',['juna on myöhässä']]],
 next:'Lesson 93: vocabulary bank for appointments and rescheduling.'},
{n:93,title:'Vocabulary bank: appointments',
 win:'Reschedule one appointment in a formal message.',
 anchor:'Same coffee trigger. Say the words aloud once, then say "Yes!"',
 build:'Rescheduling combines three things you own: the day with <em>-na</em> (Lesson 24), the time with <em>kello</em> (Lesson 25) and the from/to endings (Lesson 26). <em>Aika</em> means both time and appointment.',
 eq:[['Haluaisin siirtää','stem'],['aikani','end'],['perjantaille','mark'],['Haluaisin siirtää aikani perjantaille.','res']],
 eqNote:'= <em>I would like to move my appointment to Friday.</em>',
 formula:'Minulla on aika + day + kello + time.   Haluaisin siirtää aikani + outer -lle.',
 table:[['Finnish','English'],['aika','appointment, time'],['varata aika','to book an appointment'],['siirtää','to move, to postpone'],['peruuttaa','to cancel'],['lääkäri / hammaslääkäri','doctor / dentist'],['torstaista perjantaihin','from Thursday to Friday']],
 rule:'<strong>Reuse.</strong> <em>Minulla on aika</em> is the possession pattern from Lesson 35. <em>Siirtää aikani perjantaille</em> uses the outer <em>-lle</em> for to a day.',
 why:'A full model:<br><b>Aihe: Ajan siirto</b><br><b>Hyvä vastaanottaja,</b><br>Minulla on aika torstaina kello 10. Valitettavasti en voi tulla, koska olen töissä. Haluaisin siirtää aikani perjantaille. Sopiiko perjantaina kello 10?<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Moving an appointment. Dear recipient, I have an appointment on Thursday at 10. Unfortunately I cannot come, because I am at work. I would like to move my appointment to Friday. Does Friday at 10 suit? Kind regards, Aino Virtanen',
 drill:[['I would like to book an appointment.',['haluaisin varata ajan']],['I would like to move my appointment to Friday.',['haluaisin siirtää aikani perjantaille']],['I have an appointment on Thursday at 10.',['minulla on aika torstaina kello 10']]],
 next:'Lesson 94: neutral register, a message to a colleague.'},
{n:94,title:'Neutral register: a message to a colleague',
 win:'Write a message to a colleague that is neither stiff nor casual.',
 anchor:'Same coffee trigger. Write a neutral greeting and closing, then say "Yes!"',
 build:'Between a friend and a stranger sits the <strong>neutral register</strong>: <em>Hei Matti,</em> and <em>Terveisin,</em> (Lesson 3), with polite but short sentences. Use <em>Voinko</em> and <em>Voisitko</em> instead of the longer formal forms.',
 eq:[['Hei Matti,','stem'],['Voinko lähettää raportin torstaina?','mark'],['Terveisin,','end'],['viesti työtoverille','res']],
 eqNote:'viesti työtoverille = <em>message to a colleague</em>',
 formula:'Hei [Name], + request or news + Kiitos ymmärryksestä. + Terveisin,',
 table:[['Finnish','English'],['työtoveri','colleague'],['esimies','supervisor'],['kokous','meeting'],['raportti','report'],['Kiitos ymmärryksestä.','Thank you for understanding.']],
 rule:'<strong>Ladder.</strong> Friend: Hei Anna! / Nähdään! Colleague: Hei Matti, / Terveisin, Stranger: Hyvä vastaanottaja, / Ystävällisin terveisin,',
 why:'A full model:<br><b>Hei Matti,</b><br>Valitettavasti en voi osallistua kokoukseen huomenna, koska minulla on toinen kokous. Voinko lähettää raportin torstaina? Kiitos ymmärryksestä.<br><b>Terveisin,</b><br>Aino',
 tr:'Hi Matti, Unfortunately I cannot attend the meeting tomorrow, because I have another meeting. Can I send the report on Thursday? Thank you for understanding. Regards, Aino',
 drill:[['I cannot attend the meeting.',['en voi osallistua kokoukseen']],['Can I send the report on Thursday?',['voinko lähettää raportin torstaina']],['Thank you for understanding.',['kiitos ymmärryksestä']]],
 next:'Lesson 95: the negative past (En saanut vastausta).'},
{n:95,title:'The negative past (En saanut vastausta)',
 win:'Say what did not happen with en + participle.',
 anchor:'Same coffee trigger. Write En saanut vastausta once, then say "Yes!"',
 build:'The negative past uses <em>en/et/ei</em> (Lesson 6) plus the <strong>past participle</strong> ending in <code>-nut/-nyt</code>. It uses the strong stem: <em>saada</em> becomes <em>saanut</em>. For plural subjects the participle ends in <code>-neet</code>.',
 eq:[['en','end'],['saa','stem'],['nut','mark'],['en saanut','res']],
 eqNote:'en saanut = <em>I did not get</em>',
 formula:'en / et / ei + stem + nut/nyt   (plural: emme / ette / eivät + stem + neet)',
 table:[['Infinitive','Past (yes)','Past (no)'],['saada','sain','en saanut'],['vastata','vastasin','en vastannut'],['kirjoittaa','kirjoitin','en kirjoittanut'],['kysyä','kysyin','en kysynyt'],['tulla','tulin','en tullut'],['mennä','menin','en mennyt']],
 rule:'<strong>Watch the stem.</strong> The participle keeps the strong stem (<em>kirjoittanut</em>), unlike the I-form past (<em>kirjoitin</em>). Plural: <em>emme saaneet</em> (we did not get), <em>eivät vastanneet</em> (they did not answer).',
 why:'The most useful complaint sentences:<br><b>Kirjoitin teille eilen, mutta en saanut vastausta. Kukaan ei vastannut.</b>',
 tr:'I wrote to you yesterday, but I did not get a reply. Nobody answered.',
 drill:[['I did not get a reply.',['en saanut vastausta']],['Nobody answered.',['kukaan ei vastannut']],['I did not write.',['en kirjoittanut']]],
 next:'Lesson 96: time connectors for stories (kun, sen jälkeen, ensin, sitten).'},
{n:96,title:'Time connectors for stories',
 win:'Tell three events in order.',
 anchor:'Same coffee trigger. Tell one sequence of two events, then say "Yes!"',
 build:'Complaints and stories need order. Four tools do the work: <em>kun</em> (when), <em>ennen kuin</em> (before), <em>sen jälkeen</em> (after that), and <em>ensin ... sitten</em> (first ... then). A clause with <em>kun</em> is followed by a comma when it comes first.',
 eq:[['Kun tuote saapui','stem'],[',','mark'],['huomasin, että se oli rikki','end'],['Kun tuote saapui, huomasin, että se oli rikki.','res']],
 eqNote:'= <em>When the product arrived, I noticed that it was broken.</em>',
 formula:'Kun + clause, + clause.   |   Ensin ..., sitten ...   |   Sen jälkeen ...',
 table:[['Finnish','English'],['Kun tuote saapui, huomasin ongelman.','When the product arrived, I noticed the problem.'],['Ennen kuin ostin tuotteen, kysyin hinnasta.','Before I bought the product, I asked about the price.'],['Sen jälkeen kirjoitin teille.','After that I wrote to you.'],['Ensin kirjoitin, sitten soitin.','First I wrote, then I called.']],
 rule:'<strong>Keep tenses aligned.</strong> A past story keeps both clauses in the past: <em>Huomasin, että se oli rikki.</em> <em>Huomata</em> (to notice) has the past <em>huomasin</em>.',
 why:'A complaint story:<br><b>Tilasin tuotteen viime viikolla. Kun tuote saapui, huomasin, että se oli rikki. Sen jälkeen kirjoitin teille, mutta en saanut vastausta.</b>',
 tr:'I ordered the product last week. When the product arrived, I noticed that it was broken. After that I wrote to you, but I did not get a reply.',
 drill:[['When the product arrived, I noticed that it was broken.',['kun tuote saapui, huomasin, että se oli rikki','kun tuote saapui huomasin että se oli rikki']],['After that I wrote to you.',['sen jälkeen kirjoitin teille']],['First I wrote, then I called.',['ensin kirjoitin, sitten soitin','ensin kirjoitin sitten soitin']]],
 next:'Lesson 97: the error clinic, find and fix four errors.'},
{n:97,title:'The error clinic',
 win:'Find and fix four errors in one paragraph.',
 anchor:'Same coffee trigger. Fix one error in the text below, then say "Yes!"',
 build:'This is a rehearsal for the proofreading step. The paragraph below contains four errors from Lessons 72 and 76. Run the five passes (Lesson 79) and find them.',
 eq:[['säästää','stem'],['raha','mark'],['→','mark'],['rahaa','res']],
 eqNote:'säästää raha becomes säästää rahaa (partitive)',
 formula:'five passes: verbs / cases / gradation / harmony / commas',
 table:[['Wrong (✗)','Right (✓)','Pass'],['Ensinnäkin se säästää raha.','Ensinnäkin se säästää rahaa.','2 (case)'],['Lisäksi se vähentää liikenne.','Lisäksi se vähentää liikennettä.','2 (case)'],['Toisaalta talvella on liukasta koska ...','Toisaalta talvella on liukasta, koska ...','5 (comma)'],['Voin sanoa että ...','Voin sanoa, että ...','5 (comma)']],
 rule:'<strong>Method.</strong> Read once per pass. Mark the error, fix it, move on. Do not rewrite sentences that are already correct.',
 why:'Before: <b>Mielestäni pyöräily on hyvä asia. Ensinnäkin se säästää raha. Lisäksi se vähentää liikenne. Toisaalta talvella on vaikea pyöräillä koska on liukasta. Yhteenvetona voin sanoa että pyöräily on hyvä asia.</b><br>After: <b>Mielestäni pyöräily on hyvä asia. Ensinnäkin se säästää rahaa. Lisäksi se vähentää liikennettä. Toisaalta talvella on vaikea pyöräillä, koska on liukasta. Yhteenvetona voin sanoa, että pyöräily on hyvä asia.</b>',
 tr:'In my opinion cycling is a good thing. First of all it saves money. In addition it reduces traffic. On the other hand in winter it is difficult to cycle, because it is slippery. In summary I can say that cycling is a good thing.',
 drill:[['Correct this: Se säästää raha.',['se säästää rahaa']],['Correct this: Se vähentää liikenne.',['se vähentää liikennettä']],['Correct this: Yhteenvetona voin sanoa että se on hyvä.',['yhteenvetona voin sanoa, että se on hyvä']]],
 next:'Lesson 98: a second mock set of three tasks.'},
{n:98,title:'Mock set 2: three tasks',
 win:'Write three short answers to three new practice prompts.',
 anchor:'Same coffee trigger. Pick one prompt below and write it in 10 minutes, then say "Yes!"',
 build:'These prompts are my own practice material, not real exam tasks. Task 1 is an informal invitation. Task 2 is a formal complaint with a story. Task 3 is an opinion text. Use the planning questions (Lesson 83) and the five passes (Lesson 79).',
 eq:[['Task 1','stem'],['Task 2','mark'],['Task 3','end'],['kokeilu 2','res']],
 eqNote:'kokeilu 2 = <em>trial run 2</em>',
 formula:'Plan 1 minute / write / proofread. Repeat for three tasks.',
 table:[['Task','Prompt (practice)','Key lessons'],['1 Informal','Invite a friend to your birthday and ask them to bring something.','22, 25, 36, 88'],['2 Formal','Complain about a late delivery and ask when it will arrive.','41 to 49, 95, 96'],['3 Opinion','Should people cycle more?','51 to 60, 97']],
 rule:'<strong>Self-check:</strong> Does Task 2 use the negative past (<em>en saanut</em>) and a time connector (<em>kun</em>)? Does Task 3 use a hedge, an example and a counterpoint? Does Task 1 stay friendly?',
 why:'Model answers:<br><b>Task 1:</b> Hei Anna! Mitä kuuluu? Kutsun sinut syntymäpäivälleni lauantaina kello kuusi. Voisitko tuoda kakun? Kerro, tuletko. Nähdään pian!<br><b>Task 2:</b> Aihe: Valitus toimituksesta. Hyvä vastaanottaja, Otan yhteyttä koskien tilaustani. Tilasin tuotteen 5. lokakuuta. Kun kirjoitin teille eilen, en saanut vastausta. Tilaus on edelleen myöhässä. Pyydän vastausta pian. Olisin kiitollinen, jos voisitte kertoa, milloin tilaus saapuu. Ystävällisin terveisin, Aino Virtanen<br><b>Task 3:</b> Nykyään pyöräilystä keskustellaan paljon. Mielestäni ihmisten pitäisi pyöräillä enemmän. Ensinnäkin se säästää rahaa. Lisäksi se vähentää liikennettä. Toisaalta talvella on liukasta. Kaiken kaikkiaan pyöräily on hyvä tapa liikkua.',
 tr:'Task 1: Hi Anna! How are you? I invite you to my birthday on Saturday at six o\'clock. Could you bring a cake? Tell me whether you are coming. See you soon! Task 2: Subject: Complaint about the delivery. Dear recipient, I am contacting you regarding my order. I ordered the product on 5 October. When I wrote to you yesterday, I did not get a reply. The order is still late. I request a reply soon. I would be grateful if you could tell me when the order arrives. Kind regards, Aino Virtanen. Task 3: Nowadays cycling is discussed a lot. In my opinion people should cycle more. First of all it saves money. In addition it reduces traffic. On the other hand it is slippery in winter. All in all cycling is a good way to get around.',
 drill:[['I invite you to my birthday.',['kutsun sinut syntymäpäivälleni']],['When I wrote to you yesterday, I did not get a reply.',['kun kirjoitin teille eilen, en saanut vastausta','kun kirjoitin teille eilen en saanut vastausta']],['In my opinion people should cycle more.',['mielestäni ihmisten pitäisi pyöräillä enemmän']]],
 next:'Lesson 99: recovery strategies when you are stuck, and your exam-day routine.'},
{n:99,title:'Recovery strategies and exam-day routine',
 win:'Rescue one sentence when you do not know the word.',
 anchor:'Same coffee trigger. Write one sentence that explains an unknown word, then say "Yes!"',
 build:'Everyone gets stuck on a word. Do not stop. Explain it with words you know. Four tools help: <em>eli</em> (that is), <em>toisin sanoen</em> (in other words), <em>kuten</em> (such as) and <em>Tarkoitan, että</em> (I mean that).',
 eq:[['Tarkoitan','stem'],[', että','mark'],['palvelu oli hidasta','end'],['Tarkoitan, että palvelu oli hidasta.','res']],
 eqNote:'= <em>I mean that the service was slow.</em>',
 formula:'..., eli ...   |   toisin sanoen ...   |   X, kuten Y tai Z   |   Tarkoitan, että ...',
 table:[['Finnish','English'],['eli','that is'],['toisin sanoen','in other words'],['kuten','such as'],['Tarkoitan, että ...','I mean that ...'],['tai','or']],
 rule:'<strong>Exam-day routine (my suggestion).</strong> Read the prompt verbs. Plan for one minute. Write short, correct sentences. Use the last minutes for the five passes. A simple correct sentence scores better than a complex wrong one.',
 why:'Recovery in use:<br><b>Kaupassa oli ongelma, eli tuote oli rikki. Tarkoitan, että palvelu oli hidasta. Julkinen liikenne, kuten bussi tai juna, on tärkeää.</b>',
 tr:'There was a problem in the shop, that is, the product was broken. I mean that the service was slow. Public transport, such as the bus or the train, is important.',
 drill:[['that is (one word)',['eli']],['in other words',['toisin sanoen']],['I mean that the service was slow.',['tarkoitan, että palvelu oli hidasta','tarkoitan että palvelu oli hidasta']]],
 next:'Lesson 100: your template notebook and next steps.'},
{n:100,title:'Final checkpoint: your template notebook',

 table:[['Genre','Skeleton','Lessons'],['Informal message','Hei! / Mitä kuuluu? / story / invitation / question / Nähdään pian!','29, 30, 40'],['Formal complaint','Aihe / Hyvä vastaanottaja, / opener / details / problem / remedy / request / contact / closing','50, 91 to 96'],['Formal request','Aihe / opener / two questions / Olisin kiitollinen, jos ...','85'],['Opinion text','topic / position / reason / addition / example / counterpoint / weighing / conclusion','60, 70, 80'],['Feedback','purpose / praise / thanks / wish','86'],['Application','applying / interest / experience / skills / start','87']],

 why:'A capstone model:<br><b>Aihe: Valitus tilauksesta</b><br><b>Hyvä vastaanottaja,</b><br>Otan yhteyttä koskien tilaustani. Tilasin tuotteen 5. lokakuuta. Kun tuote saapui, huomasin, että se oli rikki. Sen jälkeen kirjoitin teille, mutta en saanut vastausta. En ole tyytyväinen palveluun. Haluaisin saada uuden tuotteen. Olisin kiitollinen, jos voisitte vastata pian. Voitte soittaa minulle numeroon 040 123 4567. Kiitos jo etukäteen.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Complaint about the order. Dear recipient, I am contacting you regarding my order. I ordered the product on 5 October. When the product arrived, I noticed that it was broken. After that I wrote to you, but I did not get a reply. I am not satisfied with the service. I would like to get a new product. I would be grateful if you could reply soon. You can call me at 040 123 4567. Thanks in advance. Kind regards, Aino Virtanen',
 drill:[['Thank you for your help.',['kiitos avustanne']],['Kind regards (formal closing)',['ystävällisin terveisin']],['I would be grateful if you could reply soon.',['olisin kiitollinen, jos voisitte vastata pian','olisin kiitollinen jos voisitte vastata pian']]],
 next:'Lesson 101 starts the extension block with the perfect tense. Keep doing weekly mock sets and the official demo tasks alongside it.'},
{n:101,title:'The perfect tense (Olen kirjoittanut)',
 win:'Say what you have done with olen + participle.',
 anchor:'Same coffee trigger. Write Olen kirjoittanut teille once, then say "Yes!"',
 build:'The <strong>perfect tense</strong> says an action has happened and still matters now. It is <em>olla</em> (Lesson 16) plus the past participle (<code>-nut/-nyt</code>, Lesson 95). For plural subjects the participle ends in <code>-neet</code>. You already know the pieces: the perfect is simply the participle with <em>olen</em> in front.',
 eq:[['olen','mark'],['kirjoittanut','stem'],['olen kirjoittanut','res']],
 eqNote:'olen kirjoittanut = <em>I have written</em>',
 formula:'olen / olet / on + participle (-nut/-nyt)   |   olemme / olette / ovat + participle (-neet)',
 table:[['Person','kirjoittaa','asua'],['minä','olen kirjoittanut','olen asunut'],['sinä','olet kirjoittanut','olet asunut'],['hän','on kirjoittanut','on asunut'],['me','olemme kirjoittaneet','olemme asuneet'],['te','olette kirjoittaneet','olette asuneet'],['he','ovat kirjoittaneet','ovat asuneet']],
 rule:'<strong>Irregular participles.</strong> tulla becomes tullut, mennä becomes mennyt, nähdä becomes nähnyt, olla becomes ollut, saada becomes saanut. Learn them with the I-form: <em>olen tullut</em>, <em>olen mennyt</em>.',
 why:'Two natural uses:<br><b>Olen asunut Suomessa kaksi vuotta. Olen kirjoittanut teille kahdesti.</b>',
 tr:'I have lived in Finland for two years. I have written to you twice.',
 drill:[['I have written.',['olen kirjoittanut']],['We have written.',['olemme kirjoittaneet']],['I have lived in Finland for two years.',['olen asunut suomessa kaksi vuotta']]],
 next:'Lesson 102: the negative perfect for complaints (En ole saanut vastausta).'},
{n:102,title:'The negative perfect (En ole saanut vastausta)',
 win:'Say what has not happened yet.',
 anchor:'Same coffee trigger. Write En ole saanut vastausta once, then say "Yes!"',
 build:'The negative perfect is the negative <em>olla</em> (<em>en ole</em>, Lesson 18) plus the participle. Compare it with the negative past from Lesson 95: <em>En saanut vastausta</em> points to one moment in the past, while <em>En ole saanut vastausta</em> means <strong>so far, up to now</strong>. For complaints, the perfect is usually the stronger choice.',
 eq:[['en ole','mark'],['saanut','stem'],['vastausta','end'],['En ole saanut vastausta.','res']],
 eqNote:'= <em>I have not received a reply.</em>',
 formula:'en / et / ei ole + participle   |   emme / ette / eivät ole + participle (-neet)',
 table:[['Finnish','English','Meaning'],['En saanut vastausta.','I did not get a reply.','one moment in the past'],['En ole saanut vastausta.','I have not received a reply.','up to now'],['Tuote ei ole saapunut.','The product has not arrived.','up to now'],['Emme ole saaneet tilausta.','We have not received the order.','up to now']],
 rule:'<strong>Handy.</strong> <em>Vielä</em> (yet, still) often joins the negative perfect: <em>Tuote ei ole vielä saapunut.</em> <em>Saapua</em> (to arrive) has the participle <em>saapunut</em>.',
 why:'A complaint paragraph:<br><b>Tilasin tuotteen 5. lokakuuta. Tuote ei ole vielä saapunut. Olen kirjoittanut teille kahdesti, mutta en ole saanut vastausta. Pyydän vastausta pian.</b>',
 tr:'I ordered the product on 5 October. The product has not arrived yet. I have written to you twice, but I have not received a reply. I request a reply soon.',
 drill:[['The product has not yet arrived.',['tuote ei ole vielä saapunut']],['I have not received a reply.',['en ole saanut vastausta']],['I have written to you twice.',['olen kirjoittanut teille kahdesti']]],
 next:'Lesson 103: time expressions for the perfect (jo, vielä, kaksi viikkoa).'},
{n:103,title:'Time words for the perfect (jo, vielä, lähtien)',
 win:'Say how long something has been going on.',
 anchor:'Same coffee trigger. Write one sentence with jo or vielä, then say "Yes!"',
 build:'The perfect works well with time words. <em>Jo</em> (already) and <em>vielä</em> (yet, still) show how long a situation has lasted. <em>Lähtien</em> (since) follows the elative: <em>viime viikosta lähtien</em>. A duration up to now uses the partitive: <em>kaksi viikkoa</em>.',
 eq:[['Olen odottanut','stem'],['jo','mark'],['kaksi viikkoa','end'],['Olen odottanut jo kaksi viikkoa.','res']],
 eqNote:'= <em>I have already waited two weeks.</em>',
 formula:'olen + participle + (jo / vielä) + duration or time',
 table:[['Finnish','English'],['jo','already'],['vielä','yet, still'],['koskaan','ever'],['viime viikosta lähtien','since last week'],['kaksi viikkoa','for two weeks (up to now)']],
 rule:'<strong>Reuse.</strong> <em>Odottaa</em> (to wait) takes the partitive for what you wait for: <em>odottaa tuotetta</em>. With <em>koskaan</em> in a negative sentence: <em>En ole koskaan saanut vastausta.</em>',
 why:'Duration in a complaint:<br><b>Olen odottanut tuotetta jo kaksi viikkoa. En ole vielä saanut sitä.</b>',
 tr:'I have been waiting for the product for two weeks already. I have not received it yet.',
 drill:[['I have already waited two weeks.',['olen odottanut jo kaksi viikkoa']],['since last week',['viime viikosta lähtien']],['I have not yet received it.',['en ole vielä saanut sitä']]],
 next:'Lesson 104: the pluperfect (Olin kirjoittanut).'},
{n:104,title:'The pluperfect (Olin kirjoittanut)',
 win:'Say what had already happened before another event.',
 anchor:'Same coffee trigger. Write Olin kirjoittanut once, then say "Yes!"',
 build:'The pluperfect is the perfect shifted one step back. Use the past of <em>olla</em> (<em>olin, olit, oli, olimme, olitte, olivat</em>) plus the participle. It tells what had happened <strong>before</strong> a point in the past.',
 eq:[['olin','mark'],['kirjoittanut','stem'],['olin kirjoittanut','res']],
 eqNote:'olin kirjoittanut = <em>I had written</em>',
 formula:'olin / olit / oli + participle   |   olimme / olitte / olivat + participle (-neet)',
 table:[['Finnish','English'],['Olin kirjoittanut.','I had written.'],['He olivat jo lähteneet.','They had already left.'],['Olin jo tilannut tuotteen.','I had already ordered the product.'],['Kun soitin, he olivat lähteneet.','When I called, they had left.']],
 rule:'<strong>Handy.</strong> Pair the pluperfect with <em>kun</em> or <em>ennen kuin</em> (Lesson 96) to order events. <em>Lähteä</em> (to leave) has the participle <em>lähtenyt</em>.',
 why:'Ordering events:<br><b>Olin tilannut tuotteen jo ennen kuin hinta nousi. Kun soitin, he olivat jo lähteneet.</b>',
 tr:'I had ordered the product already before the price rose. When I called, they had already left.',
 drill:[['I had written.',['olin kirjoittanut']],['They had left.',['he olivat lähteneet']],['I had already ordered the product.',['olin jo tilannut tuotteen']]],
 next:'Lesson 105: participles as adjectives (myöhästynyt tilaus, korjattu tuote).'},
{n:105,title:'Participles as adjectives',
 win:'Turn a participle into an adjective before a noun.',
 anchor:'Same coffee trigger. Write one noun phrase with a participle, then say "Yes!"',
 build:'A participle can describe a noun. Two kinds are common. The <strong>active</strong> participle (<code>-nut/-nyt</code>) describes something that has done or become: <em>myöhästynyt tilaus</em> (a delayed order). The <strong>passive</strong> participle (<code>-ttu/-tty</code>, <code>-tu/-ty</code>) describes something that was acted on: <em>korjattu tuote</em> (a repaired product).',
 eq:[['korjat','stem'],['tu','mark'],['tuote','stem'],['korjattu tuote','res']],
 eqNote:'korjattu tuote = <em>a repaired product</em>',
 formula:'participle + noun (it agrees in case with the noun)',
 table:[['Verb','Participle','Example'],['myöhästyä','myöhästynyt','myöhästynyt tilaus (a delayed order)'],['rikkoutua','rikkoutunut','rikkoutunut tuote (a broken product)'],['tilata','tilattu','tilattu tuote (an ordered product)'],['korjata','korjattu','korjattu tuote (a repaired product)'],['lähettää','lähetetty','lähetetty paketti (a sent parcel)'],['perua','peruttu','peruttu lento (a cancelled flight)']],
 rule:'<strong>Agreement.</strong> Like an adjective, the participle copies the case of its noun (Lesson 17): <em>myöhästyneestä tilauksesta</em> (about the delayed order).',
 why:'Participles in a complaint:<br><b>Kirjoitan teille koskien myöhästynyttä tilausta. Korjattu tuote on edelleen rikki.</b>',
 tr:'I am writing to you regarding the delayed order. The repaired product is still broken.',
 drill:[['a delayed order',['myöhästynyt tilaus']],['a repaired product',['korjattu tuote']],['a cancelled flight',['peruttu lento']]],
 next:'Lesson 106: the passive in formal writing (Tuote toimitettiin).'},
{n:106,title:'The passive in formal writing (toimitettiin)',
 win:'Say what was done without naming who did it.',
 anchor:'Same coffee trigger. Write one passive sentence, then say "Yes!"',
 build:'Formal Finnish often hides the doer with the <strong>passive</strong>. You already know the present passive from Lesson 22 (<em>mennään</em>). The past passive ends in <code>-ttiin</code>, and the perfect passive uses <em>on</em> plus the passive participle (Lesson 105).',
 eq:[['tila','stem'],['ttiin','end'],['tilattiin','res']],
 eqNote:'tilattiin = <em>was ordered</em>',
 formula:'present: -taan   |   past: -ttiin   |   perfect: on + passive participle',
 table:[['Verb','Present','Past','Perfect'],['tilata','tilataan','tilattiin','on tilattu'],['korjata','korjataan','korjattiin','on korjattu'],['lähettää','lähetetään','lähetettiin','on lähetetty'],['toimittaa','toimitetaan','toimitettiin','on toimitettu']],
 rule:'<strong>Negative.</strong> The object of a negative passive takes the partitive: <em>Tuotetta ei ole toimitettu.</em> (The product has not been delivered.) Compare <em>Tilaus on lähetetty.</em> (The order has been sent.)',
 why:'Passive in a complaint:<br><b>Tilaus tehtiin 5. lokakuuta. Tuotetta ei ole vielä toimitettu.</b>',
 tr:'The order was made on 5 October. The product has not yet been delivered.',
 drill:[['The order was made.',['tilaus tehtiin']],['The product has not been delivered.',['tuotetta ei ole toimitettu']],['The order has been sent.',['tilaus on lähetetty']]],
 next:'Lesson 107: relative clauses (tuote, jonka tilasin).'},
{n:107,title:'Relative clauses (tuote, jonka tilasin)',
 win:'Describe a noun with a clause that starts with joka.',
 anchor:'Same coffee trigger. Write one relative clause, then say "Yes!"',
 build:'The word <em>joka</em> (who, which) joins a clause to a noun. It changes form for the case it plays in the clause, like any noun (Lessons 8, 9, 26). When the clause sits inside the sentence, commas go on both sides.',
 eq:[['Tuote','stem'],[', jonka','mark'],['tilasin','end'],['Tuote, jonka tilasin, on rikki.','res']],
 eqNote:'= <em>The product that I ordered is broken.</em>',
 formula:'noun + , + joka-form + clause , ...',
 table:[['Form','Role','Example'],['joka','subject','asiakas, joka kirjoitti (the customer who wrote)'],['jonka','object or owner','tuote, jonka tilasin (the product that I ordered)'],['jota','partitive object','palvelu, jota käytän (the service that I use)'],['josta','from, about','palvelu, josta pidän (the service that I like)'],['jossa','in, at','kauppa, jossa työskentelen (the shop where I work)'],['johon','into, to','kauppa, johon menin (the shop that I went to)']],
 rule:'<strong>How to choose.</strong> Ask what role the noun plays in the small clause. Does it do the verb (joka), receive it whole (jonka), receive it partly (jota), or sit in a place (jossa)? Copy the case you would use for a normal noun.',
 why:'Relative clauses in use:<br><b>Tuote, jonka tilasin, on rikki. Kauppa, jossa työskentelen, on auki joka päivä.</b>',
 tr:'The product that I ordered is broken. The shop where I work is open every day.',
 drill:[['The product that I ordered is broken.',['tuote, jonka tilasin, on rikki','tuote jonka tilasin on rikki']],['the shop where I work',['kauppa, jossa työskentelen','kauppa jossa työskentelen']],['the service that I like',['palvelu, josta pidän','palvelu josta pidän']]],
 next:'Lesson 108: reported speech (Minulle kerrottiin, että ...).'},
{n:108,title:'Reported speech (Minulle kerrottiin, että ...)',
 win:'Report what someone told you.',
 anchor:'Same coffee trigger. Write one reported sentence, then say "Yes!"',
 build:'Complaints often repeat what you were told. Use <em>sanoa</em> (to say) or <em>kertoa</em> (to tell) plus <em>että</em> (Lesson 13). Finnish also uses the past passive for the hidden speaker: <em>Minulle kerrottiin</em> means I was told. For reported questions use the indirect question (Lesson 48).',
 eq:[['Minulle kerrottiin','stem'],[', että','mark'],['tuote saapuu torstaina','end'],['Minulle kerrottiin, että tuote saapuu torstaina.','res']],
 eqNote:'= <em>I was told that the product arrives on Thursday.</em>',
 formula:'Hän sanoi, että + clause.   |   Minulle kerrottiin, että + clause.',
 table:[['Finnish','English'],['Hän sanoi, että tuote saapuu huomenna.','He said that the product arrives tomorrow.'],['Hän kertoi, että tilaus on myöhässä.','He told me that the order is late.'],['Minulle kerrottiin, että tilaus on myöhässä.','I was told that the order is late.'],['Minulle sanottiin, että ongelma korjataan.','I was told that the problem will be fixed.'],['Kysyin, milloin tuote saapuu.','I asked when the product arrives.']],
 rule:'<strong>Tense.</strong> The present tense after the past main verb is natural when the news still holds: <em>Minulle kerrottiin, että tuote saapuu torstaina.</em> Use the past if it is over: <em>... että tuote saapui eilen.</em>',
 why:'Reporting in a complaint:<br><b>Soitin teille eilen. Minulle kerrottiin, että tuote saapuu torstaina. Tuote ei kuitenkaan ole saapunut.</b>',
 tr:'I called you yesterday. I was told that the product arrives on Thursday. The product has not, however, arrived.',
 drill:[['He said that the product arrives tomorrow.',['hän sanoi, että tuote saapuu huomenna','hän sanoi että tuote saapuu huomenna']],['I was told that the order is late.',['minulle kerrottiin, että tilaus on myöhässä','minulle kerrottiin että tilaus on myöhässä']],['I asked when the product arrives.',['kysyin, milloin tuote saapuu','kysyin milloin tuote saapuu']]],
 next:'Lesson 109: the translative for periods (kolmeksi yöksi).'},
{n:109,title:'For a period (kolmeksi yöksi)',
 win:'Say how long something is planned for.',
 anchor:'Same coffee trigger. Write one sentence with -ksi, then say "Yes!"',
 build:'The <strong>translative</strong> ending <code>-ksi</code> says <em>for a period</em> when you plan or book it. Compare <em>Olen poissa kaksi päivää</em> (I am away for two days, Lesson 84), a stay that is happening, with <em>Varasin huoneen kahdeksi yöksi</em> (I booked the room for two nights), a plan. In a numeral phrase both words take <em>-ksi</em>.',
 eq:[['kolme yötä','stem'],['→','mark'],['kolmeksi yöksi','res']],
 eqNote:'kolmeksi yöksi = <em>for three nights</em>',
 formula:'noun stem + ksi   |   numeral + noun, both with -ksi',
 table:[['Basic','Translative','English'],['viikko','viikoksi','for a week'],['kaksi viikkoa','kahdeksi viikoksi','for two weeks'],['yö','yöksi','for a night'],['kolme yötä','kolmeksi yöksi','for three nights'],['kuukausi','kuukaudeksi','for a month']],
 rule:'<strong>Handy.</strong> Numerals change too: <em>kaksi</em> becomes <em>kahdeksi</em>, <em>kolme</em> becomes <em>kolmeksi</em>. Use <em>-ksi</em> for a planned period and the partitive for a duration that is under way.',
 why:'A booking request:<br><b>Haluaisin varata huoneen kolmeksi yöksi.</b>',
 tr:'I would like to book a room for three nights.',
 drill:[['for a week (one word)',['viikoksi']],['for two nights',['kahdeksi yöksi']],['I would like to book a room for three nights.',['haluaisin varata huoneen kolmeksi yöksi']]],
 next:'Lesson 110: checkpoint. A capstone complaint with perfect, passive, relative and reported speech.'},
{n:110,title:'Checkpoint: the advanced complaint',
 win:'Write a complaint that uses the perfect, passive, relative clause and reported speech.',
 anchor:'Same coffee trigger. Write the whole message once, then say "Yes!"',
 build:'This capstone adds the extension tools to the standard complaint skeleton (Lesson 50): the perfect (Lessons 101 to 103), the passive (106), a relative clause (107), reported speech (108) and a participle adjective in the subject line (105).',
 eq:[['Subject','stem'],['Opener','mark'],['Details','mark'],['Perfect','mark'],['Reported','mark'],['Question','end'],['Request','end'],['viesti','res']],
 eqNote:'viesti = <em>message</em>',
 formula:'Aihe / Hyvä vastaanottaja, / opener / date / perfect / reported speech / relative question / request / closing',
 table:[['Slot','Pattern','Lessons'],['Subject','Aihe: Valitus myöhästyneestä tilauksesta','105'],['Opener','Otan yhteyttä koskien tilaustani.','41'],['Details','Tilasin tuotteen 5. lokakuuta.','43'],['Perfect','Tuotetta ei ole vielä toimitettu, vaikka olen odottanut jo kaksi viikkoa.','102, 103, 106'],['Reported','Minulle kerrottiin, että tuote saapuu torstaina.','108'],['Question','Haluaisin tietää, miksi tuote, jonka tilasin, ei ole saapunut.','48, 107'],['Request','Pyydän vastausta pian.','19']],
 rule:'<strong>Self-check:</strong> Is the perfect used for what is still true now (<em>en ole saanut</em>)? Does the passive object take the partitive? Are relative clauses closed with a comma on both sides? Then run the five passes (Lesson 79).',
 why:'A full model:<br><b>Aihe: Valitus myöhästyneestä tilauksesta</b><br><b>Hyvä vastaanottaja,</b><br>Otan yhteyttä koskien tilaustani. Tilasin tuotteen 5. lokakuuta. Tuotetta ei ole vielä toimitettu, vaikka olen odottanut jo kaksi viikkoa. Soitin teille eilen. Minulle kerrottiin, että tuote saapuu torstaina. Haluaisin tietää, miksi tuote, jonka tilasin, ei ole saapunut. Pyydän vastausta pian.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Complaint about the delayed order. Dear recipient, I am contacting you regarding my order. I ordered the product on 5 October. The product has not yet been delivered, although I have been waiting for two weeks already. I called you yesterday. I was told that the product arrives on Thursday. I would like to know why the product that I ordered has not arrived. I request a reply soon. Kind regards, Aino Virtanen',
 drill:[['The product has not yet been delivered.',['tuotetta ei ole vielä toimitettu']],['I was told that the product arrives on Thursday.',['minulle kerrottiin, että tuote saapuu torstaina','minulle kerrottiin että tuote saapuu torstaina']],['I would like to know why the product that I ordered has not arrived.',['haluaisin tietää, miksi tuote, jonka tilasin, ei ole saapunut','haluaisin tietää miksi tuote jonka tilasin ei ole saapunut']]],
 next:'Lesson 111: vocabulary bank for online shopping and deliveries.'},
{n:111,title:'Vocabulary bank: online shopping',
 win:'Learn eight shopping words and write one return request.',
 anchor:'Same coffee trigger. Say the eight words aloud once, then say "Yes!"',
 build:'Returns, refunds and late deliveries are everyday formal tasks. Learn the words once and slot them into the frames you already own. One new connector appears here: <em>joten</em> (so), which starts a result clause after a comma.',
 eq:[['Tuote on liian pieni','stem'],[', joten','mark'],['haluaisin palauttaa sen','end'],['Tuote on liian pieni, joten haluaisin palauttaa sen.','res']],
 eqNote:'= <em>The product is too small, so I would like to return it.</em>',
 formula:'reason clause + , joten + result clause',
 table:[['Finnish','English'],['verkkokauppa','online shop'],['toimitus','delivery'],['paketti','parcel'],['palautus','return'],['hyvitys','refund, credit'],['maksu','payment'],['kuitti','receipt'],['takuu','warranty']],
 rule:'<strong>Reuse.</strong> <em>Verkkokaupastanne</em> is <em>verkkokauppa</em> plus the elative and <em>-nne</em> (Lessons 8 and 15). <em>Liitteenä</em> (attached) is a fixed form you can copy.',
 why:'A full model:<br><b>Aihe: Tuotteen palautus</b><br><b>Hyvä vastaanottaja,</b><br>Otan yhteyttä koskien tilaustani. Tilasin verkkokaupastanne kengät 5. lokakuuta. Tuote on liian pieni, joten haluaisin palauttaa sen. Kuitti on liitteenä. Pyydän, että palautatte maksun.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Return of a product. Dear recipient, I am contacting you regarding my order. I ordered shoes from your online shop on 5 October. The product is too small, so I would like to return it. The receipt is attached. I request that you refund the payment. Kind regards, Aino Virtanen',
 drill:[['online shop (one word)',['verkkokauppa']],['refund (one word)',['hyvitys']],['The receipt is attached.',['kuitti on liitteenä']]],
 next:'Lesson 112: vocabulary bank for education.'},
{n:112,title:'Vocabulary bank: education',
 win:'Learn eight school words and ask to move an exam.',
 anchor:'Same coffee trigger. Say the eight words aloud once, then say "Yes!"',

 eqNote:'= <em>Could I take the exam on another day?</em>',

 rule:'<strong>Reuse.</strong> <em>Toisena päivänä</em> is the essive <em>-na</em> (Lesson 24) meaning on another day. <em>Voisinko</em> is the polite request from Lessons 7 and 36.',
 why:'A full model:<br><b>Hei Maria,</b><br>Haluaisin kysyä kurssin kokeesta. En voi tulla kokeeseen perjantaina, koska olen töissä. Voisinko tehdä kokeen toisena päivänä? Kiitos ymmärryksestä.<br><b>Terveisin,</b><br>Aino',

{n:113,title:'Vocabulary bank: neighbours and housing',
 win:'Learn seven words and report a noise problem formally.',

 build:'Messages to a property manager combine the perfect (Lessons 101 and 102) with a clear request. A good message says what the problem is, how long it has lasted and what you already tried.',
 eq:[['Melu','stem'],['ei ole','mark'],['loppunut','end'],['Melu ei ole loppunut.','res']],
 eqNote:'= <em>The noise has not stopped.</em>',
 formula:'Problem + how long (perfect) + what I tried + request',
 table:[['Finnish','English'],['naapuri','neighbour'],['melu','noise'],['taloyhtiö','housing company'],['isännöitsijä','property manager'],['piha','yard'],['roskat','rubbish'],['sääntö','rule']],
 rule:'<strong>Reuse.</strong> <em>Melua on ollut kaksi viikkoa</em> is the perfect of <em>olla</em> with a partitive subject (Lesson 35). <em>Naapurin kanssa</em> (with the neighbour) uses <em>kanssa</em> after the genitive.',
 why:'A full model:<br><b>Aihe: Melu naapurissa</b><br><b>Hyvä isännöitsijä,</b><br>Kirjoitan teille, koska naapurissa on melua myöhään illalla. Melua on ollut kaksi viikkoa. Olen puhunut naapurin kanssa, mutta melu ei ole loppunut. Pyydän, että puhutte asiasta naapurille.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Noise at the neighbour. Dear property manager, I am writing to you because there is noise at the neighbour late in the evening. There has been noise for two weeks. I have talked with the neighbour, but the noise has not stopped. I request that you talk to the neighbour about the matter. Kind regards, Aino Virtanen',

 next:'Lesson 114: vocabulary bank for the environment.'},
{n:114,title:'Vocabulary bank: the environment',
 win:'Learn eight words and write a short opinion on recycling.',
 anchor:'Same coffee trigger. Say the eight words aloud once, then say "Yes!"',
 build:'The environment is a classic opinion topic. Combine the topic words with effect verbs (Lesson 65) and the opinion skeleton (Lesson 60). <em>Pitäisi</em> (should) joins a genitive subject: <em>jokaisen pitäisi</em> (everyone should).',
 eq:[['jokaisen','stem'],['pitäisi','mark'],['kierrättää enemmän','end'],['Jokaisen pitäisi kierrättää enemmän.','res']],
 eqNote:'= <em>Everyone should recycle more.</em>',
 formula:'genitive subject + pitäisi + verb in -a/-ä form',
 table:[['Finnish','English'],['ympäristö','environment'],['kierrätys','recycling'],['päästöt','emissions'],['energia','energy'],['sähkö','electricity'],['muovi','plastic'],['jäte','waste'],['luonto','nature']],
 rule:'<strong>Reuse.</strong> <em>Jätettä</em> and <em>energiaa</em> are partitives after effect verbs (Lesson 65). <em>Luonnolle</em> (for nature) uses the outer <em>-lle</em> with gradation (nt becomes nn).',
 why:'A full model:<br><b>Mielestäni jokaisen pitäisi kierrättää enemmän. Ensinnäkin kierrätys vähentää jätettä. Lisäksi se säästää energiaa. Esimerkiksi minä kierrätän muovin ja paperin. Toisaalta kierrätys vie aikaa. Kaiken kaikkiaan kierrätys on tärkeää luonnolle.</b>',
 tr:'In my opinion everyone should recycle more. First of all recycling reduces waste. In addition it saves energy. For example I recycle plastic and paper. On the other hand recycling takes time. All in all recycling is important for nature.',
 drill:[['environment (one word)',['ympäristö']],['emissions (one word)',['päästöt']],['Recycling saves energy.',['kierrätys säästää energiaa']]],

 win:'Learn eight words and invite a friend to a hobby.',

 rule:'<strong>Reuse.</strong> <em>Kadottanut</em> is the participle of <em>kadottaa</em> (to lose, Lesson 101). <em>Kirjastokorttini</em> is a compound with <em>-ni</em>.',
 why:'A full model:<br><b>Aihe: Kirjastokortti</b><br><b>Hyvä vastaanottaja,</b><br>Olen kadottanut kirjastokorttini. Haluaisin saada uuden kortin. Täytyykö minun täyttää lomake? Kiitos avusta.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Library card. Dear recipient, I have lost my library card. I would like to get a new card. Do I have to fill in a form? Thank you for the help. Kind regards, Aino Virtanen',
 drill:[['form (one word)',['lomake']],['library (one word)',['kirjasto']],['I have lost my library card.',['olen kadottanut kirjastokorttini']]],
 next:'Lesson 119: from word bank to opinion sentence.'},
{n:119,title:'From word bank to opinion sentence',
 win:'Turn one word from each bank into an opinion sentence.',
 anchor:'Same coffee trigger. Make one opinion sentence from a bank word, then say "Yes!"',
 build:'A word bank is only useful if you can use it quickly. Here is a fast recipe: take one noun, pick a verb from Lessons 64 and 65 or the pattern <em>pitäisi</em>, add an adjective, and open with <em>Mielestäni</em>. Practise one sentence per bank.',
 eq:[['Mielestäni','stem'],['sovellukset','mark'],['helpottavat elämää','end'],['Mielestäni sovellukset helpottavat elämää.','res']],
 eqNote:'= <em>In my opinion apps make life easier.</em>',
 formula:'Mielestäni + bank noun + verb or pitäisi + complement',
 table:[['Bank','Finnish','English'],['Shopping','Mielestäni verkkokaupat ovat käteviä.','In my opinion online shops are convenient.'],['Education','Mielestäni koulussa pitäisi olla vähemmän kokeita.','In my opinion there should be fewer exams at school.'],['Environment','Mielestäni päästöjä pitäisi vähentää.','In my opinion emissions should be reduced.'],['Technology','Mielestäni sovellukset helpottavat elämää.','In my opinion apps make life easier.'],['Leisure','Mielestäni liikunta on tärkeää kaikille.','In my opinion exercise is important for everyone.'],['Work','Mielestäni työaikojen pitäisi olla joustavia.','In my opinion working hours should be flexible.'],['Services','Mielestäni kirjastojen pitäisi olla auki illalla.','In my opinion libraries should be open in the evening.']],
 rule:'<strong>Handy.</strong> <em>Pitäisi</em> pairs with a genitive subject (<em>työaikojen</em>, <em>kirjastojen</em>) or with a partitive object when the verb takes one (<em>päästöjä pitäisi vähentää</em>). Use this pattern when the topic is a policy.',
 why:'A bank-to-sentence drill:<br><b>Mielestäni verkkokaupat ovat käteviä. Mielestäni koulussa pitäisi olla vähemmän kokeita. Mielestäni päästöjä pitäisi vähentää. Mielestäni sovellukset helpottavat elämää.</b>',
 tr:'In my opinion online shops are convenient. In my opinion there should be fewer exams at school. In my opinion emissions should be reduced. In my opinion apps make life easier.',
 drill:[['In my opinion apps make life easier.',['mielestäni sovellukset helpottavat elämää']],['In my opinion emissions should be reduced.',['mielestäni päästöjä pitäisi vähentää']],['In my opinion libraries should be open in the evening.',['mielestäni kirjastojen pitäisi olla auki illalla']]],
 next:'Lesson 120: checkpoint. Mock set 3 using the new vocabulary banks.'},
{n:120,title:'Checkpoint: mock set 3',
 win:'Write three short answers to three new practice prompts.',
 anchor:'Same coffee trigger. Pick one prompt below and write it in 10 minutes, then say "Yes!"',
 build:'These prompts are my own practice material, not real exam tasks. They use the vocabulary banks from Lessons 111 to 119. Plan for one minute (Lesson 83), write, then run the five passes (Lesson 79).',
 eq:[['Task 1','stem'],['Task 2','mark'],['Task 3','end'],['kokeilu 3','res']],
 eqNote:'kokeilu 3 = <em>trial run 3</em>',
 formula:'Plan 1 minute / write / proofread. Repeat for three tasks.',
 table:[['Task','Prompt (practice)','Key lessons'],['1 Informal','Ask a friend to help with a computer problem and offer something in return.','115, 88'],['2 Formal','Write to a property manager about rubbish in the yard.','113, 106'],['3 Opinion','Should museums be free?','116, 119, 60']],
 rule:'<strong>Self-check:</strong> Did Task 2 state how long the problem has lasted (perfect) and what you want done? Did Task 3 include a counterpoint and a conclusion? Did Task 1 stay friendly and short?',
 why:'Model answers:<br><b>Task 1:</b> Hei Anna! Voisitko auttaa minua tietokoneen kanssa? Sovellus ei toimi. En pääse tililleni. Voisit tulla käymään lauantaina. Tarjoan kahvit! Nähdään pian!<br><b>Task 2:</b> Aihe: Roskat pihalla. Hyvä isännöitsijä, Kirjoitan teille, koska pihalla on paljon roskia. Roskia ei ole viety pois viikkoon. Pyydän, että asia korjataan pian. Olisin kiitollinen, jos voisitte vastata. Ystävällisin terveisin, Aino Virtanen<br><b>Task 3:</b> Mielestäni museoiden pitäisi olla ilmaisia. Ensinnäkin kulttuuri kuuluu kaikille. Lisäksi ihmiset käyvät museoissa useammin. Toisaalta museot tarvitsevat rahaa. Kaiken kaikkiaan ilmaiset museot ovat hyvä asia.',
 tr:'Task 1: Hi Anna! Could you help me with the computer? The app does not work. I cannot get into my account. You could come over on Saturday. I will buy the coffee! See you soon! Task 2: Subject: Rubbish in the yard. Dear property manager, I am writing to you because there is a lot of rubbish in the yard. The rubbish has not been taken away for a week. I request that the matter be fixed soon. I would be grateful if you could reply. Kind regards, Aino Virtanen. Task 3: In my opinion museums should be free. First of all culture belongs to everyone. In addition people visit museums more often. On the other hand museums need money. All in all free museums are a good thing.',
 drill:[['There is a lot of rubbish in the yard.',['pihalla on paljon roskia']],['In my opinion museums should be free.',['mielestäni museoiden pitäisi olla ilmaisia']],['I will buy the coffee.',['tarjoan kahvit']]],
 next:'Lesson 121: genre depth begins with a stronger counterargument.'},
{n:121,title:'A stronger counterargument (On totta, että ...)',
 win:'Concede a point and then answer it in two sentences.',
 anchor:'Same coffee trigger. Write one concession and one answer, then say "Yes!"',
 build:'Lesson 55 gave you <em>toisaalta</em> and <em>vaikka</em>. A stronger counterargument first admits the other side is partly right and then explains why your position still holds. Two chunks do it: <em>On totta, että ...</em> (It is true that ...) and <em>Se ei kuitenkaan tarkoita, että ...</em> (That does not, however, mean that ...).',
 eq:[['On totta, että','mark'],['kouluissa on jo paljon oppiaineita','stem'],['Se ei kuitenkaan tarkoita, että','mark'],['ruoanlaitto ei olisi tärkeää','end'],['vastaväite','res']],
 eqNote:'vastaväite = <em>counterargument</em>',
 formula:'On totta, että + claim. Se ei kuitenkaan tarkoita, että + your point.',
 table:[['Finnish','English'],['On totta, että ...','It is true that ...'],['Se ei kuitenkaan tarkoita, että ...','That does not, however, mean that ...'],['Tämä on kyllä totta, mutta ...','This is indeed true, but ...'],['Siitä huolimatta ...','Despite that ...']],
 rule:'<strong>Handy.</strong> After <em>ei tarkoita, että</em> the conditional (<em>ei olisi</em>) softens the claim and sounds natural. <em>Tarkoittaa</em> (to mean) has the I-form <em>tarkoitan</em> (Lesson 99).',
 why:'A full model:<br><b>Mielestäni kaikkien pitäisi oppia ruoanlaittoa koulussa. On totta, että kouluissa on jo paljon oppiaineita. Se ei kuitenkaan tarkoita, että ruoanlaitto ei olisi tärkeää. Ruoanlaitto on taito, jota tarvitaan koko elämän ajan. Yhteenvetona voin sanoa, että ruoanlaitto kuuluu kouluun.</b>',
 tr:'In my opinion everyone should learn cooking at school. It is true that there are already many subjects at schools. That does not, however, mean that cooking would not be important. Cooking is a skill that is needed for the whole of life. In summary I can say that cooking belongs at school.',
 drill:[['It is true that ...',['on totta, että','on totta että']],['That does not, however, mean that ...',['se ei kuitenkaan tarkoita, että','se ei kuitenkaan tarkoita että']],['It is true that there are already many subjects at schools.',['on totta, että kouluissa on jo paljon oppiaineita','on totta että kouluissa on jo paljon oppiaineita']]],
 next:'Lesson 122: the letter to the editor (Toivon, että päättäjät ...).'},
{n:122,title:'The letter to the editor',
 win:'Write a short reader letter with a title, a problem and a call to action.',
 anchor:'Same coffee trigger. Write one title and one call to action, then say "Yes!"',
 build:'A reader letter (<em>mielipidekirjoitus</em>) has a title, a clear problem, one or two reasons and a call to action. The call to action names who should act: <em>Toivon, että päättäjät ...</em> (I hope the decision-makers ...) or <em>Kehotan kaikkia ...</em> (I urge everyone ...).',
 eq:[['Otsikko','stem'],['Ongelma','mark'],['Syy','mark'],['Kehotus','end'],['lukijan mielipide','res']],
 eqNote:'lukijan mielipide = <em>reader opinion</em>',
 formula:'Otsikko / problem sentence / reason / Toivon, että päättäjät ... / On aika ...',
 table:[['Finnish','English'],['Kaupungissamme on liian vähän ...','There are too few ... in our city.'],['Toivon, että päättäjät ...','I hope that the decision-makers ...'],['Kehotan kaikkia ...','I urge everyone ...'],['On aika tehdä päätös.','It is time to make a decision.'],['päättäjät','decision-makers']],
 rule:'<strong>Register.</strong> A reader letter is formal but personal. Use <em>minä</em> sparingly, give one concrete example and end with the call to action, not with thanks.',
 why:'A full model:<br><b>Otsikko: Lisää pyöräteitä kaupunkiin</b><br>Kaupungissamme on liian vähän pyöräteitä. Moni haluaisi pyöräillä töihin, mutta tiet ovat vaarallisia. Toivon, että päättäjät rakentavat lisää pyöräteitä. On aika tehdä päätös.',
 tr:'Title: More bike paths for the city. There are too few bike paths in our city. Many would like to cycle to work, but the roads are dangerous. I hope that the decision-makers build more bike paths. It is time to make a decision.',
 drill:[['decision-makers (one word)',['päättäjät']],['It is time to make a decision.',['on aika tehdä päätös']],['I hope that the decision-makers build more bike paths.',['toivon, että päättäjät rakentavat lisää pyöräteitä','toivon että päättäjät rakentavat lisää pyöräteitä']]],
 next:'Lesson 123: escalating a complaint (a reminder with a deadline).'},
{n:123,title:'Escalating a complaint',
 win:'Write a reminder that sets a deadline and names a next step.',
 anchor:'Same coffee trigger. Write the deadline sentence, then say "Yes!"',
 build:'When the first message gets no reply, write a reminder. It has three steps: mention the earlier message, state a deadline with <em>kolmen päivän kuluessa</em> (within three days), and say what you will do next with <em>Jos ... , ...</em>. Stay polite and factual.',
 eq:[['Tämä on toinen viestini','stem'],['kolmen päivän kuluessa','mark'],['Jos en saa vastausta','mark'],['otan yhteyttä','end'],['muistutus','res']],
 eqNote:'muistutus = <em>reminder</em>',
 formula:'earlier message + still no result + Pyydän vastausta (deadline). Jos en saa vastausta, otan yhteyttä ...',
 table:[['Finnish','English'],['Tämä on toinen viestini.','This is my second message.'],['Tuote ei ole vieläkään saapunut.','The product has still not arrived.'],['kolmen päivän kuluessa','within three days'],['Jos en saa vastausta, otan yhteyttä kuluttajaneuvontaan.','If I do not get a reply, I will contact consumer advice.']],
 rule:'<strong>Tone.</strong> State the consequence as a plan, not a threat. <em>Vieläkään</em> (still not) is the negative twin of <em>vielä</em> (Lesson 103). <em>Kuluttajaneuvonta</em> is the consumer advice service.',
 why:'A full model:<br><b>Aihe: Muistutus tilauksesta 12345</b><br><b>Hyvä vastaanottaja,</b><br>Kirjoitin teille 5. lokakuuta koskien tilaustani, mutta en ole saanut vastausta. Tuote ei ole vieläkään saapunut. Pyydän vastausta kolmen päivän kuluessa. Jos en saa vastausta, otan yhteyttä kuluttajaneuvontaan.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Reminder about order 12345. Dear recipient, I wrote to you on 5 October regarding my order, but I have not received a reply. The product has still not arrived. I request a reply within three days. If I do not get a reply, I will contact consumer advice. Kind regards, Aino Virtanen',
 drill:[['This is my second message.',['tämä on toinen viestini']],['within three days',['kolmen päivän kuluessa']],['If I do not get a reply, I will contact consumer advice.',['jos en saa vastausta, otan yhteyttä kuluttajaneuvontaan','jos en saa vastausta otan yhteyttä kuluttajaneuvontaan']]],
 next:'Lesson 124: the formal invitation (Meillä on ilo kutsua teidät ...).'},
{n:124,title:'The formal invitation',
 win:'Write a four-sentence formal invitation with date, place and a deadline.',
 anchor:'Same coffee trigger. Write the first two sentences, then say "Yes!"',
 build:'A formal invitation states who invites, what the event is, when and where, and until when to reply. The opener is <em>Meillä on ilo kutsua teidät ...</em> (We have the pleasure of inviting you ...). The place uses the present passive: <em>Tilaisuus järjestetään ...</em> (The event is held ...).',
 eq:[['Meillä on ilo','mark'],['kutsua teidät','stem'],['yhteiseen illalliseen','end'],['Meillä on ilo kutsua teidät yhteiseen illalliseen.','res']],
 eqNote:'= <em>We have the pleasure of inviting you to a joint dinner.</em>',
 formula:'Meillä on ilo kutsua teidät + event. Tilaisuus järjestetään + place. Ilmoittautukaa viimeistään + date.',
 table:[['Finnish','English'],['Meillä on ilo kutsua teidät ...','We have the pleasure of inviting you ...'],['Tilaisuus järjestetään ravintolassa.','The event is held at the restaurant.'],['Ilmoittautukaa viimeistään 6. marraskuuta.','Register by 6 November at the latest.'],['Toivomme, että pääsette paikalle.','We hope that you can attend.']],
 rule:'<strong>Handy.</strong> <em>Ilmoittautukaa</em> is the plural command (Lesson 21) of <em>ilmoittautua</em> (to register). <em>Viimeistään</em> means at the latest. <em>Päästä paikalle</em> means to be able to attend.',
 why:'A full model:<br><b>Hyvät kollegat,</b><br>Meillä on ilo kutsua teidät yhteiseen illalliseen perjantaina 13. marraskuuta kello 18. Tilaisuus järjestetään ravintolassa Aurinko. Ilmoittautukaa viimeistään 6. marraskuuta. Toivomme, että pääsette paikalle.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Dear colleagues, We have the pleasure of inviting you to a joint dinner on Friday 13 November at 18:00. The event is held at the restaurant Aurinko. Register by 6 November at the latest. We hope that you can attend. Kind regards, Aino Virtanen',
 drill:[['We have the pleasure of inviting you.',['meillä on ilo kutsua teidät']],['Register by 6 November at the latest.',['ilmoittautukaa viimeistään 6. marraskuuta']],['The event is held at the restaurant.',['tilaisuus järjestetään ravintolassa']]],
 next:'Lesson 125: reporting facts in a short summary.'},
{n:125,title:'Reporting facts in a short summary',
 win:'Rewrite three facts as two summary sentences.',
 anchor:'Same coffee trigger. Rewrite one fact with Tekstin mukaan, then say "Yes!"',
 build:'A summary reports the main points in your own words and does not copy sentences. Useful frames are <em>Tekstin mukaan ...</em> (According to the text ...) and <em>Tekstissä kerrotaan, että ...</em> (The text says that ...). Join two facts with <em>ja että</em>.',
 eq:[['Tekstissä kerrotaan','mark'],[', että','mark'],['kaupunki rakentaa kolme pyörätietä','end'],['yhteenveto','res']],
 eqNote:'yhteenveto = <em>summary</em>',
 formula:'Tekstin mukaan + fact.   Tekstissä kerrotaan, että + fact ja että + fact.',
 table:[['Finnish','English'],['Tekstin mukaan ...','According to the text ...'],['Tekstissä kerrotaan, että ...','The text says that ...'],['Pääkohdat ovat ...','The main points are ...'],['Lisäksi kerrotaan, että ...','In addition it says that ...']],
 rule:'<strong>Honest note.</strong> The task types I could verify (Lesson 81) do not include a summary task, so treat this as practice in reporting facts accurately, which messages and opinion texts also need. <em>Kerrotaan</em> is the present passive of <em>kertoa</em>.',
 why:'Source: <b>Kaupunki rakentaa kolme uutta pyörätietä. Hanke maksaa kaksi miljoonaa euroa. Työt alkavat keväällä.</b><br>Summary: <b>Tekstissä kerrotaan, että kaupunki rakentaa kolme uutta pyörätietä ja että työt alkavat keväällä. Hanke maksaa kaksi miljoonaa euroa.</b>',
 tr:'Source: The city is building three new bike paths. The project costs two million euros. The work starts in spring. Summary: The text says that the city is building three new bike paths and that the work starts in spring. The project costs two million euros.',
 drill:[['According to the text',['tekstin mukaan']],['The text says that',['tekstissä kerrotaan, että','tekstissä kerrotaan että']],['The main points are',['pääkohdat ovat']]],
 next:'Lesson 126: replying to a complaint (Pahoittelemme viivästystä).'},
{n:126,title:'Replying to a complaint',
 win:'Write a reply that apologizes, explains and offers a remedy.',
 anchor:'Same coffee trigger. Write the apology sentence, then say "Yes!"',
 build:'Sometimes you write for the other side. A reply thanks the customer, apologizes, says what will happen and offers a remedy. It uses <em>me</em> forms (Lesson 5) and the present passive for actions without a named doer (Lesson 106).',
 eq:[['Pahoittelemme','mark'],['viivästystä','end'],['Pahoittelemme viivästystä.','res']],
 eqNote:'= <em>We apologize for the delay.</em>',
 formula:'Kiitos viestistänne. + Pahoittelemme + problem. + plan. + remedy.',
 table:[['Finnish','English'],['Kiitos viestistänne.','Thank you for your message.'],['Pahoittelemme viivästystä.','We apologize for the delay.'],['Tuote lähetetään tänään.','The product is sent today.'],['Selvitämme asian.','We will look into the matter.'],['Hyvitämme toimituskulut.','We will refund the delivery costs.']],
 rule:'<strong>Handy.</strong> <em>Pahoitella</em> takes the partitive. The verbs <em>selvittää</em> (to look into) and <em>hyvittää</em> (to credit) have the we-forms <em>selvitämme</em> and <em>hyvitämme</em>.',
 why:'A full model:<br><b>Hyvä Aino Virtanen,</b><br>Kiitos viestistänne. Pahoittelemme viivästystä. Tuote lähetetään tänään. Hyvitämme toimituskulut.<br><b>Ystävällisin terveisin,</b><br>Asiakaspalvelu',
 tr:'Dear Aino Virtanen, Thank you for your message. We apologize for the delay. The product is sent today. We will refund the delivery costs. Kind regards, Customer service',
 drill:[['We apologize.',['pahoittelemme']],['Thank you for your message. (formal)',['kiitos viestistänne']],['The product is sent today.',['tuote lähetetään tänään']]],
 next:'Lesson 127: persuading with questions and images.'},
{n:127,title:'Persuading with questions and images',
 win:'Write one rhetorical question and one picture sentence.',
 anchor:'Same coffee trigger. Write a rhetorical question, then say "Yes!"',
 build:'Opinion texts persuade not only with reasons but also with a question that invites the reader to agree and a short picture that makes the point concrete. A negative question starts with <em>Eikö</em> (Is it not ...?). <em>Kuvittele</em> (imagine) is a command (Lesson 21).',
 eq:[['Eikö ole parempi','mark'],['matkustaa bussilla','end'],['Eikö ole parempi matkustaa bussilla?','res']],
 eqNote:'= <em>Is it not better to travel by bus?</em>',
 formula:'Eikö ole + comparative + verb in -a/-ä form?   |   Kuvittele, että + clause.',
 table:[['Finnish','English'],['Eikö ole parempi matkustaa bussilla kuin istua ruuhkassa?','Is it not better to travel by bus than to sit in a traffic jam?'],['Kuvittele, että kaupunki on hiljainen ja puhdas.','Imagine that the city is quiet and clean.'],['Se on mahdollista, jos jokainen tekee oman osansa.','It is possible if everyone does their part.'],['Kuka ei haluaisi ...?','Who would not like ...?']],
 rule:'<strong>Use sparingly.</strong> One rhetorical question and one picture sentence per text are enough. More feels like a speech. <em>Oma osa</em> (one\'s own part) takes <em>-nsa</em> in the 3rd person (<em>oman osansa</em>).',
 why:'A full model:<br><b>Eikö ole parempi matkustaa bussilla kuin istua ruuhkassa? Kuvittele, että kaupunki on hiljainen ja puhdas. Se on mahdollista, jos jokainen tekee oman osansa.</b>',
 tr:'Is it not better to travel by bus than to sit in a traffic jam? Imagine that the city is quiet and clean. It is possible if everyone does their part.',
 drill:[['Is it not better to travel by bus?',['eikö ole parempi matkustaa bussilla']],['Imagine that the city is quiet.',['kuvittele, että kaupunki on hiljainen','kuvittele että kaupunki on hiljainen']],['if everyone does their part',['jos jokainen tekee oman osansa']]],
 next:'Lesson 128: cohesion words (tällöin, tästä syystä, näin).'},
{n:128,title:'Cohesion words (tällöin, tästä syystä)',
 win:'Link three sentences with reference words.',
 anchor:'Same coffee trigger. Write two linked sentences, then say "Yes!"',
 build:'A text feels organized when each sentence points back to the one before. Reference words do this: <em>tämä</em> (this), <em>se</em> (it), <em>tällöin</em> (at that time, in that case), <em>tästä syystä</em> (for this reason) and <em>näin</em> (in this way).',
 eq:[['Kaupat ovat auki sunnuntaisin','stem'],['Tällöin','mark'],['moni ehtii ostoksille','end'],['yhtenäinen teksti','res']],
 eqNote:'yhtenäinen teksti = <em>a cohesive text</em>',
 formula:'sentence. + Tällöin / Tästä syystä / Näin + consequence.',
 table:[['Finnish','English'],['tämä / tuo / se','this / that / it'],['tällöin','at that time, in that case'],['tästä syystä','for this reason'],['näin','in this way'],['sunnuntaisin','on Sundays']],
 rule:'<strong>Handy.</strong> <em>Sunnuntaisin</em> (on Sundays) is a weekday plus <em>-isin</em> for a repeated habit. Use <em>tällöin</em> to refer to a situation you just described.',
 why:'A full model:<br><b>Kaupat ovat auki sunnuntaisin. Tällöin moni ehtii ostoksille. Tästä syystä asiakkaita on enemmän.</b>',
 tr:'The shops are open on Sundays. In that case many people have time to go shopping. For this reason there are more customers.',
 drill:[['for this reason',['tästä syystä']],['at that time (in that case)',['tällöin']],['on Sundays (one word)',['sunnuntaisin']]],
 next:'Lesson 129: adding numbers and approximations (noin, yli, alle).'},
{n:129,title:'Numbers and approximations (noin, yli, alle)',
 win:'Make one example concrete with a number.',
 anchor:'Same coffee trigger. Add one number to an example, then say "Yes!"',
 build:'Concrete numbers make examples convincing. Approximation words keep you accurate when you do not know the exact figure: <em>noin</em> (about), <em>yli</em> (over), <em>alle</em> (under), <em>melkein</em> (almost). Frequency uses <em>kertaa</em> and a period: <em>kolme kertaa viikossa</em>.',
 eq:[['kolme','stem'],['kertaa','mark'],['viikossa','end'],['kolme kertaa viikossa','res']],
 eqNote:'= <em>three times a week</em>',
 formula:'noin / yli / alle + number + partitive noun',
 table:[['Finnish','English'],['noin','about'],['yli','over'],['alle','under'],['melkein joka päivä','almost every day'],['kolme kertaa viikossa','three times a week']],
 rule:'<strong>Accuracy.</strong> Do not invent statistics about real groups. Use your own life as the example (<em>minä</em>, <em>ystäväni</em>), which is true and easy to write.',
 why:'A full model:<br><b>Esimerkiksi minä matkustan bussilla noin kolme kertaa viikossa. Matka maksaa alle kolme euroa. Ystäväni käyttää bussia melkein joka päivä.</b>',
 tr:'For example I travel by bus about three times a week. The trip costs under three euros. My friend uses the bus almost every day.',
 drill:[['about (one word)',['noin']],['almost every day',['melkein joka päivä']],['three times a week',['kolme kertaa viikossa']]],
 next:'Lesson 130: checkpoint. Mock set 4 for genre depth.'},
{n:130,title:'Checkpoint: mock set 4',
 win:'Write three genre-depth answers to three new practice prompts.',
 anchor:'Same coffee trigger. Pick one prompt below and write it in 10 minutes, then say "Yes!"',
 build:'These prompts are my own practice material, not real exam tasks. They use the genre-depth tools from Lessons 121 to 129: a formal invitation, an escalated complaint and a reader letter with a strong counterargument.',
 eq:[['Task 1','stem'],['Task 2','mark'],['Task 3','end'],['kokeilu 4','res']],
 eqNote:'kokeilu 4 = <em>trial run 4</em>',
 formula:'Plan 1 minute / write / proofread. Repeat for three tasks.',
 table:[['Task','Prompt (practice)','Key lessons'],['1 Formal','Invite colleagues to a joint lunch and ask them to register.','124'],['2 Formal','Write a reminder about a refund you have still not received.','123, 102'],['3 Opinion','Reader letter: should the city have more parks?','121, 122']],
 rule:'<strong>Self-check:</strong> Does Task 2 name a deadline and a next step? Does Task 3 concede a point before answering it and end with a call to action? Does Task 1 give date, place and a reply deadline?',
 why:'Model answers:<br><b>Task 1:</b> Hyvät kollegat, Meillä on ilo kutsua teidät yhteiseen lounaaseen keskiviikkona 18. marraskuuta kello 12. Tilaisuus järjestetään yrityksen ruokalassa. Ilmoittautukaa viimeistään 13. marraskuuta. Ystävällisin terveisin, Aino Virtanen<br><b>Task 2:</b> Aihe: Muistutus palautuksesta. Hyvä vastaanottaja, Palautin tuotteen 1. lokakuuta. En ole vieläkään saanut hyvitystä. Pyydän hyvitystä kolmen päivän kuluessa. Jos en saa vastausta, otan yhteyttä kuluttajaneuvontaan. Ystävällisin terveisin, Aino Virtanen<br><b>Task 3:</b> Otsikko: Lisää puistoja kaupunkiin. Kaupungissamme on liian vähän puistoja. Puistot tekevät kaupungista viihtyisämmän. Moni haluaisi viettää aikaa luonnossa. On totta, että puistojen rakentaminen maksaa. Se ei kuitenkaan tarkoita, että meillä ei olisi varaa siihen. Toivon, että päättäjät tekevät oikean päätöksen.',
 tr:'Task 1: Dear colleagues, We have the pleasure of inviting you to a joint lunch on Wednesday 18 November at 12:00. The event is held in the company canteen. Register by 13 November at the latest. Kind regards, Aino Virtanen. Task 2: Subject: Reminder about a return. Dear recipient, I returned the product on 1 October. I have still not received a refund. I request a refund within three days. If I do not get a reply, I will contact consumer advice. Kind regards, Aino Virtanen. Task 3: Title: More parks for the city. There are too few parks in our city. Parks make the city more pleasant. Many would like to spend time in nature. It is true that building parks costs money. That does not, however, mean that we could not afford it. I hope that the decision-makers make the right decision.',
 drill:[['We have the pleasure of inviting you to a joint lunch.',['meillä on ilo kutsua teidät yhteiseen lounaaseen']],['I have still not received a refund.',['en ole vieläkään saanut hyvitystä']],['It is true that building parks costs money.',['on totta, että puistojen rakentaminen maksaa rahaa','on totta että puistojen rakentaminen maksaa rahaa','on totta, että puistojen rakentaminen maksaa','on totta että puistojen rakentaminen maksaa']]],

{n:131,title:'Timed set 1: three tasks in 55 minutes',
 win:'Run one full timed set under exam conditions.',
 anchor:'Same coffee trigger. Set a 55-minute timer, then say "Yes!" and start.',
 build:'Timed practice builds the habit of planning, writing and proofreading under pressure. Use the split from Lesson 83: about 10 minutes for the short task, 15 for the middle task, 20 for the opinion task and 8 for proofreading. Write all three answers before you look at the models below. The prompts are my own practice material, not real exam tasks.',
 eq:[['10 min','stem'],['15 min','mark'],['20 min','mark'],['8 min','end'],['55 min','res']],
 eqNote:'= <em>a suggested split of the 55 minutes</em>',
 formula:'Plan 1 minute / write / proofread. Repeat for three tasks.',
 table:[['Task','Prompt (practice)','Key lessons'],['1 Informal','Tell a friend you got a new job and invite them to celebrate.','28, 29, 22, 25'],['2 Formal','Complain to a hotel about a room that was not clean and ask for a partial refund.','50, 92, 95'],['3 Opinion','Should employers offer flexible working hours?','60, 117, 119']],
 rule:'<strong>Rules of the run.</strong> No dictionary, no notes, no models until the timer ends. If you get stuck on a word, use a recovery phrase (Lesson 99) and move on. Then compare your texts with the models and score them with the rubric in Lesson 132.',
 why:'Model answers:<br><b>Task 1:</b> Hei Anna! Mitä kuuluu? Sain uuden työn! Aloitan maanantaina kaupassa myyjänä. Haluaisin juhlia sitä kanssasi. Sopiiko perjantaina kello seitsemän? Mennään ravintolaan! Tarjoan illallisen. Nähdään pian!<br><b>Task 2:</b> Aihe: Valitus hotellihuoneesta. Hyvä vastaanottaja, Otan yhteyttä koskien oleskeluani hotellissanne 5.–7. lokakuuta. Huone ei ollut siisti, kun saavuin. Kerroin asiasta vastaanotossa, mutta ongelmaa ei korjattu. En ole tyytyväinen palveluun. Pyydän, että palautatte osan maksusta. Odotan vastaustanne. Ystävällisin terveisin, Aino Virtanen<br><b>Task 3:</b> Nykyään joustavista työajoista keskustellaan paljon. Mielestäni työnantajien pitäisi tarjota joustavia työaikoja. Ensinnäkin ihmiset jaksavat paremmin. Lisäksi perheen kanssa on enemmän aikaa. Toisaalta kaikki työt eivät sovi joustaville ajoille. Yhteenvetona voin sanoa, että joustavat työajat ovat hyvä asia.',
 tr:'Task 1: Hi Anna! How are you? I got a new job! I start on Monday in a shop as a salesperson. I would like to celebrate it with you. Does Friday at seven suit? Let us go to a restaurant! I will treat you to dinner. See you soon! Task 2: Subject: Complaint about a hotel room. Dear recipient, I am contacting you regarding my stay at your hotel on 5 to 7 October. The room was not clean when I arrived. I told reception about it, but the problem was not fixed. I am not satisfied with the service. I request that you refund part of the payment. I await your reply. Kind regards, Aino Virtanen. Task 3: Nowadays flexible working hours are discussed a lot. In my opinion employers should offer flexible working hours. First of all people cope better. In addition there is more time with the family. On the other hand not all jobs suit flexible hours. In summary I can say that flexible working hours are a good thing.',
 drill:[['I got a new job!',['sain uuden työn']],['The room was not clean when I arrived.',['huone ei ollut siisti, kun saavuin','huone ei ollut siisti kun saavuin']],['In my opinion employers should offer flexible working hours.',['mielestäni työnantajien pitäisi tarjota joustavia työaikoja']]],
 next:'Lesson 132: a scoring checklist so you can mark your own sets.'},
{n:132,title:'A scoring checklist for self-marking',
 win:'Mark one answer on five criteria.',
 anchor:'Same coffee trigger. Score one of your Set 1 answers, then say "Yes!"',
 build:'You cannot improve what you do not measure. Score each answer on five criteria, 0 to 2 points each, so a task scores up to 10 and a set up to 30. <strong>This rubric is my own, built from common writing criteria. It is not the official YKI rubric.</strong> Ask a teacher or a native speaker to confirm your scores.',
 eq:[['Coverage','stem'],['Structure','mark'],['Vocabulary','mark'],['Accuracy','mark'],['Cohesion','end'],['0 to 10','res']],
 eqNote:'= <em>five criteria, up to 10 points per task</em>',
 formula:'coverage + structure and register + vocabulary + accuracy + cohesion',
 table:[['Criterion','What to check (0 = missing, 1 = partly, 2 = fully)','Lessons'],['Coverage','Did every prompt verb get an answer?','82'],['Structure and register','Right frame (Hei or Hyvä vastaanottaja) and a clear order of parts','3, 94, 100'],['Vocabulary','Topic words and some variety, no repeated hyvä','111 to 119, 139'],['Accuracy','Cases, gradation, harmony, verb endings, commas','71 to 78'],['Cohesion','Connectors and reference words link the sentences','61, 62, 128']],
 rule:'<strong>How to use it.</strong> Score right after finishing, then fix the lowest criterion in the next set. Accuracy errors are easiest to fix with the error log (Lesson 133).',
 why:'Marking practice:<br>Before: <b>Hei Anna! Sain uusi työ. Aloitan maanantaina kaupassa. Haluan juhlia sen. Sopiiko perjantaina kello seitsemän</b><br>After: <b>Hei Anna! Sain uuden työn. Aloitan maanantaina kaupassa. Haluan juhlia sitä. Sopiiko perjantaina kello seitsemän?</b><br>Three accuracy errors (object case twice, missing question mark) lower the accuracy score to 1.',
 tr:'Before: Hi Anna! I got a new job (object case wrong). I start on Monday in the shop. I want to celebrate it (case wrong). Does Friday at seven suit (no question mark). After: Hi Anna! I got a new job. I start on Monday in the shop. I want to celebrate it. Does Friday at seven suit?',
 drill:[['Correct this: Sain uusi työ.',['sain uuden työn']],['Correct this: Haluan juhlia sen.',['haluan juhlia sitä']],['Correct this: Odotan vastaus.',['odotan vastausta']]],
 next:'Lesson 133: building your error log.'},
{n:133,title:'Your personal error log',
 win:'Write down three of your own errors with the rule for each.',
 anchor:'Same coffee trigger. Add one error to your log, then say "Yes!"',
 build:'Most writers repeat the same five or six errors. An error log catches them. Each entry has four parts: the wrong form, the right form, the rule and the lesson number. Review the log before each timed set, and drop an entry once you have got it right three sets in a row.',
 eq:[['Wrong','stem'],['Right','mark'],['Rule','mark'],['Lesson','end'],['virhelokki','res']],
 eqNote:'virhelokki = <em>error log</em>',
 formula:'wrong / right / rule / lesson',
 table:[['Wrong (✗)','Right (✓)','Rule','Lesson'],['Sain uusi työ.','Sain uuden työn.','whole object takes -n','72'],['kysyn tilaus','kysyn tilauksesta','ask about takes the elative','71'],['kirjoittan','kirjoitan','tt becomes t before -n','73'],['Kirjoitan koska ...','Kirjoitan, koska ...','comma before koska','76'],['kaksi liput','kaksi lippua','after a number use the singular partitive','78'],['työssa','työssä','front vowels need ä','74']],
 rule:'<strong>Keep it short.</strong> Five to ten live entries are enough. Turn each one into a drill sentence you can say aloud. A log with fifty entries will not be reviewed.',
 why:'A paragraph built from log entries, all corrected:<br><b>Sain uuden työn. Kirjoitan teille, koska haluaisin kysyä tilauksesta. Työssä on hyvä palvelu.</b>',
 tr:'I got a new job. I am writing to you because I would like to ask about the order. There is good service at work.',
 drill:[['Correct this: kysyn tilaus',['kysyn tilauksesta']],['Correct this: kaksi liput',['kaksi lippua']],['Correct this: työssa',['työssä']]],

{n:134,title:'Timed set 2: three tasks in 55 minutes',
 win:'Run a second full timed set and score it.',
 anchor:'Same coffee trigger. Set a 55-minute timer, then say "Yes!" and start.',
 build:'Same rules as Set 1: plan one minute per task, write, proofread, and keep the models closed until the timer ends. Then score each answer with the rubric from Lesson 132 and add new errors to your log. These prompts are my own practice material, not real exam tasks.',
 eq:[['Task 1','stem'],['Task 2','mark'],['Task 3','end'],['sarja 2','res']],
 eqNote:'sarja 2 = <em>set 2</em>',
 formula:'Plan 1 minute / write / proofread. Repeat for three tasks.',
 table:[['Task','Prompt (practice)','Key lessons'],['1 Informal','Advise a friend who is moving to a new city.','88, 89, 21'],['2 Formal','Ask about a flat for rent and request a viewing.','85, 91, 48'],['3 Opinion','Is studying remotely a good thing?','60, 61, 64']],
 rule:'<strong>Compare with Set 1.</strong> Did your total go up? Which criterion is still lowest? That criterion is the target for the next set.',
 why:'Model answers:<br><b>Task 1:</b> Hei Anna! Kuulin, että muutat Ouluun. Suosittelen, että etsit asunnon läheltä keskustaa. Kannattaa myös ostaa pyörä, koska siellä on paljon pyöräteitä. Voin auttaa muutossa, jos haluat. Nähdään pian!<br><b>Task 2:</b> Aihe: Kysymys vuokra-asunnosta. Hyvä vastaanottaja, Otan yhteyttä koskien vuokra-asuntoa osoitteessa Kuusitie 5. Haluaisin tietää, onko asunto vielä vapaana. Haluaisin tietää myös, paljonko vuokra on ja milloin voin tulla katsomaan asuntoa. Olisin kiitollinen, jos voisitte vastata pian. Ystävällisin terveisin, Aino Virtanen<br><b>Task 3:</b> Nykyään etäopiskelusta keskustellaan paljon. Mielestäni etäopiskelu on hyvä asia. Ensinnäkin se säästää aikaa, koska ei tarvitse matkustaa. Lisäksi opiskelija voi opiskella omaan tahtiin. Toisaalta etäopiskelu voi olla yksinäistä. Kaiken kaikkiaan etuna on joustavuus.',
 tr:'Task 1: Hi Anna! I heard that you are moving to Oulu. I recommend that you look for an apartment near the centre. It is also worth buying a bike, because there are many bike paths there. I can help with the move, if you want. See you soon! Task 2: Subject: Question about a flat for rent. Dear recipient, I am contacting you regarding the flat for rent at Kuusitie 5. I would like to know whether the flat is still available. I would also like to know how much the rent is and when I can come to see the flat. I would be grateful if you could reply soon. Kind regards, Aino Virtanen. Task 3: Nowadays studying remotely is discussed a lot. In my opinion studying remotely is a good thing. First of all it saves time, because there is no need to travel. In addition the student can study at their own pace. On the other hand studying remotely can be lonely. All in all the advantage is flexibility.',
 drill:[['I recommend that you look for an apartment near the centre.',['suosittelen, että etsit asunnon läheltä keskustaa','suosittelen että etsit asunnon läheltä keskustaa']],['I would like to know whether the flat is still available.',['haluaisin tietää, onko asunto vielä vapaana','haluaisin tietää onko asunto vielä vapaana']],['Remote studying saves time.',['etäopiskelu säästää aikaa']]],
