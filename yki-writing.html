 table:[['English','Finnish','Lesson'],['Hi Anna!','Hei Anna!','3'],['Thanks for the invitation!','Kiitos kutsusta!','23'],['Unfortunately I cannot come','Valitettavasti en voi tulla','23'],['Does Friday suit?','Sopiiko perjantaina?','24'],['Let us meet tomorrow','Tavataan huomenna','22'],['Call me tomorrow','Soita minulle huomenna','21'],['I have to go to work','Minun täytyy mennä töihin','37'],['Hopefully you come','Toivottavasti tulet','31'],['See you soon','Nähdään pian','22'],['How are you?','Mitä kuuluu?','29'],['It was nice','Se oli kivaa','29'],['And you?','Entä sinä?','29']],

 why:'A message stitched from the cards:<br><b>Hei Anna! Mitä kuuluu? Kiitos kutsusta! Valitettavasti en voi tulla perjantaina, koska minun täytyy mennä töihin. Sopiiko lauantaina? Tavataan silloin kahville. Entä sinä? Toivottavasti tulet. Nähdään pian!</b>',

 win:'Recall twelve formal chunks with the Finnish covered.',

 table:[['English','Finnish','Lesson'],['Dear recipient,','Hyvä vastaanottaja,','3'],['I am contacting you regarding my order','Otan yhteyttä koskien tilaustani','41'],['I ordered the product on 5 October','Tilasin tuotteen 5. lokakuuta','43'],['The product is broken','Tuote on rikki','18'],['I am not satisfied with the service','En ole tyytyväinen palveluun','44'],['I would like to get a new product','Haluaisin saada uuden tuotteen','45'],['I did not get a reply','En saanut vastausta','95'],['I have not received a reply','En ole saanut vastausta','102'],['I would be grateful if you could reply soon','Olisin kiitollinen, jos voisitte vastata pian','49'],['You can call me','Voitte soittaa minulle','47'],['Thanks in advance','Kiitos jo etukäteen','46'],['Kind regards,','Ystävällisin terveisin,','3']],

 why:'A complaint stitched from the cards:<br><b>Hyvä vastaanottaja, Otan yhteyttä koskien tilaustani. Tilasin tuotteen 5. lokakuuta. Tuote on rikki. En ole tyytyväinen palveluun. Haluaisin saada uuden tuotteen. En ole saanut vastausta. Olisin kiitollinen, jos voisitte vastata pian. Voitte soittaa minulle. Kiitos jo etukäteen. Ystävällisin terveisin,</b>',
 tr:'Dear recipient, I am contacting you regarding my order. I ordered the product on 5 October. The product is broken. I am not satisfied with the service. I would like to get a new product. I have not received a reply. I would be grateful if you could reply soon. You can call me. Thanks in advance. Kind regards,',

 win:'Recall twelve opinion chunks with the Finnish covered.',
 anchor:'Same coffee trigger. Cover the Finnish column and say four chunks aloud, then say "Yes!"',

 eqNote:'kertaus = <em>review</em>',
 formula:'cover / say aloud / check / repeat on day 1, 3 and 7',
 table:[['English','Finnish','Lesson'],['Nowadays this is discussed a lot','Nykyään tästä keskustellaan paljon','52'],['In my opinion','Mielestäni','16'],['First of all','Ensinnäkin','39'],['In addition','Lisäksi','61'],['For example','Esimerkiksi','54'],['On the other hand','Toisaalta','55'],['It is true that','On totta, että','121'],['That does not, however, mean that','Se ei kuitenkaan tarkoita, että','121'],['Some think that','Jotkut ajattelevat, että','56'],['An advantage is that','Etuna on, että','58'],['All in all','Kaiken kaikkiaan','59'],['In summary I can say that','Yhteenvetona voin sanoa, että','59']],
 rule:'<strong>Order check.</strong> Say the chunks in the order of a text: topic, position, reasons, counterpoint, weighing, conclusion.',
 why:'An opinion stitched from the cards:<br><b>Nykyään tästä keskustellaan paljon. Mielestäni neljän päivän työviikko on hyvä ajatus. Ensinnäkin ihmiset jaksavat paremmin. Lisäksi vapaa-aikaa on enemmän. Esimerkiksi minä voisin viettää enemmän aikaa perheen kanssa. Toisaalta jotkut ajattelevat, että työt eivät ehdi valmistua. Kaiken kaikkiaan etuna on parempi jaksaminen. Yhteenvetona voin sanoa, että neljän päivän työviikko on hyvä ajatus.</b>',
 tr:'Nowadays this is discussed a lot. In my opinion a four-day working week is a good idea. First of all people cope better. In addition there is more free time. For example I could spend more time with my family. On the other hand some think that the work will not get finished. All in all an advantage is better coping. In summary I can say that a four-day working week is a good idea.',
 drill:[['First of all (one word)',['ensinnäkin']],['An advantage is that',['etuna on, että','etuna on että']],['In summary I can say that',['yhteenvetona voin sanoa, että','yhteenvetona voin sanoa että']]],

{n:138,title:'Timed set 3: three tasks in 55 minutes',
 win:'Run a third full timed set and compare your scores.',
 anchor:'Same coffee trigger. Set a 55-minute timer, then say "Yes!" and start.',
 build:'Run this set only after reviewing your error log and one retrieval list (Lessons 133 to 137). Score all three answers with the rubric and compare the totals across Sets 1, 2 and 3. These prompts are my own practice material, not real exam tasks.',
 eq:[['Task 1','stem'],['Task 2','mark'],['Task 3','end'],['sarja 3','res']],
 eqNote:'sarja 3 = <em>set 3</em>',
 formula:'Plan 1 minute / write / proofread. Repeat for three tasks.',
 table:[['Task','Prompt (practice)','Key lessons'],['1 Informal','Tell a friend about a trip and recommend a place.','89, 88'],['2 Formal','Apply for a Finnish course.','87, 85'],['3 Opinion','Should children have a phone in lessons?','60, 121']],
 rule:'<strong>After the set.</strong> Add at least three new entries to your error log, and write one sentence about what you will do differently in the next set.',
 why:'Model answers:<br><b>Task 1:</b> Hei Anna! Mitä kuuluu? Viime viikolla kävin Turussa. Matka oli mukava ja rauhallinen. Suosittelen, että käyt siellä joskus. Kannattaa mennä kesällä, koska silloin joella on paljon tapahtumia. Nähdään pian!<br><b>Task 2:</b> Aihe: Hakemus suomen kielen kurssille. Hyvä vastaanottaja, Haen suomen kielen kurssille, joka alkaa tammikuussa. Olen asunut Suomessa kaksi vuotta ja haluaisin kehittää kirjoitustaitoani. Voin osallistua kurssille iltaisin. Kiitos jo etukäteen. Ystävällisin terveisin, Aino Virtanen<br><b>Task 3:</b> Mielestäni lapsilla ei pitäisi olla puhelinta oppitunneilla. Ensinnäkin puhelin vie huomion pois opetuksesta. Lisäksi oppilaat keskustelevat enemmän välitunnilla, jos puhelimia ei ole. On totta, että puhelin voi auttaa opiskelussa. Se ei kuitenkaan tarkoita, että sitä tarvitaan koko ajan. Yhteenvetona voin sanoa, että puhelimen käyttöä pitäisi rajoittaa oppitunneilla.',
 tr:'Task 1: Hi Anna! How are you? Last week I visited Turku. The trip was nice and calm. I recommend that you go there sometime. It is worth going in summer, because then there are many events by the river. See you soon! Task 2: Subject: Application for a Finnish course. Dear recipient, I am applying for the Finnish course that starts in January. I have lived in Finland for two years and would like to develop my writing skills. I can take part in the course in the evenings. Thanks in advance. Kind regards, Aino Virtanen. Task 3: In my opinion children should not have a phone in lessons. First of all a phone takes attention away from teaching. In addition pupils talk more during the break if there are no phones. It is true that a phone can help in studying. That does not, however, mean that it is needed all the time. In summary I can say that phone use should be limited in lessons.',
 drill:[['I am applying for a Finnish course.',['haen suomen kielen kurssille']],['I can take part in the course in the evenings.',['voin osallistua kurssille iltaisin']],['In my opinion children should not have a phone in lessons.',['mielestäni lapsilla ei pitäisi olla puhelinta oppitunneilla']]],

{n:139,title:'Polishing style and variety',
 win:'Rewrite one repetitive paragraph with varied words.',
 anchor:'Same coffee trigger. Replace one repeated word in a text of yours, then say "Yes!"',
 build:'After accuracy comes style. Repeating <em>hyvä</em>, <em>asia</em> and <em>se on</em> in every sentence makes a text flat. Replace them with precise words from your banks. Never trade accuracy for variety: a simple correct word beats a fancy wrong one.',
 eq:[['hyvä','stem'],['→','mark'],['hyödyllinen','end'],['monipuolisempi teksti','res']],
 eqNote:'monipuolisempi teksti = <em>a more varied text</em>',
 formula:'repeated word → a more exact word',
 table:[['Overused','Alternatives','English'],['hyvä','hyödyllinen, kätevä, mukava, tärkeä','good → useful, convenient, pleasant, important'],['asia','ajatus, ratkaisu, käytäntö','thing → idea, solution, practice'],['koska','sillä (formal)','because'],['ja','sekä (formal)','and, as well as'],['se on','that is: asia on niin, että ...','rephrase the verb']],
 rule:'<strong>One change at a time.</strong> Change at most two words per paragraph. Check the endings of every new word: <em>hyödyllinen</em> becomes <em>hyödyllistä</em> after <em>on</em> with an abstract subject.',
 why:'Before: <b>Mielestäni etätyö on hyvä asia. Se on hyvä, koska se on helppoa. Se on myös hyvä ympäristölle.</b><br>After: <b>Mielestäni etätyö on hyödyllinen. Se on käytännöllistä, koska matkoja ei tarvita. Lisäksi se on ympäristöystävällistä.</b>',
 tr:'Before: In my opinion remote work is a good thing. It is good, because it is easy. It is also good for the environment. After: In my opinion remote work is useful. It is practical, because trips are not needed. In addition it is environmentally friendly.',
 drill:[['useful (one word)',['hyödyllinen']],['convenient (one word)',['kätevä']],['solution (one word)',['ratkaisu']]],

{n:140,title:'Final checkpoint: the week before the exam',
 win:'Plan seven days of practice and write one capstone opinion text.',
 anchor:'Same coffee trigger. Write your seven-day plan on one page, then say "Yes!"',
 build:'This lesson turns the course into a routine. The plan below is my suggestion. Adjust it to your exam date and your weakest criterion. Treat the official demo tasks as the most realistic practice available, and have a teacher or native speaker read one of your texts.',
 eq:[['7 päivää','stem'],['3 sarjaa','mark'],['virhelokki','mark'],['demo','end'],['valmistautuminen','res']],
 eqNote:'valmistautuminen = <em>preparation</em>',
 formula:'timed set / error log / retrieval / timed set / polish / official demo / light review',
 table:[['Day','Focus','Lessons'],['1','Timed set and scoring','131, 132'],['2','Error log review and drills','133'],['3','Retrieval cards A, B and C','135 to 137'],['4','Second timed set','134'],['5','Polish a text for variety','139'],['6','Official demo tasks (Solki, Jyväskylä), timed','81, 83'],['7','Light review of the notebook, rest','100']],
 rule:'<strong>Honest limits.</strong> No course can promise a grade. The plan raises your chances by making the skills automatic. On exam day use the routine from Lesson 99: read the verbs, plan for a minute, write short correct sentences, proofread.',
 why:'A capstone opinion text:<br><b>Nykyään koulupäivän alkamisajasta keskustellaan paljon. Mielestäni koulupäivän pitäisi alkaa myöhemmin. Ensinnäkin nuoret jaksavat paremmin, kun he saavat nukkua enemmän. Lisäksi oppitunnit ovat tehokkaampia, koska oppilaat ovat virkeämpiä. On totta, että vanhempien työpäivät alkavat aikaisin. Se ei kuitenkaan tarkoita, että muutos olisi mahdoton. Yhteenvetona voin sanoa, että myöhäisempi aloitusaika on kokeilun arvoinen.</b>',
 tr:'Nowadays the starting time of the school day is discussed a lot. In my opinion the school day should start later. First of all young people cope better when they get to sleep more. In addition lessons are more effective, because pupils are more alert. It is true that parents\' working days start early. That does not, however, mean that the change would be impossible. In summary I can say that a later starting time is worth trying.',
 drill:[['Nowadays this is discussed a lot.',['nykyään tästä keskustellaan paljon']],['It is true that ...',['on totta, että','on totta että']],['In summary I can say that ...',['yhteenvetona voin sanoa, että','yhteenvetona voin sanoa että']]],
 next:'You have finished lessons 1 to 140. Keep doing timed sets, update your error log, use the official demo tasks, and have a teacher or native speaker check your writing.'}
];
const TR0={"3": "Dear recipient, I would like to ask about the job. Kind regards, Aino Virtanen", "7": "Dear recipient, I am writing to you because I would like to ask about the order. Could you tell me when the order arrives? Kind regards, Aino Virtanen", "14": "Hi Anna! I cannot come tomorrow, because I am at work. See you!", "19": "Dear recipient, I am writing to you because my order is late. I request a reply soon. Kind regards, Aino Virtanen", "20": "Dear recipient, I am writing to you because my order is late. I asked about my order yesterday. I request a reply soon. Thank you for your help. Kind regards, Aino Virtanen", "21": "Hi Anna! Call me tomorrow. Tell me whether you are coming along. See you!", "22": "Hi Anna! Let us meet tomorrow. Let us go for coffee! See you!", "23": "Hi Anna! Thanks for the invitation! Unfortunately I cannot come tomorrow, because I am at work. See you soon!", "24": "Hi Anna! Thanks for the invitation! Unfortunately I cannot come tomorrow. Does Friday suit? See you!", "25": "Hi Anna! Let us meet on Friday at 15:00. Let us go for coffee! See you!", "28": "Yesterday I went to the shop and made food. I ate at home.", "29": "Hi Anna! How are you? At the weekend I went to the shop and made food. I ate at home. It was nice. And you? See you soon!", "30": "Hi Anna! Thanks for the invitation! Unfortunately I cannot come on Friday, because I am at work. Does Saturday at three suit? Where shall we meet? See you soon!", "31": "Hi Anna! Sorry that I answer late. What a pity that you cannot come! Hopefully we will see each other soon. Thank you very much!", "39": "In my opinion it is good. First of all it is cheap. Secondly it is fast. Finally I want to say that it is good.", "40": "Hi Anna! How are you? Yesterday I bought two tickets to the movies. Let us go to the movies on Saturday! I have to go to work on Friday, but on Saturday I have time. Does seven o'clock suit? See you soon!", "50": "Subject: Complaint about the order. Dear recipient, I am contacting you regarding my order. I ordered the product on 5 October. The order number is 12345. The product is broken. I am not satisfied with the product. I would like to get a new product. I would be grateful if you could reply soon. You can call me at 040 123 4567. Thanks in advance. Kind regards, Aino Virtanen"};
L.forEach(l=>{if(TR0[l.n]&&!l.tr)l.tr=TR0[l.n]});
let cur=0;
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().trim().replace(/[.!,?]$/,'').replace(/\s+/g,' ');
let done={};try{done=JSON.parse(localStorage.getItem('yki-done')||'{}')}catch(e){}
function saveDone(){try{localStorage.setItem('yki-done',JSON.stringify(done))}catch(e){}}
function eqHTML(e){return e.map((x,i)=>{let op=i==e.length-2?'=':(i<e.length-1?'+':'');return (i?'<span class="op">'+op+'</span>':'')+'<span class="t '+x[1]+'">'+x[0]+'</span>'}).join('').replace(/<span class="op"><\/span>/g,'')}
function tableHTML(t){return '<div class="scroll"><table><tr>'+t[0].map(h=>'<th>'+h+'</th>').join('')+'</tr>'+t.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>'}
function lessonHTML(l,i){
 return '<section class="lesson" id="L'+i+'"><h1 style="font-size:1.6rem">Lesson '+l.n+' of '+L.length+': '+l.title+'</h1>'+
 '<div class="win"><strong>Today\'s tiny win:</strong> '+l.win+'</div>'+
 '<h2>Anchor</h2><p>'+l.anchor+'</p>'+
 '<h2>Build on what you know</h2><p>'+l.build+'</p><div class="eq">'+eqHTML(l.eq)+'</div><p>'+l.eqNote+'</p>'+
 '<h2>Formula '+l.n+'</h2><div class="formula">'+l.formula+'</div>'+tableHTML(l.table)+'<p>'+l.rule+'</p>'+
 '<h2>Why this matters for B2</h2><p>'+l.why+'</p>'+(l.tr?'<p class="tr"><strong>Translation:</strong> '+l.tr+'</p>':'')+
 '<h2>Your minimal action (30 seconds)</h2><div class="drill">'+
 l.drill.map((d,j)=>'<div class="q"><span class="p">'+(j+1)+'. '+d[0]+'</span><input type="text" aria-label="Answer '+(j+1)+'" data-a="'+d[1].join('|')+'" autocomplete="off" spellcheck="false"><button data-check>Check</button><span class="r" aria-live="polite"></span><div class="ans">Answer: '+(d[2]||(d[1][0].charAt(0).toUpperCase()+d[1][0].slice(1)+'.'))+'</div></div>').join('')+
 '</div><label class="done"><input type="checkbox" data-done="'+l.n+'"'+(done[l.n]?' checked':'')+'> I wrote my one sentence</label>'+
 '<p style="margin-top:20px"><strong>Next.</strong> '+l.next+'</p>'+
 '<div class="nav"><button data-go="'+(i-1)+'"'+(i?'':' disabled style="visibility:hidden"')+'>Previous lesson</button><button data-go="'+(i+1)+'"'+(i<L.length-1?'':' disabled style="visibility:hidden"')+'>Next lesson</button></div></section>'}
function render(){
 $('#bar').innerHTML='<label class="sel">Lesson <select id="jump" aria-label="Jump to lesson">'+L.map((l,i)=>'<option value="'+i+'"'+(i==cur?' selected':'')+'>'+l.n+'. '+l.title.replace(/</g,'&lt;')+(done[l.n]?' ✓':'')+'</option>').join('')+'</select></label><span class="grow"></span><button class="pri" id="pdf">Save as PDF</button>';
 $('#app').innerHTML=L.map(lessonHTML).join('');
 document.querySelectorAll('.lesson')[cur].classList.add('on');
}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');
 if(g&&!g.disabled){cur=+g.dataset.go;render();window.scrollTo(0,0);return}
 if(e.target.id==='pdf'){window.print();return}
 if(e.target.matches('[data-check]')){
  const q=e.target.closest('.q'),inp=q.querySelector('input'),r=q.querySelector('.r');
  const ok=inp.dataset.a.split('|').includes(norm(inp.value));
  r.textContent=ok?'Correct':'Not yet. Check the vowel harmony and the ending.';
  r.className='r '+(ok?'good':'bad');
 }
});
document.addEventListener('change',e=>{
 if(e.target.dataset.done){done[e.target.dataset.done]=e.target.checked;saveDone();
  document.querySelectorAll('#jump option').forEach((o,i)=>o.textContent=L[i].n+'. '+L[i].title+(done[L[i].n]?' ✓':''));}
 if(e.target.id==='jump'){cur=+e.target.value;render();window.scrollTo(0,0);}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.q input'))e.target.nextElementSibling.click()});
render();
</script>
</body>
</html>
