 table:[['Slot','Pattern','Lessons'],['Greeting','Hei Anna! Mitä kuuluu?','3, 29'],['Story','Eilen ostin kaksi lippua elokuvaan.','28, 32, 33'],['Invitation','Mennään lauantaina elokuviin!','22, 24, 26'],['Need','Minun täytyy mennä perjantaina töihin, mutta lauantaina minulla on aikaa.','13, 35, 37'],['Question','Sopiiko kello seitsemän?','24, 25'],['Closing','Nähdään pian!','22']],
 rule:'<strong>Self-check:</strong> Is the story in the past tense? Does each object take the right case (<em>-n</em> for whole, partitive for amounts and negatives)? Is the time after <em>kello</em>? Does the invitation use a let-us form? Does the message end with a friendly closing?',
 why:'A full model:<br><b>Hei Anna! Mitä kuuluu?</b><br>Eilen ostin kaksi lippua elokuvaan. Mennään lauantaina elokuviin! Minun täytyy mennä perjantaina töihin, mutta lauantaina minulla on aikaa. Sopiiko kello seitsemän?<br><b>Nähdään pian!</b><br>The informal block ends here. Next comes the formal-message block.',
 drill:[['Yesterday I bought two tickets.',['eilen ostin kaksi lippua']],['Let us go to the movies on Saturday.',['mennään lauantaina elokuviin']],['I must go to work tomorrow.',['minun täytyy mennä huomenna töihin','minun täytyy mennä töihin huomenna']]],
 next:'Lesson 41: formal messages in depth, starting with the formal opening paragraph.'},
{n:41,title:'The formal opener (koskien tilaustani)',
 win:'Open a formal message with the word koskien.',
 anchor:'Same coffee trigger. Write Otan yhteyttä koskien tilaustani once, then say "Yes!"',
 build:'The formal block begins. A formal opener names the topic right away. <em>Koskien</em> (regarding) takes the <strong>partitive</strong> (Lesson 11), and you can add <code>-ni</code> (Lesson 15): tilausta + ni = tilaustani. <em>Otan yhteyttä</em> means I am contacting you.',
 eq:[['Otan yhteyttä','stem'],['koskien','mark'],['tilaustani','end'],['Otan yhteyttä koskien tilaustani.','res']],
 eqNote:'= <em>I am contacting you regarding my order.</em>',
 formula:'Otan yhteyttä / Kirjoitan teille + koskien + partitive noun (+ ni)',
 table:[['Opener','English'],['Kirjoitan teille koskien tilaustani.','I am writing to you regarding my order.'],['Otan yhteyttä koskien tilaustani.','I am contacting you regarding my order.'],['Otan yhteyttä koskien palvelua.','I am contacting you regarding the service.'],['Otan yhteyttä koskien laskua.','I am contacting you regarding the invoice.']],
 rule:'<strong>Why this matters.</strong> The first sentence tells the reader the topic. <em>Otan</em> is the I-form of <em>ottaa</em> (to take). <em>Lasku</em> (invoice, partitive <em>laskua</em>) is a useful business word.',
 why:'A formal opening paragraph:<br><b>Hyvä vastaanottaja,</b><br>Otan yhteyttä koskien tilaustani.',
 drill:[['I am contacting you',['otan yhteyttä']],['regarding my order',['koskien tilaustani']],['I am writing to you regarding my order.',['kirjoitan teille koskien tilaustani']]],
 next:'Lesson 42: subject lines (Kysymys tilauksesta, Valitus palvelusta).'},
{n:42,title:'Subject lines (Aihe: Kysymys tilauksesta)',
 win:'Write one subject line with no verb.',
 anchor:'Same coffee trigger. Write Aihe: Kysymys tilauksesta once, then say "Yes!"',
 build:'A subject line is a noun phrase: no verb and no full stop. You already own the pattern <em>noun + elative</em> from Lesson 8. Put <em>Aihe:</em> (subject) in front of it.',
 eq:[['Kysymys','stem'],['tilauksesta','end'],['Aihe: Kysymys tilauksesta','res']],
 eqNote:'= <em>Subject: Question about the order</em>',
 formula:'Aihe: + noun + elative',
 table:[['Subject line','English'],['Aihe: Kysymys tilauksesta','Subject: Question about the order'],['Aihe: Valitus palvelusta','Subject: Complaint about the service'],['Aihe: Pyyntö avusta','Subject: Request for help'],['Aihe: Tilaus 12345','Subject: Order 12345']],
 rule:'<strong>Handy nouns.</strong> <em>kysymys</em> (question), <em>valitus</em> (complaint), <em>pyyntö</em> (request), <em>reklamaatio</em> (formal complaint about a product).',
 why:'A message begins here:<br><b>Aihe: Kysymys tilauksesta</b><br><b>Hyvä vastaanottaja,</b><br>Otan yhteyttä koskien tilaustani.',
 drill:[['question about the order',['kysymys tilauksesta']],['complaint about the service',['valitus palvelusta']],['request for help',['pyyntö avusta']]],
 next:'Lesson 43: dates and order details (5. lokakuuta).'},
{n:43,title:'Dates and details (5. lokakuuta)',
 win:'Give one date correctly.',
 anchor:'Same coffee trigger. Write Tilasin tuotteen 5. lokakuuta once, then say "Yes!"',
 build:'A formal message needs facts. Finnish writes a date as <strong>day + dot + month in the partitive</strong>: 5. lokakuuta. The month names below are already in the partitive form you need after a day number.',
 eq:[['5.','stem'],['lokakuuta','end'],['5. lokakuuta','res']],
 eqNote:'= <em>on 5 October</em>',
 formula:'day + . + month (partitive)',
 table:[['Month (partitive)','English'],['tammikuuta','January'],['helmikuuta','February'],['maaliskuuta','March'],['huhtikuuta','April'],['toukokuuta','May'],['kesäkuuta','June'],['heinäkuuta','July'],['elokuuta','August'],['syyskuuta','September'],['lokakuuta','October'],['marraskuuta','November'],['joulukuuta','December']],
 rule:'<strong>Combine.</strong> <em>Tilata</em> (to order) has the I-form <em>tilaan</em> and the past <em>tilasin</em>. With the accusative from Lesson 32: <em>Tilasin tuotteen.</em>',
 why:'Details the reader needs:<br><b>Tilasin tuotteen 5. lokakuuta. Tilauksen numero on 12345.</b><br>(I ordered the product on 5 October. The order number is 12345.)',
 drill:[['on 5 October',['5. lokakuuta']],['I ordered the product',['tilasin tuotteen']],['The order number is 12345.',['tilauksen numero on 12345']]],
 next:'Lesson 44: saying you are not satisfied (En ole tyytyväinen palveluun).'},
{n:44,title:'Dissatisfaction (En ole tyytyväinen palveluun)',
 win:'State dissatisfaction in one sentence.',
 anchor:'Same coffee trigger. Write En ole tyytyväinen palveluun once, then say "Yes!"',
 build:'<em>Tyytyväinen</em> (satisfied) combines with <em>olen</em> (Lesson 16) and the negation <em>en ole</em> (Lesson 18). It takes the <strong>illative</strong> (the inner "into" ending from Lesson 26): palvelu + un = palveluun.',
 eq:[['En ole tyytyväinen','stem'],['palveluun','end'],['En ole tyytyväinen palveluun.','res']],
 eqNote:'= <em>I am not satisfied with the service.</em>',
 formula:'(En) ole(n) tyytyväinen + illative noun',
 table:[['Noun','Illative','English'],['palvelu','palveluun','the service'],['tuote','tuotteeseen','the product'],['vastaus','vastaukseen','the answer'],['hinta','hintaan','the price'],['laatu','laatuun','the quality']],
 rule:'<strong>Spelling check.</strong> Many nouns repeat the last vowel (palvelu becomes palveluun). Nouns with an <em>e</em> stem take <em>-seen</em> (tuotteeseen, vastaukseen).',
 why:'A balanced pair:<br><b>Olen tyytyväinen hintaan, mutta en ole tyytyväinen palveluun.</b><br>(I am satisfied with the price, but I am not satisfied with the service.)',
 drill:[['I am not satisfied with the service.',['en ole tyytyväinen palveluun']],['with the product (one word)',['tuotteeseen']],['with the answer (one word)',['vastaukseen']]],
 next:'Lesson 45: asking for a remedy (Pyydän korvausta).'},
{n:45,title:'Asking for a remedy (Pyydän korvausta)',
 win:'Name the remedy you want.',
 anchor:'Same coffee trigger. Write Pyydän korvausta once, then say "Yes!"',
 build:'After the problem comes the remedy. You already own <em>Pyydän + partitive</em> (Lesson 19) and <em>Haluaisin saada</em> (Lessons 2 and 36). Add three remedy nouns: <em>korvaus</em> (compensation), a new product and your money back.',
 eq:[['Haluaisin saada','stem'],['uuden tuotteen','end'],['Haluaisin saada uuden tuotteen.','res']],
 eqNote:'= <em>I would like to get a new product.</em> (<em>uusi</em> becomes <em>uuden</em>.)',
 formula:'Pyydän + partitive   |   Haluaisin saada + object',
 table:[['Remedy','Finnish'],['Compensation','Pyydän korvausta.'],['A new product','Haluaisin saada uuden tuotteen.'],['Money back','Haluaisin saada rahat takaisin.'],['A reply','Pyydän vastausta pian.']],
 rule:'<strong>Order of strength.</strong> Pick the remedy that fits: ask for a reply, then for a new product, then for compensation. <em>Takaisin</em> means back.',
 why:'A complete formal middle:<br><b>Tuote on rikki. En ole tyytyväinen tuotteeseen. Haluaisin saada uuden tuotteen.</b><br>(The product is broken. I am not satisfied with the product. I would like to get a new product.)',
 drill:[['I request compensation.',['pyydän korvausta']],['I would like to get a new product.',['haluaisin saada uuden tuotteen']],['I would like to get the money back.',['haluaisin saada rahat takaisin']]],
 next:'Lesson 46: formal closing lines (Odotan vastaustanne).'},
{n:46,title:'Formal closing lines (Odotan vastaustanne)',
 win:'Close a formal message with two sentences.',
 anchor:'Same coffee trigger. Write Odotan vastaustanne once, then say "Yes!"',
 build:'A formal message ends with a short expectation and a thank-you before the closing. <em>Odottaa</em> (to wait, to expect) has the I-form <em>odotan</em>. <em>Vastaustanne</em> is <em>vastausta</em> plus <code>-nne</code> (Lesson 15).',
 eq:[['vastausta','stem'],['nne','end'],['vastaustanne','res']],
 eqNote:'vastaustanne = <em>your reply (formal)</em>',
 formula:'Odotan vastaustanne. Kiitos jo etukäteen. Ystävällisin terveisin,',
 table:[['Finnish','English'],['Odotan vastaustanne.','I await your reply.'],['Toivon pikaista vastausta.','I hope for a prompt reply.'],['Kiitos jo etukäteen.','Thanks in advance.'],['Ystävällisin terveisin,','Kind regards,']],
 rule:'<strong>Choose one.</strong> Use <em>Odotan</em> when you are firm, <em>Toivon</em> when you are gentle. <em>Pikainen</em> (prompt) takes the partitive here: <em>pikaista</em>.',
 why:'A complete closing:<br><b>Odotan vastaustanne. Kiitos jo etukäteen.</b><br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 drill:[['I await your reply.',['odotan vastaustanne']],['Thanks in advance.',['kiitos jo etukäteen']],['I hope for a prompt reply.',['toivon pikaista vastausta']]],
 next:'Lesson 47: contact details (Puhelinnumeroni on, Voitte soittaa minulle).'},
{n:47,title:'Contact details (Voitte soittaa minulle)',
 win:'Give your phone number in one sentence.',
 anchor:'Same coffee trigger. Write Puhelinnumeroni on ... once, then say "Yes!"',
 build:'Formal messages often end with how to reach you. <em>Puhelinnumero</em> (phone number) takes <code>-ni</code> (Lesson 15). <em>Voitte</em> is the formal you-form of <em>voida</em> (Lesson 6). <em>Soittaa</em> (to call) and <em>minulle</em> (to me) come from Lesson 21.',
 eq:[['Voitte','stem'],['soittaa','mark'],['minulle','end'],['Voitte soittaa minulle.','res']],
 eqNote:'= <em>You can call me.</em>',
 formula:'Puhelinnumeroni on ...   |   Voitte soittaa minulle.',
 table:[['Finnish','English'],['Puhelinnumeroni on 040 123 4567.','My phone number is 040 123 4567.'],['Sähköpostiosoitteeni on aino@example.fi.','My email address is aino@example.fi.'],['Voitte soittaa minulle.','You can call me.'],['Voitte ottaa yhteyttä.','You can contact me.']],
 rule:'<strong>Handy.</strong> The conjugation of <em>voida</em>: voin, voit, voi, voimme, voitte, voivat. The formal reader gets <em>voitte</em>.',
 why:'A contact line:<br><b>Voitte soittaa minulle numeroon 040 123 4567.</b><br>(You can call me at 040 123 4567.) <em>Numeroon</em> is the illative of <em>numero</em>.',
 drill:[['My phone number is',['puhelinnumeroni on']],['You can call me.',['voitte soittaa minulle']],['You can contact me.',['voitte ottaa yhteyttä']]],
 next:'Lesson 48: indirect questions (Haluaisin tietää, onko ...).'},
{n:48,title:'Indirect questions (Haluaisin tietää, onko ...)',
 win:'Ask what you want to know without a question mark.',
 anchor:'Same coffee trigger. Write Haluaisin tietää, milloin tilaus saapuu once, then say "Yes!"',
 build:'An indirect question sits inside a statement. <strong>Yes/no questions keep -ko/-kö</strong>, and the meaning becomes <em>whether</em>. Open questions keep their question word (Lesson 27). Put a comma before the question part.',
 eq:[['Haluaisin tietää','stem'],[', onko','mark'],['tuote saatavilla','end'],['Haluaisin tietää, onko tuote saatavilla.','res']],
 eqNote:'= <em>I would like to know whether the product is available.</em>',
 formula:'Haluaisin tietää, + question word or verb-ko + rest.',
 table:[['Finnish','English'],['Haluaisin tietää, onko tuote saatavilla.','I would like to know whether the product is available.'],['Haluaisin tietää, milloin tilaus saapuu.','I would like to know when the order arrives.'],['Haluaisin tietää, paljonko tuote maksaa.','I would like to know how much the product costs.']],
 rule:'<strong>Reuse.</strong> <em>Tietää</em> (to know) has the I-form <em>tiedän</em>. <em>Maksaa</em> (to cost) uses the he/she form <em>maksaa</em>. <em>Saatavilla</em> (available) is a chunk.',
 why:'Direct versus indirect:<br>Direct: <b>Milloin tilaus saapuu?</b><br>Indirect: <b>Haluaisin tietää, milloin tilaus saapuu.</b><br>The indirect version sounds more formal.',
 drill:[['I would like to know',['haluaisin tietää']],['when the order arrives',['milloin tilaus saapuu']],['whether the product is available',['onko tuote saatavilla']]],
 next:'Lesson 49: if-clauses for politeness (Olisin kiitollinen, jos voisitte ...).'},
{n:49,title:'Politeness with jos (Olisin kiitollinen, jos ...)',
 win:'Write the classic formal request in one sentence.',
 anchor:'Same coffee trigger. Write Olisin kiitollinen, jos voisitte vastata once, then say "Yes!"',
 build:'The most useful formal request in Finnish combines two conditionals. <em>Olisin kiitollinen</em> (I would be grateful) is the conditional of <em>olla</em> plus <em>kiitollinen</em>. Then <em>jos</em> (if, Lesson 13) introduces the thing you ask, using <em>voisitte</em> (Lesson 7).',
 eq:[['Olisin kiitollinen','stem'],[', jos','mark'],['voisitte vastata pian','end'],['Olisin kiitollinen, jos voisitte vastata pian.','res']],
 eqNote:'= <em>I would be grateful if you could reply soon.</em>',
 formula:'Olisin kiitollinen, jos voisitte + verb in -a/-ä form',
 table:[['Finnish','English'],['Olisin kiitollinen, jos voisitte vastata pian.','I would be grateful if you could reply soon.'],['Olisin kiitollinen, jos voisitte auttaa.','I would be grateful if you could help.'],['Jos mahdollista, haluaisin saada uuden tuotteen.','If possible, I would like to get a new product.']],
 rule:'<strong>Comma rule.</strong> The comma goes before <em>jos</em> (Lesson 13). <em>Jos mahdollista</em> (if possible) is a short chunk you can put before a request.',
 why:'A top formal request:<br><b>Olisin kiitollinen, jos voisitte vastata pian.</b><br>Placed before the closing, it sounds polite and clear.',
 drill:[['I would be grateful',['olisin kiitollinen']],['if possible',['jos mahdollista']],['I would be grateful if you could reply soon.',['olisin kiitollinen, jos voisitte vastata pian','olisin kiitollinen jos voisitte vastata pian']]],
 next:'Lesson 50: formal checkpoint. Build a complete formal complaint with subject, details, problem, remedy and contact line.'},

 win:'Write a ten-slot formal complaint from memory.',
 anchor:'Same coffee trigger. Fill all ten slots once with your own details, then say "Yes!"',
 build:'Fifty lessons have produced a complete formal kit. This template connects the subject line (Lesson 42), opener (41), details (43 and 34), problem (18), dissatisfaction (44), remedy (45), polite request (49), contact line (47) and closing (46 and 3).',
 eq:[['Subject','stem'],['Greeting','stem'],['Opener','mark'],['Details','mark'],['Problem','mark'],['Remedy','end'],['Request','end'],['Contact','end'],['Closing','end'],['viesti','res']],
 eqNote:'viesti = <em>message</em>',
 formula:'Aihe / Hyvä vastaanottaja, / Opener / Details / Problem and feeling / Remedy / Request / Contact / Closing',
 table:[['Slot','Pattern','Lessons'],['Subject','Aihe: Valitus tilauksesta','42'],['Greeting','Hyvä vastaanottaja,','3'],['Opener','Otan yhteyttä koskien tilaustani.','41'],['Details','Tilasin tuotteen 5. lokakuuta. Tilauksen numero on 12345.','34, 43'],['Problem','Tuote on rikki.','18'],['Feeling','En ole tyytyväinen tuotteeseen.','44'],['Remedy','Haluaisin saada uuden tuotteen.','45'],['Request','Olisin kiitollinen, jos voisitte vastata pian.','49'],['Contact','Voitte soittaa minulle numeroon 040 123 4567.','47'],['Closing','Kiitos jo etukäteen. Ystävällisin terveisin, Aino Virtanen','46']],

 why:'A full model:<br><b>Aihe: Valitus tilauksesta</b><br><b>Hyvä vastaanottaja,</b><br>Otan yhteyttä koskien tilaustani. Tilasin tuotteen 5. lokakuuta. Tilauksen numero on 12345. Tuote on rikki. En ole tyytyväinen tuotteeseen. Haluaisin saada uuden tuotteen. Olisin kiitollinen, jos voisitte vastata pian. Voitte soittaa minulle numeroon 040 123 4567. Kiitos jo etukäteen.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen<br>The formal block (41 to 50) ends here.',

 next:'Lesson 51: the opinion text begins. We will learn the structure: topic, position, reasons, conclusion.'},
{n:51,title:'Taking a position (Olen sitä mieltä, että ...)',
 win:'State your opinion with one of four starters.',
 anchor:'Same coffee trigger. Write one opinion sentence, then say "Yes!"',
 build:'An opinion text starts by stating your position. You already own <em>Mielestäni</em> (Lesson 16). Three more starters give you variety. All of them take a comma before <em>että</em> (Lesson 13).',
 eq:[['Olen sitä mieltä','stem'],[', että','mark'],['se on hyvä asia','end'],['Olen sitä mieltä, että se on hyvä asia.','res']],
 eqNote:'= <em>I am of the opinion that it is a good thing.</em>',
 formula:'Starter + , että + clause',
 table:[['Starter','English'],['Mielestäni se on hyvä asia.','In my opinion it is a good thing.'],['Olen sitä mieltä, että se on hyvä asia.','I am of the opinion that it is a good thing.'],['Ajattelen, että se on hyvä asia.','I think that it is a good thing.'],['Uskon, että se on hyvä asia.','I believe that it is a good thing.']],
 rule:'<strong>Variety wins.</strong> Use two different starters in one text, not the same one twice. <em>Ajatella</em> (to think) has the I-form <em>ajattelen</em>. <em>Uskoa</em> (to believe) has the I-form <em>uskon</em>.',
 why:'A position paragraph:<br><b>Olen sitä mieltä, että se on hyvä asia. Uskon, että se on tärkeä.</b>',
 tr:'I am of the opinion that it is a good thing. I believe that it is important.',
 drill:[['In my opinion it is good.',['mielestäni se on hyvä']],['I am of the opinion that it is a good thing.',['olen sitä mieltä, että se on hyvä asia','olen sitä mieltä että se on hyvä asia']],['I believe that it is important.',['uskon, että se on tärkeä','uskon että se on tärkeä']]],
 next:'Lesson 52: introducing the topic (Nykyään tästä keskustellaan paljon).'},
{n:52,title:'Introducing the topic (Nykyään tästä keskustellaan)',
 win:'Open an opinion text with a topic sentence.',
 anchor:'Same coffee trigger. Write one topic sentence, then say "Yes!"',
 build:'Before your position, one sentence introduces the topic. Finnish often uses the <code>-taan/-tään</code> form from Lesson 22 in a new job: <strong>people do</strong>, with no subject named. <em>Keskustellaan</em> = it is discussed.',
 eq:[['Nykyään','stem'],['tästä','mark'],['keskustellaan paljon','end'],['Nykyään tästä keskustellaan paljon.','res']],
 eqNote:'= <em>Nowadays this is discussed a lot.</em> (<em>tästä</em> = about this)',
 formula:'Nykyään + tästä keskustellaan paljon.   |   Aihe on tärkeä.',
 table:[['Finnish','English'],['Nykyään tästä keskustellaan paljon.','Nowadays this is discussed a lot.'],['Aihe on tärkeä.','The topic is important.'],['Aiheesta on monta mielipidettä.','There are many opinions on the topic.'],['Kysymys on ajankohtainen.','The question is topical.']],
 rule:'<strong>Handy.</strong> After <em>monta</em> (many) the noun is singular partitive: <em>monta mielipidettä</em>, like <em>kaksi lippua</em> (Lesson 33).',
 why:'A topic sentence plus position:<br><b>Nykyään tästä keskustellaan paljon. Aihe on tärkeä, ja mielestäni se on hyvä asia.</b>',
 tr:'Nowadays this is discussed a lot. The topic is important, and in my opinion it is a good thing.',
 drill:[['nowadays (one word)',['nykyään']],['The topic is important.',['aihe on tärkeä']],['There are many opinions about the topic.',['aiheesta on monta mielipidettä']]],
 next:'Lesson 53: giving reasons (siksi, tämän vuoksi, syy on se, että).'},
{n:53,title:'Giving reasons (siksi, tämän vuoksi)',
 win:'Link a reason and a result in two sentences.',
 anchor:'Same coffee trigger. Write a reason and a result, then say "Yes!"',
 build:'You know <em>koska</em> (because). Opinion texts also need words that point forward to a result: <em>siksi</em> (therefore) and <em>tämän vuoksi</em> (for this reason). They start the second sentence.',
 eq:[['Se on halpa.','stem'],['Siksi','mark'],['moni ostaa sen.','end'],['Se on halpa. Siksi moni ostaa sen.','res']],
 eqNote:'= <em>It is cheap. That is why many people buy it.</em>',
 formula:'Reason. + Siksi / Tämän vuoksi + result.',
 table:[['Finnish','English'],['koska','because (reason after)'],['siksi','therefore (result after)'],['tämän vuoksi','for this reason'],['Syy on se, että se on halpa.','The reason is that it is cheap.']],
 rule:'<strong>Direction check.</strong> <em>Koska</em> introduces the reason. <em>Siksi</em> introduces the result. Mixing them up flips the logic. <em>Moni</em> (many a person) takes a singular verb: <em>moni ostaa</em>.',
 why:'Cause and effect in an opinion:<br><b>Se on halpa. Siksi moni ostaa sen. Tämän vuoksi pidän siitä.</b><br><em>Pitää + elative</em> means to like.',
 tr:'It is cheap. That is why many buy it. For this reason I like it.',
 drill:[['therefore (one word)',['siksi']],['for this reason',['tämän vuoksi']],['The reason is that it is cheap.',['syy on se, että se on halpa','syy on se että se on halpa']]],
 next:'Lesson 54: examples (esimerkiksi, omasta kokemuksestani).'},
{n:54,title:'Giving examples (esimerkiksi)',
 win:'Support your reason with one example.',
 anchor:'Same coffee trigger. Write one example sentence, then say "Yes!"',
 build:'A claim becomes convincing with an example. Two openers do the job: <em>esimerkiksi</em> (for example) and <em>omasta kokemuksestani</em> (from my own experience). The second is <em>kokemus</em> plus the elative (Lesson 8) and <code>-ni</code> (Lesson 15).',
 eq:[['kokemukse','stem'],['sta','end'],['ni','mark'],['kokemuksestani','res']],
 eqNote:'kokemuksestani = <em>from my experience</em>',
 formula:'Esimerkiksi + clause.   |   Omasta kokemuksestani tiedän, että + clause.',
 table:[['Finnish','English'],['Esimerkiksi minä ostan ruokaa kaupasta.','For example I buy food from the shop.'],['Omasta kokemuksestani tiedän, että palvelu on tärkeää.','From my own experience I know that service is important.'],['Esimerkiksi ystäväni työskentelee hotellissa.','For example my friend works in a hotel.']],
 rule:'<strong>Handy.</strong> <em>Tiedän</em> is the I-form of <em>tietää</em> (Lesson 48). The word <em>oma</em> (own) is <em>omasta</em> in the elative, matching <em>kokemuksestani</em>.',
 why:'A reason with an example:<br><b>Palvelu on tärkeää. Esimerkiksi minä ostan ruokaa kaupasta, jossa palvelu on hyvä.</b>',
 tr:'Service is important. For example I buy food from a shop where the service is good.',
 drill:[['for example (one word)',['esimerkiksi']],['from my own experience',['omasta kokemuksestani']],['For example I buy food from the shop.',['esimerkiksi ostan ruokaa kaupasta','esimerkiksi minä ostan ruokaa kaupasta']]],
 next:'Lesson 55: contrast (toisaalta, kuitenkin, vaikka).'},
{n:55,title:'Contrast (toisaalta, kuitenkin, vaikka)',
 win:'Add one counterpoint that keeps your position.',
 anchor:'Same coffee trigger. Write a counterpoint, then say "Yes!"',
 build:'Strong opinion texts admit another side and then return to the main position. Three words handle this: <em>toisaalta</em> (on the other hand), <em>kuitenkin</em> (however) and <em>vaikka</em> (although). <em>Vaikka</em> brings a comma, like <em>koska</em> (Lesson 13).',
 eq:[['Vaikka se on kallis','stem'],[',','mark'],['se on hyvä','end'],['Vaikka se on kallis, se on hyvä.','res']],
 eqNote:'= <em>Although it is expensive, it is good.</em>',
 formula:'Toisaalta + clause.   |   Se on kuitenkin + clause.   |   Vaikka + clause, + clause.',
 table:[['Finnish','English'],['Toisaalta se on kallis.','On the other hand it is expensive.'],['Se on kuitenkin hyvä.','It is, however, good.'],['Vaikka se on kallis, se on hyvä.','Although it is expensive, it is good.']],
 rule:'<strong>Structure.</strong> Put the counterpoint in the middle and the return to your position at the end. <em>Kuitenkin</em> can sit inside the sentence after the verb.',
 why:'A balanced paragraph:<br><b>Toisaalta se on kallis. Se on kuitenkin hyvä asia, koska palvelu on nopea.</b>',
 tr:'On the other hand it is expensive. It is, however, a good thing, because the service is fast.',
 drill:[['on the other hand (one word)',['toisaalta']],['however (one word)',['kuitenkin']],['Although it is expensive, it is good.',['vaikka se on kallis, se on hyvä','vaikka se on kallis se on hyvä']]],
 next:'Lesson 56: other opinions (Jotkut ajattelevat, että ...).'},
{n:56,title:'Other people\'s opinions (Jotkut ajattelevat)',
 win:'Mention an opposing view and respond to it.',
 anchor:'Same coffee trigger. Write one sentence about what others think, then say "Yes!"',
 build:'A good text names the opposing view and answers it. <em>Jotkut</em> (some) and <em>monet</em> (many) take the plural verb <em>ajattelevat</em> (they think, built like Lesson 5). Then you respond with <em>En kuitenkaan ole samaa mieltä.</em>',
 eq:[['Jotkut ajattelevat','stem'],[', että','mark'],['se on kallis','end'],['Jotkut ajattelevat, että se on kallis.','res']],
 eqNote:'= <em>Some think that it is expensive.</em>',
 formula:'Jotkut / Monet ajattelevat, että + clause.   |   En kuitenkaan ole samaa mieltä.',
 table:[['Finnish','English'],['Jotkut ajattelevat, että se on kallis.','Some think that it is expensive.'],['Monet ajattelevat, että se on huono.','Many think that it is bad.'],['En kuitenkaan ole samaa mieltä.','I do not, however, agree.'],['Olen eri mieltä.','I disagree.'],['Ymmärrän, mutta olen eri mieltä.','I understand, but I disagree.']],
 rule:'<strong>Handy.</strong> <em>Ymmärtää</em> (to understand) has the I-form <em>ymmärrän</em>. Place the response right after the opposing view so the reader follows your thinking.',
 why:'Opposing view and reply:<br><b>Jotkut ajattelevat, että se on kallis. En kuitenkaan ole samaa mieltä, koska hinta on hyvä.</b>',
 tr:'Some think that it is expensive. I do not, however, agree, because the price is good.',
 drill:[['Some think that it is expensive.',['jotkut ajattelevat, että se on kallis','jotkut ajattelevat että se on kallis']],['I disagree.',['olen eri mieltä']],['I understand, but I disagree.',['ymmärrän, mutta olen eri mieltä','ymmärrän mutta olen eri mieltä']]],
 next:'Lesson 57: degree words (liian, erittäin, melko, hyvin).'},
{n:57,title:'Degree words (liian, erittäin, melko)',
 win:'Adjust one adjective with a degree word.',
 anchor:'Same coffee trigger. Write one sentence with a degree word, then say "Yes!"',
 build:'Strong writers do not only say good or bad. They say how good. Degree words sit before the adjective and never change: <em>liian</em> (too), <em>erittäin</em> (extremely), <em>hyvin</em> (very), <em>melko</em> (quite), <em>vähän</em> (a little).',
 eq:[['Se on','stem'],['melko','mark'],['halpa','end'],['Se on melko halpa.','res']],
 eqNote:'= <em>It is quite cheap.</em>',
 formula:'on + degree word + adjective',
 table:[['Finnish','English'],['Se on liian kallis.','It is too expensive.'],['Se on erittäin hyvä.','It is extremely good.'],['Palvelu on hyvin nopea.','The service is very fast.'],['Se on melko halpa.','It is quite cheap.'],['Se on vähän hidas.','It is a little slow.']],
 rule:'<strong>Note.</strong> Degree words are <em>adverbs</em>. They stay in the same form whatever the case of the adjective. Use them to be precise, not to inflate everything.',
 why:'Precision in an opinion:<br><b>Hinta on melko korkea, mutta palvelu on erittäin hyvä.</b>',
 tr:'The price is quite high, but the service is extremely good.',
 drill:[['too (one word)',['liian']],['extremely (one word)',['erittäin']],['It is quite cheap.',['se on melko halpa']]],
 next:'Lesson 58: advantages and disadvantages (Etuna on, että ...).'},
{n:58,title:'Advantages and disadvantages (Etuna on ...)',
 win:'Name one advantage and one disadvantage.',
 anchor:'Same coffee trigger. Write one advantage and one disadvantage, then say "Yes!"',
 build:'Opinion tasks reward balanced weighing. <em>Etu</em> (advantage) and <em>haitta</em> (disadvantage) take the essive ending <code>-na</code> (Lesson 24) to mean <em>as an advantage</em>: <em>etuna</em>, <em>haittana</em>.',
 eq:[['Etuna','stem'],['on','mark'],[', että se on halpa','end'],['Etuna on, että se on halpa.','res']],
 eqNote:'= <em>An advantage is that it is cheap.</em>',
 formula:'Etuna / Haittana on, että + clause.',
 table:[['Finnish','English'],['Etuna on, että se on halpa.','An advantage is that it is cheap.'],['Haittana on, että se on hidas.','A disadvantage is that it is slow.'],['Siitä on hyötyä.','It is useful. (There is benefit from it.)'],['etu / haitta / hyöty','advantage / disadvantage / benefit']],
 rule:'<strong>Handy.</strong> <em>Hyötyä</em> is the partitive of <em>hyöty</em> (benefit). <em>Siitä</em> means from it. Together they form a ready-made chunk.',
 why:'Weighing both sides:<br><b>Etuna on, että se on halpa. Haittana on, että se on vähän hidas. Kaiken kaikkiaan siitä on hyötyä.</b>',
 tr:'An advantage is that it is cheap. A disadvantage is that it is a little slow. All in all it is useful.',
 drill:[['The advantage is that it is cheap.',['etuna on, että se on halpa','etuna on että se on halpa']],['The disadvantage is that it is slow.',['haittana on, että se on hidas','haittana on että se on hidas']],['advantage (one word)',['etu']]],
 next:'Lesson 59: conclusions (Yhteenvetona, Kaiken kaikkiaan).'},
{n:59,title:'Concluding (Yhteenvetona, Kaiken kaikkiaan)',
 win:'End an opinion text with a clear summary sentence.',
 anchor:'Same coffee trigger. Write one concluding sentence, then say "Yes!"',
 build:'The last sentence repeats your position in other words. Three openers do the job: <em>Lopuksi</em> (Lesson 39), <em>Kaiken kaikkiaan</em> (all in all) and <em>Yhteenvetona</em> (in summary). <em>Voin sanoa</em> (I can say) uses <em>voin</em> from Lesson 47.',
 eq:[['Yhteenvetona','stem'],['voin sanoa','mark'],[', että se on hyvä','end'],['Yhteenvetona voin sanoa, että se on hyvä.','res']],
 eqNote:'= <em>In summary I can say that it is good.</em>',
 formula:'Yhteenvetona / Kaiken kaikkiaan / Lopuksi + position',
 table:[['Finnish','English'],['Lopuksi haluan sanoa, että se on hyvä.','Finally I want to say that it is good.'],['Kaiken kaikkiaan mielestäni se on hyvä asia.','All in all in my opinion it is a good thing.'],['Yhteenvetona voin sanoa, että se on hyvä asia.','In summary I can say that it is a good thing.']],
 rule:'<strong>Avoid repeating words.</strong> If your first sentence used <em>Mielestäni</em>, finish with <em>Yhteenvetona voin sanoa, että</em>. Same position, new words.',
 why:'A conclusion that echoes the start:<br><b>Kaiken kaikkiaan mielestäni se on hyvä asia.</b>',
 tr:'All in all in my opinion it is a good thing.',
 drill:[['in summary (one word)',['yhteenvetona']],['all in all',['kaiken kaikkiaan']],['In summary I can say that it is a good thing.',['yhteenvetona voin sanoa, että se on hyvä asia','yhteenvetona voin sanoa että se on hyvä asia']]],
 next:'Lesson 60: checkpoint. Write your first full opinion text.'},
{n:60,title:'Checkpoint: the full opinion text',
 win:'Write a seven-slot opinion text from memory.',
 anchor:'Same coffee trigger. Fill all seven slots once, then say "Yes!"',
 build:'Ten lessons have produced the whole skeleton. Test-takers report opinion tasks such as whether shops should be open every day. This template uses that topic. Check the official sample tasks to see how current prompts are phrased.',
 eq:[['Topic','stem'],['Position','stem'],['Reason','mark'],['Example','mark'],['Counterpoint','mark'],['Weighing','end'],['Conclusion','end'],['mielipide','res']],
 eqNote:'mielipide = <em>opinion</em>',
 formula:'Topic / Position / Reason (+ example) / Counterpoint / Weighing / Conclusion',
 table:[['Slot','Pattern','Lessons'],['Topic','Nykyään tästä keskustellaan paljon.','52'],['Position','Mielestäni on hyvä, että kaupat ovat auki joka päivä.','16, 51'],['Reason','Ensinnäkin se on käytännöllistä, koska moni työskentelee päivällä.','39, 53'],['Example','Esimerkiksi minä ostan ruokaa kaupasta.','54'],['Counterpoint','Toisaalta työntekijät tarvitsevat lepoa.','55'],['Weighing','Etuna on, että asiakkaita on enemmän.','58'],['Conclusion','Yhteenvetona voin sanoa, että se on hyvä asia.','59']],
 rule:'<strong>Self-check:</strong> Is the position stated clearly in the first two sentences? Is every reason followed by an example or result? Does the text admit another side and return to your position? Does the conclusion use different words from the start?',
 why:'A full model:<br><b>Nykyään tästä keskustellaan paljon. Mielestäni on hyvä, että kaupat ovat auki joka päivä. Ensinnäkin se on käytännöllistä, koska moni työskentelee päivällä. Esimerkiksi minä ostan ruokaa kaupasta. Toisaalta työntekijät tarvitsevat lepoa. Etuna on, että asiakkaita on enemmän. Yhteenvetona voin sanoa, että se on hyvä asia.</b>',
 tr:'Nowadays this is discussed a lot. In my opinion it is good that shops are open every day. First of all it is practical, because many people work in the daytime. For example I buy food from the shop. On the other hand employees need rest. An advantage is that there are more customers. In summary I can say that it is a good thing.',
 drill:[['In my opinion it is good that shops are open every day.',['mielestäni on hyvä, että kaupat ovat auki joka päivä','mielestäni on hyvä että kaupat ovat auki joka päivä']],['First of all it is practical.',['ensinnäkin se on käytännöllistä']],['In summary I can say that it is a good thing.',['yhteenvetona voin sanoa, että se on hyvä asia','yhteenvetona voin sanoa että se on hyvä asia']]],
 next:'Lesson 61: deeper opinion work. We will study connecting phrases and paragraph flow.'},
{n:61,title:'Adding points (lisäksi, myös, sekä ... että)',
 win:'Add a second point without repeating yourself.',
 anchor:'Same coffee trigger. Write two points joined by one addition word, then say "Yes!"',
 build:'You can order reasons with <em>Ensinnäkin</em> and <em>Toiseksi</em> (Lesson 39). Addition words let you add a point inside a paragraph without a new number: <em>lisäksi</em> (in addition), <em>myös</em> (also), <em>sekä ... että</em> (both ... and).',
 eq:[['Se on sekä halpa','stem'],['että','mark'],['nopea','end'],['Se on sekä halpa että nopea.','res']],
 eqNote:'= <em>It is both cheap and fast.</em>',
 formula:'Lisäksi + clause.   |   myös + word.   |   sekä + A + että + B',
 table:[['Finnish','English'],['Lisäksi se on nopea.','In addition it is fast.'],['Se on myös hyvä.','It is also good.'],['Sen lisäksi palvelu on erittäin hyvä.','On top of that the service is extremely good.'],['Se on sekä halpa että nopea.','It is both cheap and fast.']],
 rule:'<strong>Placement.</strong> <em>Lisäksi</em> usually opens a sentence. <em>Myös</em> sits next to the word it adds. <em>Sekä ... että</em> needs both parts in the same form.',
 why:'A paragraph with additions:<br><b>Se on halpa. Lisäksi se on nopea. Sen lisäksi palvelu on myös hyvä.</b>',
 tr:'It is cheap. In addition it is fast. On top of that the service is also good.',
 drill:[['in addition (one word)',['lisäksi']],['also (one word)',['myös']],['It is both cheap and fast.',['se on sekä halpa että nopea']]],
 next:'Lesson 62: time order (ensin, sitten, sen jälkeen).'},
{n:62,title:'Time order (ensin, sitten, sen jälkeen)',
 win:'Describe a sequence of two actions.',
 anchor:'Same coffee trigger. Write two actions in order, then say "Yes!"',
 build:'Complaints and stories both need a sequence. Four words mark the order: <em>aluksi</em> (at first), <em>ensin</em> (first), <em>sitten</em> (then), <em>sen jälkeen</em> (after that), <em>lopuksi</em> (finally).',
 eq:[['Ensin kirjoitin teille','stem'],[', sitten','mark'],['soitin','end'],['Ensin kirjoitin teille, sitten soitin.','res']],
 eqNote:'= <em>First I wrote to you, then I called.</em>',
 formula:'Ensin + past verb, sitten + past verb. Sen jälkeen + past verb.',
 table:[['Finnish','English'],['aluksi','at first'],['ensin','first'],['sitten','then'],['sen jälkeen','after that'],['lopuksi','finally']],
 rule:'<strong>Reuse.</strong> <em>Soitin</em> is the past of <em>soittaa</em> (Lesson 12 pattern). <em>Lähettää</em> (to send) has the past <em>lähetin</em>.',
 why:'A short sequence for a complaint:<br><b>Aluksi kirjoitin teille. Sen jälkeen soitin. Lopuksi lähetin sähköpostin.</b>',
 tr:'At first I wrote to you. After that I called. Finally I sent an email.',
 drill:[['first (one word)',['ensin']],['then (one word)',['sitten']],['after that',['sen jälkeen']]],
 next:'Lesson 63: should (pitäisi) for suggestions and opinions.'},
{n:63,title:'Should (Palvelun pitäisi olla parempi)',
 win:'Say what should happen with one sentence.',
 anchor:'Same coffee trigger. Write one sentence with pitäisi, then say "Yes!"',
 build:'<em>Pitää</em> means must (Lesson 37). Add the conditional marker from Lesson 2 and you get <strong>pitäisi</strong> (should). The structure stays the same: person in the genitive, then <em>pitäisi</em>, then the verb in -a/-ä form.',
 eq:[['pitä','stem'],['isi','mark'],['pitäisi','res']],
 eqNote:'pitäisi = <em>should</em>',
 formula:'Genitive + pitäisi + verb in -a/-ä form',
 table:[['Finnish','English'],['Meidän pitäisi mennä.','We should go.'],['Sinun pitäisi tulla.','You should come.'],['Palvelun pitäisi olla parempi.','The service should be better.'],['Hinnan pitäisi olla halvempi.','The price should be cheaper.']],
 rule:'<strong>Opinion tip.</strong> <em>Pitäisi</em> turns an opinion into a suggestion. Use it once or twice in an opinion text, not in every sentence.',
 why:'A suggestion to close an argument:<br><b>Mielestäni palvelun pitäisi olla parempi, koska asiakkaat tarvitsevat apua.</b>',
 tr:'In my opinion the service should be better, because customers need help.',
 drill:[['We should go.',['meidän pitäisi mennä']],['You should come.',['sinun pitäisi tulla']],['The service should be better.',['palvelun pitäisi olla parempi']]],
 next:'Lesson 64: certainty (ehkä, luultavasti, varmasti).'},
{n:64,title:'Certainty (ehkä, luultavasti, varmasti)',
 win:'Show how sure you are.',
 anchor:'Same coffee trigger. Write one sentence at each certainty level, then say "Yes!"',
 build:'B2 writing shows degrees of certainty. Use a ladder from weakest to strongest: <em>ehkä</em> (maybe), <em>luultavasti</em> (probably), <em>varmasti</em> (certainly). <em>Voi olla</em> (may be) and <em>Olen varma, että</em> (I am sure that) extend the ladder.',
 eq:[['ehkä','stem'],['luultavasti','mark'],['varmasti','end'],['varmuus','res']],
 eqNote:'varmuus = <em>certainty</em>',
 formula:'ehkä < luultavasti < varmasti   |   Olen varma, että + clause.',
 table:[['Finnish','English'],['Ehkä se on kallis.','Maybe it is expensive.'],['Se on luultavasti halpa.','It is probably cheap.'],['Se on varmasti hyvä.','It is certainly good.'],['Se voi olla hyvä.','It may be good.'],['Olen varma, että se on hyvä.','I am sure that it is good.']],
 rule:'<strong>Match your claim to your evidence.</strong> Strong words need an example (Lesson 54). If you have no example, use <em>luultavasti</em> or <em>ehkä</em>.',
 why:'Certainty in a short paragraph:<br><b>Se on luultavasti halpa. Olen varma, että palvelu on hyvä.</b>',
 tr:'It is probably cheap. I am sure that the service is good.',
 drill:[['maybe (one word)',['ehkä']],['certainly (one word)',['varmasti']],['I am sure that it is good.',['olen varma, että se on hyvä','olen varma että se on hyvä']]],
 next:'Lesson 65: which case after which verb (pitää, odottaa, auttaa).'},
{n:65,title:'Verb and case pairs (pidän, odotan, autan)',
 win:'Pair six verbs with the case they need.',
 anchor:'Same coffee trigger. Write one sentence with each verb, then say "Yes!"',
 build:'Many verbs demand a particular case on their object. Learn each verb with its case as one unit. You already know several: <em>kysyä</em> and <em>kiittää</em> take the elative (Lesson 8), <em>tarvita</em> and <em>odottaa</em> take the partitive (Lessons 11 and 46).',
 eq:[['Pidän','stem'],['palvelusta','end'],['Pidän palvelusta.','res']],
 eqNote:'= <em>I like the service.</em>',
 formula:'Verb + required case',
 table:[['Verb','Case','Example'],['pitää (like)','elative','Pidän palvelusta. (I like the service.)'],['odottaa (wait for)','partitive','Odotan vastausta. (I am waiting for a reply.)'],['tarvita (need)','partitive','Tarvitsen apua. (I need help.)'],['auttaa (help)','partitive','Autan sinua. (I help you.)'],['kysyä (ask)','elative','Kysyn hinnasta. (I ask about the price.)'],['kiittää (thank)','elative','Kiitän avusta. (I thank you for the help.)']],
 rule:'<strong>Watch out.</strong> <em>Pitää</em> with the elative means like. <em>Pitää</em> with an infinitive means must (Lesson 37).',
 why:'A paragraph using several pairs:<br><b>Pidän palvelusta, mutta tarvitsen apua. Odotan vastausta pian.</b>',
 tr:'I like the service, but I need help. I am waiting for a reply soon.',
 drill:[['I like the service.',['pidän palvelusta']],['I wait for a reply.',['odotan vastausta']],['I help you.',['autan sinua']]],
 next:'Lesson 66: frequency (aina, usein, joskus, harvoin, en koskaan).'},
{n:66,title:'Frequency (aina, usein, joskus)',
 win:'Say how often you do something.',
 anchor:'Same coffee trigger. Write one frequency sentence, then say "Yes!"',
 build:'Opinion texts use habits as evidence. Five words give the frequency: <em>aina</em> (always), <em>usein</em> (often), <em>joskus</em> (sometimes), <em>harvoin</em> (rarely), <em>en koskaan</em> (never). <em>Koskaan</em> needs a negative verb (Lesson 6).',
 eq:[['En','stem'],['koskaan','mark'],['osta lippua','end'],['En koskaan osta lippua.','res']],
 eqNote:'= <em>I never buy a ticket.</em>',
 formula:'aina / usein / joskus / harvoin + verb   |   en koskaan + verb stem',
 table:[['Finnish','English'],['Ostan usein ruokaa kaupasta.','I often buy food from the shop.'],['Käyn kaupassa joka päivä.','I go to the shop every day.'],['Joskus kirjoitan ystävälle.','Sometimes I write to a friend.'],['En koskaan osta lippua.','I never buy a ticket.']],
 rule:'<strong>Handy.</strong> <em>Käydä</em> (to visit, to go) has the I-form <em>käyn</em>. The chunk <em>joka päivä</em> means every day.',
 why:'Habit as an example:<br><b>Käyn kaupassa usein. Esimerkiksi ostan ruokaa melkein joka päivä.</b> (<em>Melkein</em> = almost.)',
 tr:'I go to the shop often. For example I buy food almost every day.',
 drill:[['always (one word)',['aina']],['often (one word)',['usein']],['I never buy a ticket.',['en koskaan osta lippua']]],
 next:'Lesson 67: bigger numbers and prices (kaksikymmentä euroa).'},
{n:67,title:'Numbers and prices (20 euroa)',
 win:'Say one price correctly.',
 anchor:'Same coffee trigger. Write one price sentence, then say "Yes!"',
 build:'Numbers 13 to 19 add <em>-toista</em> to the unit: kolme + toista. Tens add <em>-kymmentä</em>: kaksi + kymmentä. After numbers the noun is singular partitive (Lesson 33): <em>20 euroa</em>.',
 eq:[['kolme','stem'],['toista','mark'],['kolmetoista','res']],
 eqNote:'kolmetoista = <em>thirteen</em>',
 formula:'unit + toista (13 to 19)   |   unit + kymmentä (20, 30, ...)   |   number + euroa',
 table:[['Number','Finnish'],['13','kolmetoista'],['14','neljätoista'],['15','viisitoista'],['20','kaksikymmentä'],['30','kolmekymmentä'],['100','sata'],['1000','tuhat']],
 rule:'<strong>Prices.</strong> <em>Tuote maksaa 20 euroa.</em> uses <em>maksaa</em> (to cost, Lesson 48). The past is <em>maksoi</em>.',
 why:'A price in a complaint:<br><b>Tuote maksoi 50 euroa, mutta se on rikki.</b>',
 tr:'The product cost 50 euros, but it is broken.',
 drill:[['fifteen (one word)',['viisitoista']],['twenty (one word)',['kaksikymmentä']],['The product costs 20 euros.',['tuote maksaa 20 euroa','tuote maksaa kaksikymmentä euroa']]],
 next:'Lesson 68: reported speech (sanoi, että ...).'},
{n:68,title:'Reported speech (Myyjä sanoi, että ...)',
 win:'Report what someone said.',
 anchor:'Same coffee trigger. Write one reported sentence, then say "Yes!"',
 build:'Complaints often mention what someone told you. <em>Sanoa</em> (to say) has the past <em>sanoi</em> (he/she said, Lesson 28 pattern). Join with <em>että</em> and a comma (Lesson 13). The chunk <em>Minulle sanottiin, että ...</em> means I was told that.',
 eq:[['Myyjä sanoi','stem'],[', että','mark'],['tuote tulee huomenna','end'],['Myyjä sanoi, että tuote tulee huomenna.','res']],
 eqNote:'= <em>The seller said that the product comes tomorrow.</em>',
 formula:'Subject + sanoi + , että + clause   |   Minulle sanottiin, että + clause',

{n:71,title:'Error 1: about, for, of (kysyä tilauksesta)',
 win:'Fix three sentences where the noun should end in -sta/-stä.',
 anchor:'Same coffee trigger. Fix one wrong sentence below, then say "Yes!"',
 build:'Verbs of asking, thanking, complaining, discussing and liking pair with the <strong>elative</strong> (Lesson 8). The most common error is leaving the noun in its dictionary form. The fix is always the same: change the noun to its <code>-sta/-stä</code> form.',
 eq:[['tilaukse','stem'],['sta','end'],['tilauksesta','res']],
 eqNote:'tilauksesta = <em>about the order</em>',
 formula:'kysyä / kiittää / valittaa / keskustella / pitää + noun + sta/stä',
 table:[['Wrong (✗)','Right (✓)','Why'],['Haluaisin kysyä tilaus.','Haluaisin kysyä tilauksesta.','kysyä takes the elative'],['Kiitos apu.','Kiitos avusta.','thank for = elative (apu becomes avusta)'],['Haluaisin valittaa palvelu.','Haluaisin valittaa palvelusta.','valittaa takes the elative'],['Keskustelemme työ.','Keskustelemme työstä.','keskustella (to discuss) takes the elative'],['Pidän kahvi.','Pidän kahvista.','pitää (to like) takes the elative']],
 rule:'<strong>Learn the pairs as chunks:</strong> kysyä + -sta, kiittää + -sta, valittaa + -sta, keskustella + -sta, pitää + -sta. Do not translate word for word from English, where about and for are separate words.',
 why:'A corrected set:<br><b>Haluaisin kysyä tilauksesta. Kiitos avusta. Pidän tästä palvelusta.</b>',
 tr:'I would like to ask about the order. Thank you for the help. I like this service.',
 drill:[['Correct this: Kiitos apu.',['kiitos avusta']],['Correct this: Haluaisin valittaa palvelu.',['haluaisin valittaa palvelusta']],['Correct this: Pidän kahvi.',['pidän kahvista']]],
 next:'Lesson 72: error 2, the object case (Ostin lipun, En osta lippua).'},
{n:72,title:'Error 2: the object case (Ostin lipun)',
 win:'Choose between -n and the partitive in three sentences.',
 anchor:'Same coffee trigger. Fix one wrong sentence below, then say "Yes!"',
 build:'The object takes <code>-n</code> when it is whole and completed (Lesson 32). It takes the <strong>partitive</strong> when the verb is negated, when the amount is unspecified, or when you need or ask for something (Lessons 11 and 19). The usual error is using the dictionary form for both.',
 eq:[['lippu','stem'],['a','end'],['lippua','res']],
 eqNote:'En osta lippua = <em>I am not buying a ticket</em>',
 formula:'whole object: -n   |   negated, unspecified, needed: partitive',
 table:[['Wrong (✗)','Right (✓)','Why'],['Ostin lippu.','Ostin lipun.','whole completed object takes -n'],['En osta lipun.','En osta lippua.','negation always takes the partitive'],['Tarvitsen apu.','Tarvitsen apua.','need takes the partitive'],['Pyydän vastaus.','Pyydän vastausta.','request takes the partitive'],['Kirjoitin sähköposti.','Kirjoitin sähköpostin.','whole completed object takes -n']],
 rule:'<strong>Two questions fix it.</strong> Is the verb negated? Partitive. Is the object whole and finished? Use -n. If neither, ask whether the amount is unspecified or the verb is a request or need verb. Then use the partitive.',
 why:'A corrected set:<br><b>Ostin lipun. En osta lippua. Tarvitsen apua.</b>',
 tr:'I bought the ticket. I am not buying a ticket. I need help.',
 drill:[['Correct this: Ostin lippu.',['ostin lipun']],['Correct this: En osta lipun.',['en osta lippua']],['Correct this: Tarvitsen apu.',['tarvitsen apua']]],
 next:'Lesson 73: error 3, consonant gradation (kaupassa, hinnasta).'},
{n:73,title:'Error 3: consonant gradation (kaupassa)',
 win:'Weaken the consonant in three words.',
 anchor:'Same coffee trigger. Fix one wrong word below, then say "Yes!"',
 build:'Many endings make the stem <strong>weak</strong>: the I-form (Lesson 4), the elative (Lesson 8), the inessive (Lesson 9). The classic error is keeping the strong consonant. Remember the weakening pairs: tt becomes t, pp becomes p, kk becomes k, nt becomes nn, p becomes v.',
 eq:[['kauppa','stem'],['pp → p','mark'],['kaupassa','res']],
 eqNote:'kaupassa = <em>in the shop</em>',
 formula:'strong stem + ending that closes the syllable = weak stem',
 table:[['Wrong (✗)','Right (✓)','Why'],['kirjoittan','kirjoitan','tt becomes t before -n'],['kauppassa','kaupassa','pp becomes p before -ssa'],['hintasta','hinnasta','nt becomes nn'],['apusta','avusta','p becomes v'],['työpaikkassa','työpaikassa','kk becomes k']],
 rule:'<strong>Rule of thumb from Lessons 4, 8, 9.</strong> With -n, -t, -mme, -tte, -ssa and -sta the consonant weakens. In the he/she and they forms it stays strong (<em>kirjoittaa</em>, <em>kirjoittavat</em>).',
 why:'A corrected set:<br><b>Kirjoitan teille kaupasta. Kysyn hinnasta. Kiitos avusta.</b>',
 tr:'I am writing to you from the shop. I am asking about the price. Thank you for the help.',
 drill:[['Correct this: kirjoittan',['kirjoitan']],['Correct this: hintasta',['hinnasta']],['Correct this: kauppassa',['kaupassa']]],
 next:'Lesson 74: error 4, vowel harmony (työssä, palvelussa).'},
{n:74,title:'Error 4: vowel harmony (työssä, palvelussa)',
 win:'Pick -a or -ä correctly in three words.',
 anchor:'Same coffee trigger. Fix one wrong word below, then say "Yes!"',
 build:'Endings come in pairs: <code>-a/-ä</code>, <code>-ssa/-ssä</code>, <code>-sta/-stä</code>, <code>-lla/-llä</code>. Back vowels (a, o, u) take the back version. Front vowels (ä, ö, y) take the front version. The letters e and i are neutral and defer to the other vowels. In compounds the last part decides.',
 eq:[['työ','stem'],['ssä','end'],['työssä','res']],
 eqNote:'työssä = <em>at work</em>',
 formula:'a, o, u in the word: -a family.   ä, ö, y in the word: -ä family.',
 table:[['Wrong (✗)','Right (✓)','Why'],['työssa','työssä','only front vowels (y, ö)'],['palvelussä','palvelussa','back vowels (a, u)'],['Voisitteko kertoä?','Voisitteko kertoa?','kertoa has back vowels'],['kysya','kysyä','kysyä has y'],['hyvässa','hyvässä','hyvä has ä']],
 rule:'<strong>Compounds.</strong> <em>Työpaikassa</em> uses <em>-ssa</em> because the last part, <em>paikka</em>, has back vowels. Test every ending against the vowels you hear in the word.',

 tr:'There is good service at the workplace. Could you tell me about the job?',
 drill:[['Correct this: työssa',['työssä']],['Correct this: palvelussä',['palvelussa']],['Correct this: kysya',['kysyä']]],
 next:'Lesson 75: error 5, verb endings and negation (Hän kirjoittaa, En kirjoita).'},
{n:75,title:'Error 5: verb endings and negation',

 next:'Lesson 76: error 6, commas and the word joka (Tilasin tuotteen, joka on rikki).'},
{n:76,title:'Error 6: commas and joka',
 win:'Place the comma before the connector in three sentences.',
 anchor:'Same coffee trigger. Fix one wrong sentence below, then say "Yes!"',
 build:'Finnish puts a comma before <em>koska</em>, <em>että</em>, <em>mutta</em>, <em>jos</em>, <em>vaikka</em> (Lesson 13) and before <em>joka</em> (who, which). The English habit of skipping the comma is the usual source of error.',

 tr:'I ordered a product that is broken. I am writing to you because I need help.',

 why:'A typical prompt, written in my own words (the real tasks are secret):<br><b>Kirjoita ystävällesi viesti. Kerro, miksi et voi tulla tapaamiseen, ja ehdota uutta aikaa.</b>',
 tr:'Write a message to your friend. Tell why you cannot come to the meeting, and suggest a new time.',
 drill:[['message (one word)',['viesti']],['opinion (one word)',['mielipide']],['application (one word)',['hakemus']]],
 next:'Lesson 82: reading the prompt. The verbs that tell you what to write (kerro, kysy, perustele, ehdota).'},
{n:82,title:'Reading the prompt (kerro, perustele, ehdota)',
 win:'Turn a prompt into a checklist by underlining its verbs.',
 anchor:'Same coffee trigger. Underline the verbs in one prompt, then say "Yes!"',
 build:'A prompt is a list of orders in the <strong>command form</strong> (Lesson 21). Every command is one thing you must do in your answer. Underline each verb and answer each one with at least one sentence.',
 eq:[['Perustele','stem'],['mielipiteesi','end'],['Perustele mielipiteesi.','res']],
 eqNote:'= <em>Justify your opinion.</em> (<em>-si</em> = your, the informal twin of <em>-ni</em> from Lesson 15)',
 formula:'one prompt verb = one part of your answer',
 table:[['Prompt verb','Meaning','What to write'],['kerro','tell','facts and news (past or present sentences)'],['kysy','ask','a question, maybe with -ko or a question word'],['perustele','give reasons','koska, siksi, esimerkiksi (Lessons 53, 54)'],['ehdota','suggest','Ehdotan, että ... or Sopiiko ...?'],['pyydä','request','Pyydän ... or Voisitteko ...?'],['kuvaile','describe','adjectives and a few details']],
 rule:'<strong>Also common:</strong> <em>kirjoita</em> (write), <em>vastaa</em> (answer), <em>selitä</em> (explain), <em>ota kantaa</em> (take a position). If the prompt has three verbs, your answer needs three clear parts.',
 why:'Prompt and answer:<br>Prompt: <b>Kerro, miksi et voi tulla, ja ehdota uutta aikaa.</b><br>Answer: <b>En voi tulla, koska minun täytyy mennä töihin. Ehdotan, että tapaamme torstaina.</b>',
 tr:'Prompt: Tell why you cannot come, and suggest a new time. Answer: I cannot come, because I have to go to work. I suggest that we meet on Thursday.',
 drill:[['tell! (one word)',['kerro']],['justify! (one word)',['perustele']],['suggest! (one word)',['ehdota']]],
 next:'Lesson 83: planning in 60 seconds, and a suggested time split for 55 minutes.'},
{n:83,title:'Planning in 60 seconds',
 win:'Answer four planning questions before writing one word.',
 anchor:'Same coffee trigger. Answer the four questions for one prompt, then say "Yes!"',
 build:'A one-minute plan prevents most structure errors. Ask four questions, using the question words from Lesson 27: <em>Kenelle?</em> (to whom), <em>Miksi?</em> (why), <em>Mitä?</em> (what), <em>Millainen sävy?</em> (what tone). Then write.',
 eq:[['Kenelle?','stem'],['Miksi?','mark'],['Mitä?','mark'],['Sävy?','end'],['suunnitelma','res']],
 eqNote:'suunnitelma = <em>plan</em>',
 formula:'Kenelle? / Miksi? / Mitä? / Millainen sävy?',
 table:[['Step','Question','Result'],['1','Kenelle? (to whom)','chooses formal or informal'],['2','Miksi? (why)','one-sentence purpose'],['3','Mitä? (what)','one part per prompt verb'],['4','Millainen sävy? (what tone)','haluan or haluaisin, Hei or Hyvä vastaanottaja']],
 rule:'<strong>Suggested time split (my own suggestion, not official):</strong> about 10 minutes for the short task, 15 for the middle task, 20 for the opinion task and 8 for proofreading, which totals 53 of 55. Adjust it after you try official demo tasks and see the real task lengths.',
 why:'A plan for the family-trip prompt:<br><b>Kenelle? Perheelle. Miksi? Työmatka. Mitä? Olen poissa kaksi päivää, ohjeita. Sävy? Ystävällinen.</b>',
 tr:'To whom? To the family. Why? A work trip. What? I am away two days, instructions. Tone? Friendly.',
 drill:[['to whom? (one word)',['kenelle']],['why? (one word)',['miksi']],['tone (one word)',['sävy']]],
 next:'Lesson 84: task type A, a short message to family or friends with instructions.'},
{n:84,title:'Task type A: a short message with instructions',
 win:'Write a four-sentence family message with do and do-not instructions.',
 anchor:'Same coffee trigger. Write the two instruction sentences, then say "Yes!"',
 build:'A common short task is a friendly message with news and instructions. For several readers the command form takes <code>-kaa/-kää</code> (Lesson 21). The negative plural command uses <code>älkää</code> plus a verb ending in <code>-ko/-kö</code>: <em>älkää unohtako</em>.',
 eq:[['Muistakaa','stem'],['ostaa ruokaa.','end'],['Muistakaa ostaa ruokaa.','res']],
 eqNote:'= <em>Remember to buy food.</em> (to several people)',
 formula:'Muistakaa + verb in -a/-ä form.   |   Älkää unohtako + verb in -a/-ä form.',
 table:[['Slot','Finnish','English'],['Greeting','Hei kaikki!','Hi everyone!'],['News','Minun täytyy lähteä yllättäen työmatkalle.','I have to leave unexpectedly on a work trip.'],['Duration','Olen poissa kaksi päivää.','I am away for two days.'],['Do','Muistakaa ostaa ruokaa.','Remember to buy food.'],['Do not','Älkää unohtako soittaa isoäidille.','Do not forget to call grandmother.'],['Close','Nähdään pian!','See you soon!']],
 rule:'<strong>Singular versions.</strong> To one person use <em>Muista ostaa ruokaa.</em> and <em>Älä unohda soittaa isoäidille.</em> <em>Kaksi päivää</em> uses the partitive after a number (Lesson 78).',
 why:'A full model:<br><b>Hei kaikki! Minun täytyy lähteä yllättäen työmatkalle. Olen poissa kaksi päivää. Muistakaa ostaa ruokaa. Älkää unohtako soittaa isoäidille. Nähdään pian!</b>',
 tr:'Hi everyone! I have to leave unexpectedly on a work trip. I am away for two days. Remember to buy food. Do not forget to call grandmother. See you soon!',
 drill:[['Remember to buy food. (to one person)',['muista ostaa ruokaa']],['Do not forget to call. (to one person)',['älä unohda soittaa']],['I have to leave unexpectedly.',['minun täytyy lähteä yllättäen']]],
 next:'Lesson 85: task type B, a formal request for information.'},
{n:85,title:'Task type B: a formal request for information',
 win:'Write a formal information request with two questions.',
 anchor:'Same coffee trigger. Write the two question sentences, then say "Yes!"',
 build:'A formal request for information combines Lessons 41 to 49: subject line, opener with <em>koskien</em>, two indirect questions with <em>Haluaisin tietää</em>, the <em>Olisin kiitollinen, jos</em> sentence and a formal closing.',
 eq:[['Aihe','stem'],['Opener','mark'],['Kysymys 1','mark'],['Kysymys 2','end'],['Pyyntö','end'],['viesti','res']],
 eqNote:'viesti = <em>message</em>',
 formula:'Aihe / Hyvä vastaanottaja, / Otan yhteyttä koskien ... / Haluaisin tietää ... / Olisin kiitollinen, jos ... / Ystävällisin terveisin,',
 table:[['Slot','Finnish','English'],['Subject','Aihe: Kysymys suomen kielen kurssista','Subject: Question about the Finnish course'],['Opener','Otan yhteyttä koskien suomen kielen kurssia.','I am contacting you regarding the Finnish course.'],['Question 1','Haluaisin tietää, milloin kurssi alkaa.','I would like to know when the course starts.'],['Question 2','Haluaisin tietää myös, paljonko kurssi maksaa.','I would also like to know how much the course costs.'],['Request','Olisin kiitollinen, jos voisitte vastata pian.','I would be grateful if you could reply soon.']],
 rule:'<strong>Handy.</strong> <em>Myös</em> (also, Lesson 61) links the second question to the first. Keep each question to one sentence so the reader can answer them in order.',
 why:'A full model:<br><b>Aihe: Kysymys suomen kielen kurssista</b><br><b>Hyvä vastaanottaja,</b><br>Otan yhteyttä koskien suomen kielen kurssia. Haluaisin tietää, milloin kurssi alkaa. Haluaisin tietää myös, paljonko kurssi maksaa. Olisin kiitollinen, jos voisitte vastata pian.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Question about the Finnish course. Dear recipient, I am contacting you regarding the Finnish course. I would like to know when the course starts. I would also like to know how much the course costs. I would be grateful if you could reply soon. Kind regards, Aino Virtanen',
 drill:[['I would like to know when the course starts.',['haluaisin tietää, milloin kurssi alkaa','haluaisin tietää milloin kurssi alkaa']],['I would also like to know how much the course costs.',['haluaisin tietää myös, paljonko kurssi maksaa','haluaisin tietää myös paljonko kurssi maksaa']],['I am contacting you regarding the course.',['otan yhteyttä koskien kurssia']]],
 next:'Lesson 86: task type C, feedback with praise and a suggestion.'},
{n:86,title:'Task type C: feedback (palaute)',
 win:'Write feedback that praises and suggests an improvement.',
 anchor:'Same coffee trigger. Write one praise and one suggestion, then say "Yes!"',
 build:'Feedback tasks balance praise and a suggestion. Use <em>Haluan kiittää</em> with the elative (Lesson 17), the partitive for qualities (<em>ystävällistä</em>), and <em>Toivon kuitenkin, että</em> with the conditional for the improvement.',
 eq:[['Haluaisin antaa','stem'],['palautetta','end'],['Haluaisin antaa palautetta.','res']],
 eqNote:'= <em>I would like to give feedback.</em>',
 formula:'Praise (Haluan kiittää ...) + Quality (oli ystävällistä) + Wish (Toivon kuitenkin, että ... olisi ...)',
 table:[['Slot','Finnish','English'],['Subject','Aihe: Palaute','Subject: Feedback'],['Purpose','Haluaisin antaa palautetta palvelusta.','I would like to give feedback about the service.'],['Praise','Palvelu oli ystävällistä ja nopeaa.','The service was friendly and fast.'],['Thanks','Haluan kiittää hyvästä palvelusta.','I want to thank you for the good service.'],['Wish','Toivon kuitenkin, että odotusaika olisi lyhyempi.','I hope, however, that the waiting time would be shorter.']],
 rule:'<strong>Handy.</strong> <em>Antaa palautetta</em> uses the partitive. <em>Lyhyempi</em> is a comparative (Lesson 38). <em>Olisi</em> is the conditional of <em>on</em> (Lesson 49).',
 why:'A full model:<br><b>Aihe: Palaute</b><br><b>Hyvä vastaanottaja,</b><br>Haluaisin antaa palautetta palvelusta. Palvelu oli ystävällistä ja nopeaa. Haluan kiittää hyvästä palvelusta. Toivon kuitenkin, että odotusaika olisi lyhyempi.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Feedback. Dear recipient, I would like to give feedback about the service. The service was friendly and fast. I want to thank you for the good service. I hope, however, that the waiting time would be shorter. Kind regards, Aino Virtanen',
 drill:[['I would like to give feedback.',['haluaisin antaa palautetta']],['The service was friendly and fast.',['palvelu oli ystävällistä ja nopeaa']],['I want to thank you for the good service.',['haluan kiittää hyvästä palvelusta']]],
 next:'Lesson 87: task type D, a short job application.'},
{n:87,title:'Task type D: a short application (hakemus)',
 win:'Write a five-sentence job application.',
 anchor:'Same coffee trigger. Write the first two sentences, then say "Yes!"',
 build:'An application states what you apply for, why you are interested, what you can do and when you can start. Note a new pairing: <em>kiinnostunut</em> (interested) takes the <strong>elative</strong>, unlike <em>tyytyväinen</em> (Lesson 44), which takes the illative.',
 eq:[['Haen','stem'],['myyjän työpaikkaa','end'],['Haen myyjän työpaikkaa.','res']],
 eqNote:'= <em>I am applying for the salesperson job.</em>',
 formula:'Haen + partitive.   Olen kiinnostunut + elative.   Osaan + verb.   Voin aloittaa heti.',
 table:[['Slot','Finnish','English'],['Subject','Aihe: Hakemus','Subject: Application'],['Applying','Haen myyjän työpaikkaa.','I am applying for the salesperson job.'],['Interest','Olen kiinnostunut tehtävästä, koska pidän asiakaspalvelusta.','I am interested in the position, because I like customer service.'],['Experience','Minulla on kokemusta asiakaspalvelusta.','I have experience of customer service.'],['Skills','Osaan puhua suomea ja englantia.','I can speak Finnish and English.'],['Start','Voin aloittaa heti.','I can start immediately.']],
 rule:'<strong>Handy.</strong> <em>Hakea</em> (to apply for) has the I-form <em>haen</em>. <em>Osata</em> (to know how to) has the I-form <em>osaan</em>. <em>Kokemusta</em> is the partitive of <em>kokemus</em> (Lesson 35 pattern).',
 why:'A full model:<br><b>Aihe: Hakemus</b><br><b>Hyvä vastaanottaja,</b><br>Haen myyjän työpaikkaa. Olen kiinnostunut tehtävästä, koska pidän asiakaspalvelusta. Minulla on kokemusta asiakaspalvelusta. Osaan puhua suomea ja englantia. Voin aloittaa heti. Kiitos jo etukäteen.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Application. Dear recipient, I am applying for the salesperson job. I am interested in the position, because I like customer service. I have experience of customer service. I can speak Finnish and English. I can start immediately. Thanks in advance. Kind regards, Aino Virtanen',
 drill:[['I am applying for the salesperson job.',['haen myyjän työpaikkaa']],['I can speak Finnish and English.',['osaan puhua suomea ja englantia']],['I can start immediately.',['voin aloittaa heti']]],
 next:'Lesson 88: advice and recommendations (suosittelen, kannattaa, voisit kokeilla).'},
{n:88,title:'Advice and recommendations',
 win:'Give one recommendation to a friend in the right form.',
 anchor:'Same coffee trigger. Write one recommendation, then say "Yes!"',
 build:'Prompts often ask you to suggest or recommend. Four tools cover it: <em>Suosittelen, että</em> (I recommend that), <em>Ehdotan, että</em> (I suggest that), <em>Kannattaa</em> + verb (it is worth doing) and <em>Voisit kokeilla</em> (you could try).',
 eq:[['Suosittelen','stem'],[', että','mark'],['kokeilet uutta kahvilaa','end'],['Suosittelen, että kokeilet uutta kahvilaa.','res']],
 eqNote:'= <em>I recommend that you try the new café.</em>',
 formula:'Suosittelen / Ehdotan, että + clause.   |   Kannattaa + verb.   |   Voisit kokeilla + partitive.',
 table:[['Finnish','English'],['Suosittelen, että kokeilet uutta kahvilaa.','I recommend that you try the new café.'],['Ehdotan, että tapaamme torstaina.','I suggest that we meet on Thursday.'],['Kannattaa mennä aamulla.','It is worth going in the morning.'],['Voisit kokeilla kahvia.','You could try the coffee.']],
 rule:'<strong>Handy.</strong> <em>Kokeilla</em> (to try) takes the partitive (<em>kahvilaa</em>). <em>Voisit</em> is the you-form of the conditional (Lesson 7). Use <em>Voisitte</em> for a formal reader.',
 why:'A full model:<br><b>Hei Anna! Suosittelen, että kokeilet uutta kahvilaa. Kannattaa mennä aamulla, koska silloin siellä on rauhallista. Voisit myös kysyä Mattia mukaan.</b>',
 tr:'Hi Anna! I recommend that you try the new café. It is worth going in the morning, because then it is calm there. You could also ask Matti along.',
 drill:[['I recommend that you try the new café.',['suosittelen, että kokeilet uutta kahvilaa','suosittelen että kokeilet uutta kahvilaa']],['It is worth going in the morning.',['kannattaa mennä aamulla']],['I suggest that we meet on Thursday.',['ehdotan, että tapaamme torstaina','ehdotan että tapaamme torstaina']]],
 next:'Lesson 89: describing places and experiences (kuvaile).'},
{n:89,title:'Describing a place or experience (kuvaile)',
 win:'Describe a past trip with three adjectives and one detail.',
 anchor:'Same coffee trigger. Write two sentences about a trip, then say "Yes!"',
 build:'A describe prompt wants past tense for the experience (Lessons 12 and 28) and adjectives for the details (Lesson 17). Learn a few useful adjectives: <em>mukava</em> (nice), <em>rauhallinen</em> (calm), <em>mielenkiintoinen</em> (interesting), <em>kiireinen</em> (busy), <em>helppo</em> (easy), <em>vaikea</em> (difficult).',
 eq:[['Matka','stem'],['oli','mark'],['mukava ja rauhallinen','end'],['Matka oli mukava ja rauhallinen.','res']],
 eqNote:'= <em>The trip was nice and calm.</em>',
 formula:'Time + past verb + place (outer -lla) .   Noun + oli + adjective.',
 table:[['Finnish','English'],['Viime viikolla kävin Tampereella.','Last week I visited Tampere.'],['Matka oli mukava ja rauhallinen.','The trip was nice and calm.'],['Näin paljon mielenkiintoisia paikkoja.','I saw many interesting places.'],['Toivon, että voin mennä uudestaan.','I hope that I can go again.']],
 rule:'<strong>Handy.</strong> <em>Kävin</em> is the past of <em>käydä</em> (to visit). Cities use the outer ending <em>-lla/-llä</em> (Tampereella). <em>Paljon</em> + partitive plural (<em>mielenkiintoisia paikkoja</em>) follows Lesson 68.',
 why:'A full model:<br><b>Viime viikolla kävin Tampereella. Matka oli mukava ja rauhallinen. Näin paljon mielenkiintoisia paikkoja. Toivon, että voin mennä uudestaan.</b>',
 tr:'Last week I visited Tampere. The trip was nice and calm. I saw many interesting places. I hope that I can go again.',
 drill:[['The trip was nice and calm.',['matka oli mukava ja rauhallinen']],['I saw many interesting places.',['näin paljon mielenkiintoisia paikkoja']],['Last week I visited Tampere.',['viime viikolla kävin tampereella']]],
 next:'Lesson 90: checkpoint. A mock set of three tasks (informal message, formal request, opinion).'},
{n:90,title:'Checkpoint: a mock set of three tasks',
 win:'Write three short answers to three prompts in one sitting.',
 anchor:'Same coffee trigger. Pick one prompt below and write it in 10 minutes, then say "Yes!"',
 build:'These prompts are my own practice material, not real exam tasks. Time yourself against the suggested split from Lesson 83. Task 1 is informal and short. Task 2 is a formal request. Task 3 is an opinion text. After each, run the five proofreading passes (Lesson 79).',
 eq:[['Task 1','stem'],['Task 2','mark'],['Task 3','end'],['kokeilu','res']],
 eqNote:'kokeilu = <em>trial run</em>',
 formula:'Plan 1 minute / write / proofread. Repeat for three tasks.',
 table:[['Task','Prompt (practice)','Key lessons'],['1 Informal','Write to a friend and move a meeting to a new time.','21 to 25, 30, 82'],['2 Formal','Ask a gym about membership price and group classes.','41 to 49, 85'],['3 Opinion','Should schools teach more languages?','51 to 60, 69']],
 rule:'<strong>Self-check:</strong> Did each answer cover every prompt verb? Is the register right (Hei and haluan for a friend, Hyvä vastaanottaja and haluaisin for the gym)? Did you finish with the five passes? New words: <em>kuntosali</em> (gym), <em>jäsenyys</em> (membership), <em>ryhmätunti</em> (group class).',
 why:'Model answers:<br><b>Task 1:</b> Hei Anna! Valitettavasti en voi tavata huomenna, koska minun täytyy mennä töihin. Sopiiko torstaina kello viisi? Kerro, onko se sinulle hyvä. Nähdään pian!<br><b>Task 2:</b> Aihe: Kysymys jäsenyydestä. Hyvä vastaanottaja, Otan yhteyttä koskien kuntosalin jäsenyyttä. Haluaisin tietää, paljonko jäsenyys maksaa. Haluaisin tietää myös, onko salilla ryhmätunteja. Olisin kiitollinen, jos voisitte vastata pian. Ystävällisin terveisin, Aino Virtanen<br><b>Task 3:</b> Nykyään kielitaito on tärkeää. Mielestäni koulussa pitäisi opettaa enemmän kieliä. Ensinnäkin kielitaito auttaa työnhaussa. Lisäksi ihmiset ymmärtävät toisiaan paremmin. Toisaalta kielten opiskelu vie aikaa. Yhteenvetona voin sanoa, että kielten opetus on tärkeää.',
 tr:'Task 1: Hi Anna! Unfortunately I cannot meet tomorrow, because I have to go to work. Does Thursday at five suit? Tell me whether it is good for you. See you soon! Task 2: Subject: Question about membership. Dear recipient, I am contacting you regarding the gym membership. I would like to know how much the membership costs. I would also like to know whether the gym has group classes. I would be grateful if you could reply soon. Kind regards, Aino Virtanen. Task 3: Nowadays language skill is important. In my opinion more languages should be taught at school. First of all language skill helps in job hunting. In addition people understand each other better. On the other hand studying languages takes time. In summary I can say that language teaching is important.',
 drill:[['I would like to know how much the membership costs.',['haluaisin tietää, paljonko jäsenyys maksaa','haluaisin tietää paljonko jäsenyys maksaa']],['In my opinion more languages should be taught at school.',['mielestäni koulussa pitäisi opettaa enemmän kieliä']],['Does Thursday at five suit?',['sopiiko torstaina kello viisi']]],
 next:'Lesson 91: vocabulary banks for typical task contexts (travel, housing, appointments).'},
{n:91,title:'Vocabulary bank: housing',
 win:'Learn seven housing words and report one fault.',
 anchor:'Same coffee trigger. Say the seven words aloud once, then say "Yes!"',
 build:'Housing is a frequent context for formal messages: a fault, a late repair, a question about rent. Learn the words once and plug them into the sentence frames you already own.',
 eq:[['Asunnon lämmitys','stem'],['ei','mark'],['toimi','end'],['Asunnon lämmitys ei toimi.','res']],
 eqNote:'= <em>The heating of the apartment does not work.</em>',
 formula:'noun + ei + verb (Lesson 18)   |   Pyydän, että korjaatte vian.',
 table:[['Finnish','English'],['asunto','apartment'],['vuokra','rent'],['vuokranantaja','landlord'],['vika','fault'],['korjata','to repair'],['lämmitys','heating'],['vesi','water']],
 rule:'<strong>Reuse.</strong> <em>Asunnon</em> is the genitive of <em>asunto</em> (Lesson 34). <em>Korjaatte</em> is the formal you-form of <em>korjata</em>. <em>Alkoi</em> (started) is the past of <em>alkaa</em> (Lesson 12 pattern).',
 why:'A full model:<br><b>Aihe: Vika asunnossa</b><br><b>Hyvä vuokranantaja,</b><br>Kirjoitan teille, koska asunnon lämmitys ei toimi. Vika alkoi eilen. Pyydän, että korjaatte vian pian. Voitte soittaa minulle numeroon 040 123 4567.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 tr:'Subject: Fault in the apartment. Dear landlord, I am writing to you because the heating of the apartment does not work. The fault started yesterday. I request that you repair the fault soon. You can call me at 040 123 4567. Kind regards, Aino Virtanen',
 drill:[['apartment (one word)',['asunto']],['landlord (one word)',['vuokranantaja']],['The heating of the apartment does not work.',['asunnon lämmitys ei toimi']]],
 next:'Lesson 92: vocabulary bank for travel and bookings.'},
{n:92,title:'Vocabulary bank: travel and bookings',
 win:'Learn seven travel words and cancel one booking.',
 anchor:'Same coffee trigger. Say the seven words aloud once, then say "Yes!"',
 build:'Travel prompts ask you to change, cancel or complain. You need a small word set and the request frames from Lessons 19, 36 and 45.',
 eq:[['Haluaisin peruuttaa','stem'],['varaukseni','end'],['Haluaisin peruuttaa varaukseni.','res']],
 eqNote:'= <em>I would like to cancel my booking.</em>',
 formula:'Haluaisin peruuttaa / muuttaa + object   |   noun + on + myöhässä / peruttu',
 table:[['Finnish','English'],['matka','trip'],['lippu','ticket'],['juna / bussi / lento','train / bus / flight'],['varaus','booking'],['peruttu','cancelled'],['hotelli','hotel']],
 rule:'<strong>Reuse.</strong> <em>Varaukseni</em> is <em>varaus</em> plus <em>-ni</em> (Lesson 15) and works as a whole object (Lesson 32). <em>Nimellä</em> (under the name) uses the outer ending (Lesson 26).',
 why:'A full model:<br><b>Aihe: Varauksen peruutus</b><br><b>Hyvä vastaanottaja,</b><br>Haluaisin peruuttaa varaukseni. Varaus on nimellä Aino Virtanen. Varasin huoneen 5. lokakuuta. Haluaisin saada rahat takaisin.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
