<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YKI Kirjoittaminen – 100 Lessons to B2</title>
<style>
:root{--paper:#F2F5F5;--card:#FFFFFF;--ink:#1E2F2A;--mute:#5B6B66;--lake:#1F4E6B;--frost:#DCE7EA;--berry:#A63A4A;--ok:#2E7D4F;--line:#C5D3D6}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 Georgia,"Iowan Old Style","Palatino Linotype",serif}
.wrap{max-width:740px;margin:0 auto;padding:28px 18px 80px}
h1{font:700 2rem/1.15 "Avenir Next","Segoe UI",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
h2{font:700 1.25rem/1.3 "Avenir Next","Segoe UI",system-ui,sans-serif;margin:30px 0 8px;color:var(--lake)}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 22px}
button{font:600 .9rem "Avenir Next","Segoe UI",system-ui,sans-serif;border:1.5px solid var(--lake);background:var(--card);color:var(--lake);padding:8px 14px;border-radius:6px;cursor:pointer}
button:hover{background:var(--frost)}
button.on,button.pri{background:var(--lake);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.grow{flex:1}
select{font:600 .9rem "Avenir Next","Segoe UI",system-ui,sans-serif;padding:8px 10px;border:1.5px solid var(--lake);border-radius:6px;background:var(--card);color:var(--lake);max-width:100%}
.sel{display:flex;gap:8px;align-items:center;font:600 .9rem system-ui,sans-serif;color:var(--mute);max-width:100%}
.lesson{display:none}
.lesson.on{display:block}
.win{border-left:5px solid var(--berry);background:var(--card);padding:12px 16px;margin:0 0 6px}
.eq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0;font:600 1.5rem "Avenir Next","Segoe UI",system-ui,sans-serif}
.t{padding:8px 14px;border-radius:6px;border:2px solid}
.stem{background:var(--frost);border-color:var(--lake);color:var(--lake)}
.mark{background:#F6DDE1;border-color:var(--berry);color:var(--berry)}
.end{background:#E2F1E8;border-color:var(--ok);color:var(--ok)}
.res{background:var(--ink);border-color:var(--ink);color:#fff}
.op{color:var(--mute)}
.formula{background:var(--ink);color:#fff;padding:12px 16px;border-radius:6px;font:600 1.05rem ui-monospace,Menlo,Consolas,monospace;overflow-x:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);margin:8px 0}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left}
th{background:var(--frost);font:600 .9rem "Avenir Next","Segoe UI",system-ui,sans-serif}
td:first-child{font-weight:700}
.tr{border-left:4px solid var(--lake);background:var(--frost);padding:8px 14px;margin:8px 0;font-size:.95em}
.drill{background:var(--card);border:1px solid var(--line);padding:14px 16px;border-radius:8px}
.q{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.q span.p{flex:1 1 100%;font-weight:700}
.q input{flex:1 1 200px;font:1rem Georgia,serif;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px}
.r{font:600 .9rem "Avenir Next","Segoe UI",system-ui,sans-serif}
.r.good{color:var(--ok)}.r.bad{color:var(--berry)}
.ans{display:none}
.done{margin-top:18px;display:flex;gap:10px;align-items:center;font:600 1rem "Avenir Next","Segoe UI",system-ui,sans-serif}
.done input{width:22px;height:22px;accent-color:var(--ok)}
.nav{display:flex;justify-content:space-between;margin-top:26px}
code{font:.95em ui-monospace,Menlo,Consolas,monospace;background:var(--frost);padding:1px 5px;border-radius:4px}
@media print{
 @page{margin:16mm}
 body{background:#fff;font-size:12pt}
 .bar,.nav,.done,.q input,.q button,.r{display:none!important}
 .lesson{display:block!important;page-break-after:always}
 .lesson:last-of-type{page-break-after:auto}
 .ans{display:block;margin:2px 0 8px}
 .t,.formula,.win,.res{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .wrap{padding:0;max-width:none}
 .drill,.win{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
 <h1>YKI Kirjoittaminen: from zero to B2</h1>
 <p class="sub">Anchoring, BJ Fogg minimal actions. One tiny sentence per lesson.</p>
 <div class="bar" id="bar"></div>
 <main id="app"></main>
</div>
<script>
const L=[
{n:1,title:'"I want to..." (Haluan)',
 win:'Write one correct Finnish sentence. That is the whole lesson.',
 anchor:'Pick a trigger you already do, such as pouring coffee. Then write one Finnish sentence. When it is done, say "Yes!" out loud. That feeling wires the habit in.',
 build:'Think of <code>halu</code> as <em>desire</em>. Add the ending <code>-n</code>, which means <strong>I</strong>. You will meet this <code>-n</code> in nearly every verb you write.',
 eq:[['halua','stem'],['n','end'],['haluan','res']],
 eqNote:'haluan = <em>I want</em>',
 formula:'Haluan + [verb in -a/-ä form] = I want to [verb]',
 table:[['Finnish','English'],['kirjoittaa','to write'],['kysyä','to ask'],['kiittää','to thank'],['kertoa','to tell'],['valittaa','to complain'],['pyytää','to request']],
 rule:'<strong>Vowel harmony.</strong> The ending is <code>-a</code> or <code>-ä</code>, never mixed. Back vowels (a, o, u) give <code>-a</code>: kirjoitt<b>aa</b>, kert<b>oa</b>. Front vowels (ä, ö, y) give <code>-ä</code>: kys<b>yä</b>, pyyt<b>ää</b>. The letters e and i are neutral: with no back vowel in the word, use <code>-ä</code> (kiitt<b>ää</b>).',
 why:'Almost every YKI message opens with an intention. One structure gives you three openers:<br><b>Haluan kysyä</b> työpaikasta. (I want to ask about the job.)<br><b>Haluan kiittää</b> avusta. (I want to thank you for the help.)<br><b>Haluan valittaa</b> palvelusta. (I want to complain about the service.)',
 drill:[['I want to write.',['haluan kirjoittaa']],['I want to thank.',['haluan kiittää']],['I want to request.',['haluan pyytää']]],
 next:'Lesson 2 turns Haluan into Haluaisin, the polite form every formal message needs.'},
{n:2,title:'"I would like to..." (Haluaisin)',
 win:'Turn Haluan into the polite form.',
 anchor:'Same coffee trigger. Today you write one sentence with Haluaisin, then say "Yes!"',
 build:'Insert a small marker between the stem and the ending. The marker <code>-isi-</code> is the <strong>conditional</strong>. Think "would". It softens the request, which is exactly what formal writing needs.',
 eq:[['halua','stem'],['isi','mark'],['n','end'],['haluaisin','res']],
 eqNote:'haluaisin = <em>I would like</em>',
 formula:'verb stem + isi + person ending',
 table:[['Person','Ending','Finnish','English'],['I','-n','haluaisin','I would like'],['you','-t','haluaisit','you would like'],['he/she','(none)','haluaisi','he/she would like'],['we','-mme','haluaisimme','we would like'],['you (pl./formal)','-tte','haluaisitte','you would like'],['they','-vat','haluaisivat','they would like']],
 rule:'<strong>The power pair.</strong> <code>Haluaisin + verb in -a/-ä form</code>. Only <em>haluaisin</em> changes. The verb after it stays in the Lesson 1 form: Haluaisin kysyä. Haluaisin kiittää. Haluaisin pyytää. Haluaisin kertoa. Haluaisin varata.',
 why:'Graders look for <strong>register</strong>, the right level of politeness. <em>Haluan</em> is fine with a friend. In a formal message <em>Haluaisin</em> shows control, which is a B2 signal.<br>Friend: <b>Haluan</b> kysyä, tuletko huomenna.<br>Formal: <b>Haluaisin</b> kysyä tilauksesta. (I would like to ask about the order.)',
 drill:[['I would like to ask.',['haluaisin kysyä']],['I would like to request.',['haluaisin pyytää']],['We would like to thank.',['haluaisimme kiittää']]],
 next:'Lesson 3: the greeting and closing frame (Hyvä vastaanottaja, ... Ystävällisin terveisin) for a full 3-line formal message.'},
{n:3,title:'The message frame (Hyvä vastaanottaja)',
 win:'Write a complete three-part message: greeting, one sentence, closing.',
 anchor:'Same coffee trigger. Today you write the whole frame once, then say "Yes!"',
 build:'Every message has three blocks. You already own the middle one from Lesson 2. Now add the two edges. Finnish puts a comma after the greeting and after the closing.',
 eq:[['Hyvä vastaanottaja,','stem'],['Haluaisin kysyä.','mark'],['Ystävällisin terveisin,','end'],['viesti','res']],
 eqNote:'viesti = <em>message</em>. Greeting + body + closing + your name.',
 formula:'Greeting, + Body. + Closing, + Name',
 table:[['Register','Greeting','Closing'],['Formal, name unknown','Hyvä vastaanottaja,','Ystävällisin terveisin,'],['Formal, name known','Hyvä Matti Virtanen,','Ystävällisin terveisin,'],['Neutral','Hei,','Terveisin,'],['Informal','Hei Anna!','Nähdään!']],
 rule:'<strong>Keep one register.</strong> Greeting, body and closing should sit at the same level. Pair <em>Haluaisin</em> with the formal rows and <em>Haluan</em> with the informal rows. A formal body inside an informal frame reads as inconsistent. (<em>Nähdään</em> = see you.)',
 why:'A full model message:<br><b>Hyvä vastaanottaja,</b><br>Haluaisin kysyä työpaikasta.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen<br>The frame costs a few seconds and shows the examiner you know the genre.',
 drill:[['Dear recipient,',['hyvä vastaanottaja'],'Hyvä vastaanottaja,'],['Kind regards (formal closing)',['ystävällisin terveisin'],'Ystävällisin terveisin,'],['I would like to ask. (review)',['haluaisin kysyä']]],
 next:'Lesson 4: the -n trick for more verbs, so you can write Kirjoitan teille (I am writing to you).'},
{n:4,title:'"I am writing to you" (Kirjoitan teille)',
 win:'Build the I-form of a new verb and aim it at a reader.',
 anchor:'Same coffee trigger. Write Kirjoitan teille once, then say "Yes!"',
 build:'The ending <code>-n</code> (I) from Lesson 1 works on most verbs. Drop the last vowel, <strong>weaken</strong> the consonant if it is double or has a gradation partner, then add <code>-n</code>. This weakening is called consonant gradation.',
 eq:[['kirjoitta','stem'],['tt → t','mark'],['n','end'],['kirjoitan','res']],
 eqNote:'kirjoitan = <em>I write / I am writing</em>',
 formula:'verb minus last vowel, weakened + n = I [verb]',
 table:[['Infinitive','Weaken','I-form','English'],['kirjoittaa','tt → t','kirjoitan','I write'],['kiittää','tt → t','kiitän','I thank'],['pyytää','t → d','pyydän','I request'],['kertoa','rt → rr','kerron','I tell'],['valittaa','tt → t','valitan','I complain'],['kysyä','(none)','kysyn','I ask']],
 rule:'<strong>Reader words.</strong> <code>sinulle</code> = to you (informal). <code>teille</code> = to you (formal). So: <b>Kirjoitan teille.</b> = I am writing to you. Haluaisin kysyä (Lesson 2) stays unchanged because it uses the -a/-ä form after the conditional.',
 why:'You can now join Lessons 1 to 4 into a real opener:<br><b>Kirjoitan teille, koska haluaisin kysyä tilauksesta.</b><br>(I am writing to you because I would like to ask about the order.) <em>Koska</em> = because. Reasons like this are what B2 texts are made of.',
 drill:[['I am writing to you. (formal)',['kirjoitan teille']],['I thank.',['kiitän']],['I ask.',['kysyn']]],
 next:'Lesson 5: the same -n trick for the other persons (sinä, hän, me), so you can write about other people too.'},
{n:5,title:'All six persons (kirjoitamme, kysyvät)',
 win:'Conjugate one verb in all six persons, then use the we-form.',
 anchor:'Same coffee trigger. Write Kirjoitamme teille once, then say "Yes!"',
 build:'You know <code>-n</code> (I). Now meet the rest of the family. The pronouns <em>minä, sinä, hän, me, te, he</em> are optional because the ending already says who is acting. Notice that I, you, we and you-plural use the <strong>weak</strong> stem (kirjoita-), while he/she and they keep the <strong>strong</strong> one (kirjoitt-).',
 eq:[['kirjoita','stem'],['mme','end'],['kirjoitamme','res']],
 eqNote:'kirjoitamme = <em>we write</em>',
 formula:'weak stem + n / t / mme / tte;  strong stem + (vowel) / vat or vät',
 table:[['Person','Ending','kirjoittaa','kysyä'],['minä','-n','kirjoitan','kysyn'],['sinä','-t','kirjoitat','kysyt'],['hän','vowel doubled','kirjoittaa','kysyy'],['me','-mme','kirjoitamme','kysymme'],['te','-tte','kirjoitatte','kysytte'],['he','-vat / -vät','kirjoittavat','kysyvät']],
 rule:'<strong>Vowel harmony again.</strong> The they-ending is <code>-vat</code> after back vowels and <code>-vät</code> after front vowels: kirjoitt<b>avat</b>, kysy<b>vät</b>. The he/she form copies the last vowel: kirjoitta<b>a</b>, kysy<b>y</b>.',
 why:'Company letters and group tasks often use <em>me</em>:<br><b>Kirjoitamme teille, koska haluaisimme kysyä tilauksesta.</b><br>(We are writing to you because we would like to ask about the order.) You already knew <em>haluaisimme</em> from Lesson 2.',
 drill:[['We write.',['kirjoitamme']],['You (plural) thank.',['kiitätte']],['They ask.',['kysyvät']]],
 next:'Lesson 6: negation. Finnish says no with a verb of its own: en, et, ei, emme, ette, eivät.'},
{n:6,title:'Saying no (en, et, ei)',
 win:'Make one sentence negative using a verb that conjugates by itself.',
 anchor:'Same coffee trigger. Write En halua kysyä once, then say "Yes!"',
 build:'Finnish has a negative <strong>verb</strong>. It carries the person ending, so the main verb loses its own and appears as a bare weak stem. Take <code>kirjoitan</code>, remove the personal ending to get <code>kirjoita</code>, and put <code>en</code> in front.',
 eq:[['en','end'],['kirjoita','stem'],['en kirjoita','res']],
 eqNote:'en kirjoita = <em>I do not write</em>',
 formula:'negative verb (en, et, ei, emme, ette, eivät) + bare weak stem',
 table:[['Person','Negative verb','with halua-','English'],['minä','en','en halua','I do not want'],['sinä','et','et halua','you do not want'],['hän','ei','ei halua','he/she does not want'],['me','emme','emme halua','we do not want'],['te','ette','ette halua','you (pl.) do not want'],['he','eivät','eivät halua','they do not want']],
 rule:'<strong>Handy chunk.</strong> <code>En voi + verb in -a/-ä form</code> = I cannot [verb]: En voi tulla. (I cannot come.) The verb <em>voida</em> (can) has the I-form <em>voin</em>, and its negative stem is <em>voi</em>.',
 why:'Negatives let you decline, correct and complain in B2 tasks. Notice the pattern you already own: <b>En halua kysyä.</b> (I do not want to ask.) is Lesson 1 with <em>en</em> in front and the ending removed from <em>haluan</em>.',
 drill:[['I do not want to ask.',['en halua kysyä']],['We do not write.',['emme kirjoita']],['They do not thank.',['eivät kiitä']]],
 next:'Lesson 7: polite requests and questions with the ending -ko/-kö (Voisitteko kertoa?).'},
{n:7,title:'Polite requests (Voisitteko kertoa?)',
 win:'Turn a statement into a question and a request.',
 anchor:'Same coffee trigger. Write Voisitteko kertoa? once, then say "Yes!"',
 build:'To make a question, glue <code>-ko</code> or <code>-kö</code> onto the verb. Combine it with the conditional from Lesson 2 and you have the most useful formal request in Finnish. The verb <em>voida</em> (can) has a stem ending in <em>i</em>, so the marker shrinks from <code>-isi-</code> to <code>-si-</code>.',
 eq:[['voi','stem'],['si','mark'],['tte','end'],['ko','mark'],['voisitteko','res']],
 eqNote:'voisitteko = <em>could you (formal)?</em>',
 formula:'Voi + si + person ending + ko/kö + [verb in -a/-ä form]?',
 table:[['Person','Conditional','Question','English'],['I','voisin','voisinko','could I'],['you','voisit','voisitko','could you (informal)'],['you (formal)','voisitte','voisitteko','could you (formal)'],['we','voisimme','voisimmeko','could we']],
 rule:'<strong>Choose -ko or -kö by vowel harmony.</strong> Examples: Voisitteko kertoa? Voisitteko auttaa? (help) Voisitteko vastata? (answer)',
 why:'Here is a real formal message built from Lessons 3 to 7:<br><b>Hyvä vastaanottaja,</b><br>Kirjoitan teille, koska haluaisin kysyä tilauksesta. Voisitteko kertoa, milloin tilaus saapuu?<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen<br>(<em>milloin tilaus saapuu</em> = when the order arrives.)',
 drill:[['Could you (formal) tell?',['voisitteko kertoa'],'Voisitteko kertoa?'],['Could I ask?',['voisinko kysyä'],'Voisinko kysyä?'],['Could you (informal) help?',['voisitko auttaa'],'Voisitko auttaa?']],
 next:'Lesson 8: the ending -sta/-stä (about, from), which you have already been copying in tilauksesta and työpaikasta.'},
{n:8,title:'About and from (kysyä hinnasta)',
 win:'Attach -sta/-stä to one noun and ask about it.',
 anchor:'Same coffee trigger. Write Haluaisin kysyä hinnasta once, then say "Yes!"',
 build:'You have copied <em>tilauksesta</em> and <em>työpaikasta</em> since Lesson 1. Now see the machine inside. The ending <code>-sta/-stä</code> (the <strong>elative</strong>) means <em>about</em> or <em>from</em>. It attaches to the word stem, not the dictionary form: tilaus becomes tilaukse-, then add -sta.',
 eq:[['tilaukse','stem'],['sta','end'],['tilauksesta','res']],
 eqNote:'tilauksesta = <em>about / from the order</em>',
 formula:'Haluaisin kysyä + noun stem + sta/stä',
 table:[['Dictionary form','Elative','English'],['tilaus','tilauksesta','about the order'],['hinta','hinnasta','about the price'],['työpaikka','työpaikasta','about the job'],['apu','avusta','for the help (thank for)'],['palvelu','palvelusta','about the service'],['kurssi','kurssista','about the course']]
 ,rule:'<strong>Gradation again.</strong> hinta becomes hinnasta (nt to nn), apu becomes avusta (p to v), työpaikka becomes työpaikasta (kk to k). <strong>Harmony:</strong> use <code>-stä</code> when the word has only front vowels: työ becomes työstä (about work).',
 why:'Three openers now work with real nouns:<br><b>Haluaisin kysyä hinnasta.</b> (ask about the price)<br><b>Haluaisin kiittää avusta.</b> (thank for the help)<br><b>Haluaisin valittaa palvelusta.</b> (complain about the service)<br>These ask-about, thank-for and complain-about frames are ones you will reuse constantly.',
 drill:[['about the price (one word)',['hinnasta']],['about the order (one word)',['tilauksesta']],['I would like to ask about the course.',['haluaisin kysyä kurssista']]],
 next:'Lesson 9: the twin ending -ssa/-ssä (in, at). Change one letter and leaving becomes staying.'},
{n:9,title:'In and at (Suomessa)',
 win:'Say where you live or work with one new ending.',
 anchor:'Same coffee trigger. Write Asun Suomessa once, then say "Yes!"',
 build:'Swap one letter and the meaning flips from leaving to staying. <code>-ssa/-ssä</code> (the <strong>inessive</strong>) means <em>in</em> or <em>at</em>. It uses the same stem as the elative.',
 eq:[['Suome','stem'],['ssa','end'],['Suomessa','res']],
 eqNote:'Suomessa = <em>in Finland</em>',
 formula:'noun stem + ssa/ssä = in / at',
 table:[['Dictionary form','Inessive','English'],['Suomi','Suomessa','in Finland'],['kauppa','kaupassa','in the shop'],['kaupunki','kaupungissa','in the city'],['hotelli','hotellissa','in the hotel'],['työpaikka','työpaikassa','at the workplace'],['tilaus','tilauksessa','in the order']],
 rule:'<strong>Pair them.</strong> <code>-ssa</code> = inside (stays). <code>-sta</code> = out of or about (leaves). Gradation: kauppa becomes kaupassa (pp to p), kaupunki becomes kaupungissa (nk to ng). Harmony: <code>-ssä</code> after front vowels: työssä (at work).',
 why:'Two sentences that introduce you in almost any task:<br><b>Asun Suomessa. Työskentelen hotellissa.</b><br>(I live in Finland. I work in a hotel.) <em>Asun</em> (I live) follows the Lesson 4 rule: asua loses its last vowel and takes -n.',
 drill:[['in Finland (one word)',['suomessa']],['in the shop (one word)',['kaupassa']],['in the city (one word)',['kaupungissa']]],
 next:'Lesson 10: checkpoint. Assemble Lessons 1 to 9 into your first full formal message template.'},
{n:10,title:'Checkpoint: your first full template',
 win:'Fill a four-slot template for a formal message.',
 anchor:'Same coffee trigger. Fill all four slots once with a topic of your choice, then say "Yes!"',
 build:'Nine lessons have produced four reusable pieces. A <strong>template</strong> is a message with slots. You swap the topic and keep the grammar. Here is the skeleton:',
 eq:[['Greeting','stem'],['Reason','mark'],['Request','end'],['Closing','end'],['viesti','res']],
 eqNote:'viesti = <em>message</em>',
 formula:'Hyvä vastaanottaja, / Kirjoitan teille, koska haluaisin kysyä [elative]. Voisitteko [verb]? / Ystävällisin terveisin, [Name]',
 table:[['Slot','Pattern','Lesson'],['Greeting','Hyvä vastaanottaja,','3'],['Reason','Kirjoitan teille, koska haluaisin kysyä hinnasta.','1, 2, 4, 8'],['Request','Voisitteko vastata?','7'],['Closing','Ystävällisin terveisin, Aino Virtanen','3']],
 rule:'<strong>Self-check before you move on:</strong> Is the greeting formal? Does <em>haluaisin</em> (not <em>haluan</em>) appear? Does the noun after <em>kysyä</em> end in -sta/-stä? Does the closing match the greeting?',
 why:'<strong>Exam map (check this yourself).</strong> Test-takers report writing tasks such as a message to a friend, a complaint and an opinion text, and one source says the writing part lasts about an hour. This comes from test-taker reports and a course slide, not an official specification. Confirm the current format with the official sample tasks at ykitesti.solki.jyu.fi before you plan your timing.',
 drill:[['I am writing to you because I would like to ask about the price.',['kirjoitan teille, koska haluaisin kysyä hinnasta','kirjoitan teille koska haluaisin kysyä hinnasta']],['Could you (formal) answer?',['voisitteko vastata'],'Voisitteko vastata?'],['I live in Finland.',['asun suomessa']]],
 next:'Lesson 11: objects and the partitive case (apua, tietoa), the form you need to ask for things.'},
{n:11,title:'Needing things (Tarvitsen apua)',
 win:'Ask for something with the partitive case.',
 anchor:'Same coffee trigger. Write Tarvitsen apua once, then say "Yes!"',
 build:'To need or ask for something, Finnish usually uses the <strong>partitive</strong>, the case of "some" or an unspecified amount. Take the noun stem and add <code>-a/-ä</code>. The verb <em>tarvita</em> (to need) has the I-form <em>tarvitsen</em>. Learn it as one chunk.',
 eq:[['apu','stem'],['a','end'],['apua','res']],
 eqNote:'apua = <em>(some) help</em>',
 formula:'Tarvitsen + partitive noun = I need [some] noun',
 table:[['Dictionary form','Partitive','English'],['apu','apua','help'],['tieto','tietoa','information'],['lisätieto','lisätietoa','more information'],['aika','aikaa','time'],['kahvi','kahvia','coffee'],['tilaus','tilausta','order']],
 rule:'<strong>Rule of thumb.</strong> Nouns ending in a vowel add -a/-ä (apu becomes apua), and a final -a/-ä is lengthened (aika becomes aikaa). Nouns ending in -s add -ta/-tä (tilaus becomes tilausta). Harmony applies: tietoa, but työtä (work).',
 why:'Needs are the engine of formal messages:<br><b>Tarvitsen apua.</b> (I need help.)<br><b>Tarvitsen lisätietoa tilauksesta.</b> (I need more information about the order.)<br>The second sentence reuses Lesson 8.',
 drill:[['I need help.',['tarvitsen apua']],['I need information.',['tarvitsen tietoa']],['I need more information.',['tarvitsen lisätietoa']]],
 next:'Lesson 12: the past tense, so you can say what happened (kirjoitin, kysyin).'},
{n:12,title:'What happened (kirjoitin, kysyin)',
 win:'Put one verb into the past tense.',
 anchor:'Same coffee trigger. Write Kirjoitin teille eilen once, then say "Yes!"',
 build:'To say what happened, put <code>-i-</code> between the stem and the ending. The last vowel of the stem gives way to the <code>i</code>. Strong and weak stems follow Lesson 5: I, you, we and you-plural keep the weak stem, while he/she and they keep the strong one.',
 eq:[['kirjoit','stem'],['i','mark'],['n','end'],['kirjoitin','res']],
 eqNote:'kirjoitin = <em>I wrote</em>',
 formula:'stem (last vowel replaced) + i + person ending',
 table:[['Person','kirjoittaa','kysyä'],['minä','kirjoitin','kysyin'],['sinä','kirjoitit','kysyit'],['hän','kirjoitti','kysyi'],['me','kirjoitimme','kysyimme'],['te','kirjoititte','kysyitte'],['he','kirjoittivat','kysyivät']],
 rule:'<strong>More I-forms:</strong> kiitin, kerroin, valitin, asuin. <strong>Time words that travel with the past:</strong> <em>eilen</em> (yesterday), <em>viime viikolla</em> (last week), <em>tänään</em> (today).',
 why:'Past tense is the backbone of complaints and of telling a friend what happened:<br><b>Kirjoitin teille eilen. Kysyin tilauksesta.</b><br>(I wrote to you yesterday. I asked about the order.)',
 drill:[['I wrote.',['kirjoitin']],['I asked.',['kysyin']],['We thanked.',['kiitimme']]],
 next:'Lesson 13: connectors (ja, mutta, koska, että, jos) that glue short sentences into B2 sentences.'},
{n:13,title:'Gluing sentences (koska, mutta, jos)',
 win:'Join two sentences you already own with one connector.',
 anchor:'Same coffee trigger. Glue two sentences once, then say "Yes!"',
 build:'Short sentences become B2 sentences when you join them. Finnish puts a <strong>comma before koska, että, mutta and jos</strong>. Between two main clauses, <em>ja</em> (and) takes no comma.',
 eq:[['Kirjoitan teille','stem'],[', koska','mark'],['tarvitsen apua','end'],['Kirjoitan teille, koska tarvitsen apua.','res']],
 eqNote:'= <em>I am writing to you because I need help.</em>',
 formula:'Sentence A + , connector + Sentence B',
 table:[['Connector','English','Example'],['ja','and','Kirjoitan teille ja kysyn hinnasta. (I write to you and ask about the price.)'],['mutta','but','Haluaisin kysyä, mutta en voi soittaa. (I would like to ask, but I cannot call.)'],['koska','because','Kirjoitan teille, koska tarvitsen apua. (I am writing to you because I need help.)'],['että','that','Kerron, että asun Suomessa. (I am telling you that I live in Finland.)'],['jos','if','Jos tarvitsen apua, kirjoitan teille. (If I need help, I will write to you.)']],
 rule:'<strong>Practice method.</strong> Read each example twice: first as two short sentences, then glued. Gluing is the whole skill. Check that the comma sits right before the connector.',
 why:'One glued sentence built from earlier lessons:<br><b>Kirjoitan teille, koska tarvitsen lisätietoa tilauksesta.</b><br>(I am writing to you because I need more information about the order.) Every part is from Lessons 4, 8 and 11.',
 drill:[['because (one word)',['koska']],['but (one word)',['mutta']],['I am writing to you because I need help.',['kirjoitan teille, koska tarvitsen apua','kirjoitan teille koska tarvitsen apua']]],
 next:'Lesson 14: time words (eilen, huomenna, viime viikolla) and your first informal message to a friend.'},
{n:14,title:'A message to a friend (huomenna)',
 win:'Write a three-line informal message that cancels a meeting.',
 anchor:'Same coffee trigger. Write the three lines once, then say "Yes!"',
 build:'Test-takers report a friend message such as cancelling a meeting, so build one now. The frame is informal (Lesson 3): <b>Hei Anna!</b> at the top, <b>Nähdään!</b> at the bottom. In between, use the chunk <em>En voi tulla</em> (Lesson 6) plus a time word.',
 eq:[['Hei Anna!','stem'],['En voi tulla huomenna.','mark'],['Nähdään!','end'],['viesti ystävälle','res']],
 eqNote:'viesti ystävälle = <em>message to a friend</em>',
 formula:'Hei [Name]! + En voi tulla + time word, koska olen töissä. + Nähdään!',
 table:[['Time word','English'],['eilen','yesterday'],['tänään','today'],['huomenna','tomorrow'],['viime viikolla','last week'],['ensi viikolla','next week'],['tänä iltana','this evening']],
 rule:'<strong>Questions to a friend.</strong> Add -ko/-kö (Lesson 7) to the sinä-form: Tuletko huomenna? (Are you coming tomorrow?) The verb <em>tulla</em> has the I-form <em>tulen</em> and the you-form <em>tulet</em>. <strong>Safe choice:</strong> write standard Finnish even to a friend (tulen, not spoken shortcuts).',
 why:'A complete cancel message with a reason:<br><b>Hei Anna!</b><br>En voi tulla huomenna, koska olen töissä.<br><b>Nähdään!</b><br>(<em>olen töissä</em> = I am at work. Learn it as a chunk. Lesson 16 explains <em>olen</em>.)',
 drill:[['yesterday (one word)',['eilen']],['tomorrow (one word)',['huomenna']],['I cannot come tomorrow.',['en voi tulla huomenna']]],
 next:'Lesson 15: my and your (tilauksestani, avustanne), the possessive suffixes that formal messages use constantly.'},
{n:15,title:'My and your (tilauksestani)',
 win:'Attach -ni to one noun to say my.',
 anchor:'Same coffee trigger. Write Haluaisin kysyä tilauksestani once, then say "Yes!"',
 build:'Formal messages constantly say <em>my</em> and <em>your</em>: my order, your help. Finnish glues this onto the noun: <code>-ni</code> = my, <code>-nne</code> = your (formal, plural). You can stack it after the case ending from Lesson 8: tilauksesta + ni = tilauksestani.',
 eq:[['tilauksesta','stem'],['ni','end'],['tilauksestani','res']],
 eqNote:'tilauksestani = <em>about my order</em>',
 formula:'noun (with case ending) + ni (my) / nne (your, formal)',
 table:[['Base','Form','English'],['tilaus','tilaukseni','my order'],['tilaus','tilauksestani','about my order'],['ystävä','ystäväni','my friend'],['sähköposti','sähköpostini','my email'],['tilaus','tilauksenne','your order (formal)'],['apu','avustanne','for your help (formal)']],
 rule:'<strong>Handy.</strong> The suffix <code>-ni</code> has no vowel harmony. The separate words <em>minun</em> (my) and <em>teidän</em> (your, formal) also exist, but you will see the glued suffix constantly in formal writing.',
 why:'Two pieces of formal-message gold:<br><b>Haluaisin kysyä tilauksestani.</b> (I would like to ask about my order.)<br><b>Kiitos avustanne.</b> (Thank you for your help.)',
 drill:[['my order (one word)',['tilaukseni']],['about my order (one word)',['tilauksestani']],['for your help (formal, one word)',['avustanne']]],
 next:'Lesson 16: the verb olla (to be) and your first opinion starter, Mielestäni.'},
{n:16,title:'To be and in my opinion (olen, Mielestäni)',
 win:'Say one opinion in Finnish.',
 anchor:'Same coffee trigger. Write Mielestäni se on hyvä once, then say "Yes!"',
 build:'Opinion texts need <em>is</em> and <em>are</em>. The verb <em>olla</em> (to be) is irregular, so learn the six forms as a block. You can also build <em>in my opinion</em> from earlier parts: <em>mieli</em> (mind) takes the elative (Lesson 8) and <code>-ni</code> (Lesson 15), so it literally says "from my mind".',
 eq:[['miele','stem'],['stä','end'],['ni','mark'],['mielestäni','res']],
 eqNote:'mielestäni = <em>in my opinion</em>',
 formula:'Mielestäni + clause (for example: se on hyvä / se on huono)',
 table:[['Person','olla','Example'],['minä','olen','Olen töissä. (I am at work.)'],['sinä','olet','Olet ystäväni. (You are my friend.)'],['hän','on','Se on hyvä. (It is good.)'],['me','olemme','Olemme Suomessa. (We are in Finland.)'],['te','olette','Olette töissä. (You are at work.)'],['he','ovat','He ovat kaupassa. (They are in the shop.)']],
 rule:'<strong>Opinion starters.</strong> Mielestäni se on hyvä. (In my opinion it is good.) Mielestäni se on huono. (…bad.) Olen samaa mieltä. (I agree.) Olen eri mieltä. (I disagree.)',
 why:'Test-takers report opinion tasks, and these starters are the first brick. A glued example:<br><b>Mielestäni se on hyvä, koska kaupat ovat auki.</b><br>(In my opinion it is good, because the shops are open.) <em>Se</em> = it, <em>auki</em> = open.',
 drill:[['I am (one word)',['olen']],['they are (one word)',['ovat']],['in my opinion (one word)',['mielestäni']]],
 next:'Lesson 17: adjectives (hyvä, huono, tärkeä) and how to describe things.'},
{n:17,title:'Describing things (huonosta palvelusta)',
 win:'Put an adjective in front of a noun and give both the same ending.',
 anchor:'Same coffee trigger. Write Haluaisin valittaa huonosta palvelusta once, then say "Yes!"',
 build:'Adjectives describe nouns, and in Finnish they <strong>copy the case ending of the noun they describe</strong>. If the noun takes <code>-sta</code> (Lesson 8), the adjective takes it too. English adds nothing to the adjective, so this is a new habit.',
 eq:[['huonosta','stem'],['palvelusta','stem'],['huonosta palvelusta','res']],
 eqNote:'huonosta palvelusta = <em>about bad service</em>',
 formula:'adjective stem + case ending  +  noun stem + case ending',
 table:[['Adjective','English','With -sta and a noun'],['hyvä','good','hyvästä palvelusta (about good service)'],['huono','bad','huonosta palvelusta (about bad service)'],['tärkeä','important','tärkeästä asiasta (about an important matter)'],['iso','big','isosta tilauksesta (about a big order)'],['pieni','small','pienestä ongelmasta (about a small problem)']],
 rule:'<strong>Watch the position.</strong> Before a noun the adjective copies the case ending (huonosta palvelusta). After <em>on</em> it stays in its basic form: Palvelu on huono. (Lesson 16)',
 why:'Three new tools for formal messages:<br><b>Haluaisin valittaa huonosta palvelusta.</b> (I would like to complain about bad service.)<br><b>Kiitos hyvästä palvelusta.</b> (Thank you for the good service.)<br><b>Haluaisin kysyä tärkeästä asiasta.</b> (I would like to ask about an important matter.)',
 drill:[['about good service',['hyvästä palvelusta']],['about a big order',['isosta tilauksesta']],['I would like to complain about bad service.',['haluaisin valittaa huonosta palvelusta']]],
 next:'Lesson 18: problem sentences (on myöhässä, on rikki, ei toimi) for complaints.'},
{n:18,title:'Stating a problem (on myöhässä, ei toimi)',
 win:'State one problem in a complete sentence.',
 anchor:'Same coffee trigger. Write Tilaus on myöhässä once, then say "Yes!"',
 build:'A complaint needs a problem. Finnish gives you two cheap structures: <code>noun + on + state</code> (Lesson 16) and <code>noun + ei + verb</code> (Lesson 6). Both use pieces you own. The state words <em>myöhässä</em> (late) and <em>rikki</em> (broken) never change.',
 eq:[['Tilaus','stem'],['on','mark'],['myöhässä','end'],['Tilaus on myöhässä.','res']],
 eqNote:'= <em>The order is late.</em>',
 formula:'Noun + on + myöhässä / rikki   |   Noun + ei + verb stem',
 table:[['Finnish','English'],['Tilaus on myöhässä.','The order is late.'],['Tuote on rikki.','The product is broken.'],['Laite ei toimi.','The device does not work.'],['Palvelu ei ole hyvä.','The service is not good.'],['Tilaus oli myöhässä.','The order was late.']],
 rule:'<strong>Two bonus facts.</strong> The negative of <em>on</em> is <em>ei ole</em> (the bare stem of olla is <em>ole</em>, just like Lesson 6). The past of <em>on</em> is <em>oli</em>: olin (I was), oli (it was).',
 why:'Your complaint reason is ready:<br><b>Kirjoitan teille, koska tilaukseni on myöhässä.</b><br>(I am writing to you because my order is late.) It uses Lesson 4 (kirjoitan), Lesson 13 (koska) and Lesson 15 (tilaukseni).',
 drill:[['The order is late.',['tilaus on myöhässä']],['The product is broken.',['tuote on rikki']],['The device does not work.',['laite ei toimi']]],
 next:'Lesson 19: asking for action (Pyydän vastausta, Toivon, että voisitte...).'},
{n:19,title:'Asking for action (Pyydän vastausta)',
 win:'Finish a complaint by asking for a reply.',
 anchor:'Same coffee trigger. Write Pyydän vastausta pian once, then say "Yes!"',
 build:'After the problem comes the request. Three verbs do most of the work: <em>pyytää</em> (to request, I-form <em>pyydän</em>, Lesson 4), <em>toivoa</em> (to hope, I-form <em>toivon</em>) and the polite question <em>Voisitteko</em> (Lesson 7). The first two take the partitive from Lesson 11.',
 eq:[['Pyydän','stem'],['vastausta','end'],['pian','mark'],['Pyydän vastausta pian.','res']],
 eqNote:'= <em>I request a reply soon.</em> (<em>pian</em> = soon)',
 formula:'Pyydän / Toivon + partitive noun + pian   |   Voisitteko + verb?',
 table:[['Pattern','Example','English'],['Pyydän + partitive','Pyydän vastausta pian.','I request a reply soon.'],['Pyydän + partitive','Pyydän lisätietoa.','I request more information.'],['Toivon + partitive','Toivon vastausta pian.','I hope for a reply soon.'],['Toivon, että + clause','Toivon, että voisitte vastata pian.','I hope that you could reply soon.'],['Voisitteko + verb?','Voisitteko vastata pian?','Could you reply soon?']],
 rule:'<strong>Choose the force.</strong> <em>Pyydän</em> is firm, <em>Toivon</em> is gentler, and <em>Voisitteko</em> is the softest. Pick one based on how urgent the problem is.',
 why:'Here is a full complaint built from Lessons 3, 15, 18 and 19:<br><b>Hyvä vastaanottaja,</b><br>Kirjoitan teille, koska tilaukseni on myöhässä. Pyydän vastausta pian.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen',
 drill:[['I request a reply soon.',['pyydän vastausta pian']],['I hope for a reply soon.',['toivon vastausta pian']],['Could you reply soon?',['voisitteko vastata pian'],'Voisitteko vastata pian?']],
 next:'Lesson 20: checkpoint. Build your first complete complaint and close the sentence-machine block.'},
{n:20,title:'Checkpoint: your first complete complaint',
 win:'Fill a six-slot complaint template from memory.',
 anchor:'Same coffee trigger. Fill all six slots once with a topic of your choice, then say "Yes!"',
 build:'Nineteen lessons have produced six reusable slots. Test-takers report complaint tasks, so this is the first full genre you now own. You swap the topic and keep the grammar.',
 eq:[['Greeting','stem'],['Problem','mark'],['Earlier contact','mark'],['Request','end'],['Closing','end'],['viesti','res']],
 eqNote:'viesti = <em>message</em>',
 formula:'Greeting / Problem / What you already did / Request / Thanks / Closing',
 table:[['Slot','Pattern','Lessons'],['Greeting','Hyvä vastaanottaja,','3'],['Problem','Kirjoitan teille, koska tilaukseni on myöhässä.','4, 13, 15, 18'],['Earlier contact','Kysyin tilauksestani eilen.','8, 12, 14, 15'],['Request','Pyydän vastausta pian.','19'],['Thanks','Kiitos avustanne.','15'],['Closing','Ystävällisin terveisin, Aino Virtanen','3']],
 rule:'<strong>Self-check before you move on:</strong> Is the greeting formal? Is the problem stated with <em>on myöhässä</em>, <em>on rikki</em> or <em>ei toimi</em>? Does a past-tense sentence show what you already did? Does <em>Pyydän</em>, <em>Toivon</em> or <em>Voisitteko</em> appear? Does the closing match the greeting?',
 why:'A full model complaint:<br><b>Hyvä vastaanottaja,</b><br>Kirjoitan teille, koska tilaukseni on myöhässä. Kysyin tilauksestani eilen. Pyydän vastausta pian. Kiitos avustanne.<br><b>Ystävällisin terveisin,</b><br>Aino Virtanen<br>The sentence-machine block ends here. Next comes the informal-message block.',
 drill:[['I asked about my order yesterday.',['kysyin tilauksestani eilen']],['Thank you for your help.',['kiitos avustanne']],['I am writing to you because my order is late.',['kirjoitan teille, koska tilaukseni on myöhässä','kirjoitan teille koska tilaukseni on myöhässä']]],
 next:'Lesson 21: commands (kirjoita, soita, kerro), the first tool for friendly messages.'},
{n:21,title:'Commands to a friend (soita!)',
 win:'Tell one friend to do one thing.',
 anchor:'Same coffee trigger. Write Soita minulle huomenna once, then say "Yes!"',
 build:'The informal command to one person is the <strong>bare weak stem</strong>, exactly the stem you used in negation (Lesson 6). Take <em>soittaa</em>, drop the last vowel and weaken tt to t: <em>soita</em>.',
 eq:[['soitta','stem'],['tt → t','mark'],['soita','res']],
 eqNote:'soita = <em>call!</em>',
 formula:'weak stem = command to one friend   |   stem + kaa/kää = command to several people or a formal reader',
 table:[['Infinitive','Command (one friend)','English'],['kirjoittaa','kirjoita','write!'],['soittaa','soita','call!'],['kertoa','kerro','tell!'],['kysyä','kysy','ask!'],['tulla','tule','come!'],['auttaa','auta','help!']],
 rule:'<strong>Plural and formal.</strong> Add <code>-kaa/-kää</code> to the strong stem: kirjoittakaa, soittakaa, kertokaa, kysykää. <strong>Negative:</strong> älä + command: Älä soita.',
 why:'Friend messages are full of commands:<br><b>Hei Anna!</b><br>Soita minulle huomenna. Kerro, tuletko mukaan.<br><b>Nähdään!</b><br>(<em>minulle</em> = to me, <em>tuletko mukaan</em> = are you coming along.)',
 drill:[['write! (to a friend, one word)',['kirjoita']],['tell! (to a friend, one word)',['kerro']],['Call me tomorrow.',['soita minulle huomenna']]],
 next:'Lesson 22: suggestions with Let us (Mennään kahville!, Tavataan huomenna!).'},
{n:22,title:'Making plans (Mennään kahville!)',
 win:'Suggest one plan to a friend.',
 anchor:'Same coffee trigger. Write Mennään kahville once, then say "Yes!"',
 build:'Finnish suggests a plan with a <strong>passive-looking form that means let us</strong>: <em>mennä</em> (to go) becomes <em>mennään</em> (let us go). You already met <em>Nähdään</em> (see you). Add a destination and you have an invitation.',
 eq:[['Mennään','stem'],['kahville','end'],['Mennään kahville!','res']],
 eqNote:'= <em>Let us go for coffee!</em>',
 formula:'Let-us form + destination or time',
 table:[['Chunk','English'],['Mennään kahville!','Let us go for coffee!'],['Mennään elokuviin!','Let us go to the movies!'],['Mennään ravintolaan!','Let us go to a restaurant!'],['Tavataan huomenna!','Let us meet tomorrow!'],['Syödään yhdessä!','Let us eat together!'],['Nähdään pian!','See you soon!']],
 rule:'<strong>Register.</strong> Let-us forms are standard in friendly writing, so use them in informal messages and avoid them in formal ones. Learn the destinations as chunks for now: kahville, elokuviin, ravintolaan. Their endings get their own lesson later.',
 why:'A complete invitation:<br><b>Hei Anna!</b><br>Tavataan huomenna. Mennään kahville!<br><b>Nähdään!</b>',
 drill:[['Let us meet tomorrow.',['tavataan huomenna']],['Let us go for coffee.',['mennään kahville']],['See you soon.',['nähdään pian']]],
 next:'Lesson 23: accepting and refusing invitations (Kiva!, Valitettavasti en voi).'},
{n:23,title:'Accepting and refusing (Valitettavasti en voi)',
 win:'Reply to an invitation in three short parts.',
 anchor:'Same coffee trigger. Write Kiitos kutsusta once, then say "Yes!"',
 build:'A good reply to an invitation has three parts: thank, answer, reason. You own the pieces already: <em>kiitos</em> plus the elative from Lesson 8, the chunk <em>en voi tulla</em> from Lesson 6, and <em>koska</em> from Lesson 13.',
 eq:[['Kiitos kutsusta!','stem'],['Valitettavasti en voi tulla','mark'],['koska olen töissä.','end'],['viesti','res']],
 eqNote:'= <em>Thanks for the invitation! Unfortunately I cannot come, because I am at work.</em>',
 formula:'Kiitos kutsusta! + answer + , koska + reason.',
 table:[['Function','Finnish','English'],['Thank','Kiitos kutsusta!','Thanks for the invitation!'],['Accept','Kiva, tulen!','Nice, I will come!'],['Accept','Hyvä idea!','Good idea!'],['Accept','Se sopii minulle.','That suits me.'],['Refuse','Valitettavasti en voi tulla.','Unfortunately I cannot come.'],['Reason','…, koska olen töissä.','…, because I am at work.']],
 rule:'<strong>No future tense needed.</strong> Finnish uses the present tense for the future. <em>Tulen</em> means both I come and I will come. Add a time word such as <em>huomenna</em> to make the time clear. <em>Kutsu</em> = invitation (kutsusta is its elative).',
 why:'A complete refusal:<br><b>Hei Anna!</b><br>Kiitos kutsusta! Valitettavasti en voi tulla huomenna, koska olen töissä.<br><b>Nähdään pian!</b>',
 drill:[['Thanks for the invitation!',['kiitos kutsusta']],['Unfortunately I cannot come.',['valitettavasti en voi tulla']],['That suits me.',['se sopii minulle']]],
 next:'Lesson 24: days of the week and a counter-proposal (Sopiiko perjantaina?).'},
{n:24,title:'Counter-proposals (Sopiiko perjantaina?)',
 win:'Suggest a different day in one question.',
 anchor:'Same coffee trigger. Write Sopiiko perjantaina once, then say "Yes!"',
 build:'After refusing, you offer another day. Finnish says <em>on Friday</em> by adding <code>-na/-nä</code> (the essive case) to the day. The question uses <em>sopia</em> (to suit) with <code>-ko</code> from Lesson 7: <em>sopii</em> becomes <em>sopiiko</em>.',
 eq:[['perjantai','stem'],['na','end'],['perjantaina','res']],
 eqNote:'perjantaina = <em>on Friday</em>',
 formula:'Sopiiko + day + na/nä?   |   Voisimmeko tavata + day + na/nä?',
 table:[['Finnish','English','On that day'],['maanantai','Monday','maanantaina'],['tiistai','Tuesday','tiistaina'],['keskiviikko','Wednesday','keskiviikkona'],['torstai','Thursday','torstaina'],['perjantai','Friday','perjantaina'],['lauantai','Saturday','lauantaina'],['sunnuntai','Sunday','sunnuntaina']],
 rule:'<strong>Harmony applies.</strong> Use <code>-na</code> after back vowels and <code>-nä</code> after front vowels (as in <em>tänä iltana</em>, this evening). Weekday names are not capitalized in Finnish.',
 why:'Refuse and propose in one message:<br><b>Hei Anna!</b><br>Kiitos kutsusta! Valitettavasti en voi tulla huomenna. Sopiiko perjantaina?<br><b>Nähdään!</b><br>A formal version: <b>Voisimmeko tavata perjantaina?</b> (Could we meet on Friday?)',
 drill:[['on Friday (one word)',['perjantaina']],['on Monday (one word)',['maanantaina']],['Does Saturday suit? (use -na)',['sopiiko lauantaina']]],
 next:'Lesson 25: clock times (kello kolme) so your plans have a precise time.'},
{n:25,title:'Clock times (kello kolme)',
 win:'Say one exact time in Finnish.',
 anchor:'Same coffee trigger. Write Tavataan perjantaina kello kolme once, then say "Yes!"',
 build:'To say <em>at three o\'clock</em>, Finnish uses the word <em>kello</em> (clock) followed by the number in its basic form. No case ending is needed, which makes this one of the cheapest upgrades you can give a plan.',
 eq:[['kello','stem'],['kolme','end'],['kello kolme','res']],
 eqNote:'kello kolme = <em>at three o\'clock</em>',
 formula:'kello + number (basic form)',
 table:[['Number','Finnish','At that hour'],['1','yksi','kello yksi'],['2','kaksi','kello kaksi'],['3','kolme','kello kolme'],['4','neljä','kello neljä'],['5','viisi','kello viisi'],['6','kuusi','kello kuusi'],['7','seitsemän','kello seitsemän'],['8','kahdeksan','kello kahdeksan'],['9','yhdeksän','kello yhdeksän'],['10','kymmenen','kello kymmenen'],['11','yksitoista','kello yksitoista'],['12','kaksitoista','kello kaksitoista']],
 rule:'<strong>In writing you may use digits.</strong> <em>kello 15</em> or the abbreviation <em>klo 15</em> are both common. Finnish uses the 24-hour clock in writing, so 15 means three in the afternoon.',

{n:26,title:'Where, from where, to where (kaupassa, asemalle)',
 win:'Complete the six-ending grid for one noun of each kind.',
 anchor:'Same coffee trigger. Write Menen kauppaan once, then say "Yes!"',
 build:'Finnish has <strong>six local cases</strong>: three for inner places and three for outer places. They answer <em>missä?</em> (where), <em>mistä?</em> (from where) and <em>minne?</em> (to where). You already own the inner "where" ending -ssa (Lesson 9) and the inner "from" ending -sta (Lesson 8). Now complete the grid.',
 eq:[['asema','stem'],['lla','end'],['asemalla','res']],
 eqNote:'asemalla = <em>at the station</em>',
 formula:'Inner: ssa / sta / vowel + n   |   Outer: lla / lta / lle',
 table:[['Question','Inner (kauppa, shop)','Outer (asema, station)'],['Missä? (where)','kaupassa','asemalla'],['Mistä? (from where)','kaupasta','asemalta'],['Minne? (to where)','kauppaan','asemalle']],
 rule:'<strong>The "to" ending of inner places</strong> lengthens the last vowel and adds n: kauppa becomes kauppaan, ravintola becomes ravintolaan, kaupunki becomes kaupunkiin. Some words change the stem, as in Suomi becomes Suomeen. <strong>Inner vs outer:</strong> inner endings usually go with enclosed places (shop, city, country), outer endings with open or surface places and events (station, market, course). Learn the choice per noun. This also explains Lesson 22: <em>ravintolaan</em> is inner "to", and <em>kahville</em> is outer "to".',
 why:'Where, from where, to where in four short sentences:<br><b>Olen kaupassa.</b> (I am in the shop.)<br><b>Tulen kaupasta.</b> (I am coming from the shop.)<br><b>Menen kauppaan.</b> (I am going into the shop.)<br><b>Tulen asemalle kello kolme.</b> (I am coming to the station at three.)<br><em>Menen</em> is the I-form of <em>mennä</em> (to go).',
 drill:[['in the shop (one word)',['kaupassa']],['to the station (one word)',['asemalle']],['from the station (one word)',['asemalta']]],
 next:'Lesson 27: question words (milloin, missä, miksi) for asking friends about plans.'},
{n:27,title:'Question words (Milloin tavataan?)',
 win:'Ask one open question about a plan.',
 anchor:'Same coffee trigger. Write Milloin tavataan once, then say "Yes!"',
 build:'The yes/no question from Lesson 7 uses <code>-ko/-kö</code>. An <strong>open question</strong> uses a question word at the start and no <code>-ko</code>. Put the question word first, then the verb, then the rest.',
 eq:[['Milloin','stem'],['tavataan','mark'],['Milloin tavataan?','res']],
 eqNote:'= <em>When shall we meet?</em>',
 formula:'question word + verb + rest?   (no -ko)',
 table:[['Question word','English','Example'],['milloin','when','Milloin tavataan? (When shall we meet?)'],['missä','where','Missä tavataan? (Where shall we meet?)'],['miksi','why','Miksi et voi tulla? (Why can you not come?)'],['mitä','what','Mitä haluat tehdä? (What do you want to do?)'],['kuka','who','Kuka tulee mukaan? (Who is coming along?)'],['kuinka monta','how many','Kuinka monta tulee? (How many are coming?)']],
 rule:'<strong>Reuse what you own.</strong> <em>Miksi et voi tulla?</em> is Lesson 6 inside a question. <em>Tulee</em> is the he/she form of <em>tulla</em> (Lesson 5 pattern). <em>Mitä</em> is the partitive of <em>mikä</em>, and <em>tehdä</em> means to do or make.',
 why:'Ask two things in one message:<br><b>Hei Anna!</b><br>Kiitos kutsusta! Milloin ja missä tavataan?<br><b>Nähdään!</b>',
 drill:[['when (one word)',['milloin']],['where (one word)',['missä']],['Why can you not come?',['miksi et voi tulla']]],
 next:'Lesson 28: the past tense of the seven most useful story verbs (menin, tulin, näin, söin, tein, sain, olin).'},
{n:28,title:'Story verbs (menin, näin, söin)',
 win:'Say what you did yesterday with one verb from the set.',
 anchor:'Same coffee trigger. Write Eilen menin kauppaan once, then say "Yes!"',
 build:'Lesson 12 gave you the past tense for verbs like <em>kirjoittaa</em>. The seven verbs of every story look different but follow the same idea: the final vowel of the stem gives way to <code>-i-</code>. Learn them as a set.',
 eq:[['men','stem'],['i','mark'],['n','end'],['menin','res']],
 eqNote:'menin = <em>I went</em>',
 formula:'stem (last vowel replaced) + i + n',
 table:[['Infinitive','I (now)','I (past)','English'],['mennä','menen','menin','I went'],['tulla','tulen','tulin','I came'],['nähdä','näen','näin','I saw'],['syödä','syön','söin','I ate'],['tehdä','teen','tein','I did / made'],['saada','saan','sain','I got'],['olla','olen','olin','I was']],
 rule:'<strong>He/she forms.</strong> meni, tuli, näki, söi, teki, sai, oli. Notice that <em>näki</em> and <em>teki</em> gain a k that the I-form does not show. Learn the seven as a set: they cover where I went, who I saw, what I did and what I got.',
 why:'A short story to a friend:<br><b>Eilen menin kauppaan ja tein ruokaa. Söin kotona.</b><br>(Yesterday I went to the shop and made food. I ate at home.) <em>Ruokaa</em> is the partitive of <em>ruoka</em> (Lesson 11), and <em>kotona</em> means at home.',
 drill:[['I went',['menin']],['I saw',['näin']],['I ate',['söin']]],
 next:'Lesson 29: telling a friend about your weekend, a full informal message. Lesson 30 will be the informal checkpoint.'},
{n:29,title:'Telling a friend about your weekend',
 win:'Write a six-part informal message from memory.',
 anchor:'Same coffee trigger. Write all six parts once, then say "Yes!"',
 build:'A friendly message has a rhythm: greet, ask, tell, judge, ask back, close. You own most of the verbs and words now. The new pieces are three chunks: <em>Mitä kuuluu?</em> (How are you?), <em>viikonloppuna</em> (at the weekend, built like the weekdays in Lesson 24) and <em>Se oli kivaa.</em> (It was nice.).',
 eq:[['Hei Anna! Mitä kuuluu?','stem'],['Viikonloppuna menin kauppaan.','mark'],['Se oli kivaa. Entä sinä?','end'],['viesti','res']],
 eqNote:'viesti = <em>message</em>',
 formula:'Greet + How are you? + When + what you did + Se oli kivaa. + Entä sinä? + Close',
 table:[['Part','Pattern','Example'],['Greet and ask','Hei [Name]! Mitä kuuluu?','Hei Anna! Mitä kuuluu?'],['When','Eilen / Viikonloppuna / Lauantaina','Viikonloppuna'],['Story','Past verbs (Lessons 12 and 28)','menin kauppaan ja tein ruokaa'],['Judge','Se oli kivaa. / Se oli hyvä.','Se oli kivaa.'],['Ask back','Entä sinä?','Entä sinä?'],['Close','Nähdään pian!','Nähdään pian!']],
 rule:'<strong>Keep each sentence short</strong> and join two with <em>ja</em> or <em>koska</em> (Lesson 13). <em>Entä sinä?</em> means And you? and invites a reply, which makes the message feel like a conversation.',
 why:'A full model:<br><b>Hei Anna! Mitä kuuluu?</b><br>Viikonloppuna menin kauppaan ja tein ruokaa. Söin kotona. Se oli kivaa. Entä sinä?<br><b>Nähdään pian!</b>',
 drill:[['How are you? (What is new?)',['mitä kuuluu']],['It was nice.',['se oli kivaa']],['And you?',['entä sinä']]],
 next:'Lesson 30: informal checkpoint. Reply to an invitation, counter-propose and ask a question.'},
{n:30,title:'Checkpoint: reply, counter-propose, ask',
 win:'Fill a six-slot informal template from memory.',
 anchor:'Same coffee trigger. Fill all six slots once with your own details, then say "Yes!"',
 build:'Test-takers report friend messages such as cancelling a meeting. This template covers that task and extends it: thank, refuse with a reason, offer another time, ask one question, close.',
 eq:[['Greeting','stem'],['Thanks','mark'],['Refusal','mark'],['Counter-proposal','end'],['Question','end'],['viesti','res']],
 eqNote:'viesti = <em>message</em>',
 formula:'Hei! / Kiitos kutsusta! / Valitettavasti en voi tulla [day], koska ... / Sopiiko [day] kello [time]? / Missä tavataan? / Nähdään!',
 table:[['Slot','Pattern','Lessons'],['Greeting','Hei Anna!','3, 14'],['Thanks','Kiitos kutsusta!','8, 23'],['Refusal','Valitettavasti en voi tulla perjantaina, koska olen töissä.','6, 13, 24'],['Counter-proposal','Sopiiko lauantaina kello kolme?','24, 25'],['Question','Missä tavataan?','27'],['Closing','Nähdään pian!','22']],
 rule:'<strong>Self-check:</strong> Is there a thank-you before the refusal? Does the refusal carry a reason with <em>koska</em>? Is the day in <em>-na/-nä</em> and the time after <em>kello</em>? Is there exactly one question mark per question? Does the closing match the friendly register?',
 why:'A full model:<br><b>Hei Anna!</b><br>Kiitos kutsusta! Valitettavasti en voi tulla perjantaina, koska olen töissä. Sopiiko lauantaina kello kolme? Missä tavataan?<br><b>Nähdään pian!</b>',
 drill:[['Unfortunately I cannot come on Friday, because I am at work.',['valitettavasti en voi tulla perjantaina, koska olen töissä','valitettavasti en voi tulla perjantaina koska olen töissä']],['Does Saturday at three suit?',['sopiiko lauantaina kello kolme']],['Where shall we meet?',['missä tavataan']]],
 next:'Lesson 31: reactions and apologies (Harmi!, Toivottavasti, Anteeksi, että...).'},
{n:31,title:'Reactions and apologies (Harmi!, Anteeksi)',
 win:'React to news and apologize in one sentence each.',
 anchor:'Same coffee trigger. Write Anteeksi, että vastaan myöhään once, then say "Yes!"',
 build:'Friends react, apologize and hope. Finnish does this with short, reusable words. The apology joins <em>anteeksi</em> to a full clause with <em>että</em> (Lesson 13), so the comma comes before <em>että</em>.',
 eq:[['Anteeksi','stem'],[', että','mark'],['vastaan myöhään','end'],['Anteeksi, että vastaan myöhään.','res']],
 eqNote:'= <em>Sorry that I answer late.</em>',
 formula:'Anteeksi, että + clause   |   Toivottavasti + clause',
 table:[['Finnish','English'],['Kiva!','Nice!'],['Mahtavaa!','Awesome!'],['Harmi!','What a pity!'],['Onneksi sain apua.','Luckily I got help.'],['Toivottavasti tulet!','Hopefully you come! (I hope you come.)'],['Anteeksi, että vastaan myöhään.','Sorry that I answer late.'],['Kiitos paljon!','Thank you very much!'],['Ei se mitään.','Never mind.']],
 rule:'<strong>Reuse.</strong> <em>Sain apua</em> is Lesson 28 plus Lesson 11. <em>Toivottavasti tulet</em> uses the you-form <em>tulet</em> from Lesson 5. <em>Vastaan</em> is the I-form of <em>vastata</em> (to answer).',
 why:'Reactions make a message feel human:<br><b>Hei Anna!</b><br>Anteeksi, että vastaan myöhään. Harmi, että et voi tulla! Toivottavasti nähdään pian.<br><b>Kiitos paljon!</b>',
 drill:[['What a pity! (one word)',['harmi']],['Hopefully you come.',['toivottavasti tulet']],['Sorry that I answer late.',['anteeksi, että vastaan myöhään','anteeksi että vastaan myöhään']]],
 next:'Lesson 32: object forms with -n (the accusative), the other half of the partitive story.'},
{n:32,title:'Whole objects (Ostin lipun)',
 win:'Put one object into the -n form.',
 anchor:'Same coffee trigger. Write Ostin lipun once, then say "Yes!"',
 build:'Lesson 11 gave you the partitive (some, an unspecified amount). The other object form is the <strong>accusative</strong>: add <code>-n</code> to the weak stem for a <strong>whole, completed</strong> object. Same gradation as before: lippu becomes lipu-, then add n.',
 eq:[['lipu','stem'],['n','end'],['lipun','res']],
 eqNote:'lipun = <em>the ticket (whole object)</em>',
 formula:'verb + weak noun stem + n = whole object   |   negative: partitive',
 table:[['Dictionary form','Object (-n)','English'],['kirja','kirjan','book'],['lippu','lipun','ticket'],['kahvi','kahvin','coffee (a whole cup)'],['auto','auton','car'],['tuote','tuotteen','product'],['sähköposti','sähköpostin','email']],
 rule:'<strong>Choose the object case.</strong> A whole, finished action takes <em>-n</em>: Ostin lipun. (I bought the ticket.) A negated verb always takes the partitive: En osta lippua. (I do not buy a ticket.) Ongoing or unspecified amounts also take the partitive (Lesson 11). <em>Ostaa</em> = to buy, I-form <em>ostan</em>, past <em>ostin</em>.',
 why:'Real uses:<br><b>Kirjoitin sähköpostin eilen.</b> (I wrote the email yesterday.)<br><b>Ostin lipun.</b> (I bought the ticket.)<br><b>En osta lippua.</b> (I am not buying a ticket.)',
 drill:[['I bought a ticket.',['ostin lipun']],['I do not buy a ticket.',['en osta lippua']],['I wrote the email.',['kirjoitin sähköpostin']]],
 next:'Lesson 33: plurals (kaupat, liput, kaksi lippua).'},
{n:33,title:'Plurals (kaupat, kaksi lippua)',
 win:'Make one noun plural and count two of something.',
 anchor:'Same coffee trigger. Write Ostin kaksi lippua once, then say "Yes!"',
 build:'The basic plural adds <code>-t</code> to the weak stem: kaupa + t. After a number, Finnish does <strong>not</strong> use the plural. It uses the <strong>singular partitive</strong>: kaksi lippua (two tickets).',
 eq:[['kaupa','stem'],['t','end'],['kaupat','res']],
 eqNote:'kaupat = <em>shops</em>',
 formula:'weak stem + t = plural   |   number (2+) + singular partitive',
 table:[['Singular','Plural','After a number'],['kauppa','kaupat','kaksi kauppaa'],['lippu','liput','kaksi lippua'],['kirja','kirjat','kolme kirjaa'],['ystävä','ystävät','neljä ystävää'],['tuote','tuotteet','kaksi tuotetta'],['tilaus','tilaukset','kolme tilausta']],
 rule:'<strong>Why it matters.</strong> Amounts and counts are everywhere in messages: two tickets, three products. Note the verb: <em>Tuotteet ovat rikki.</em> (The products are broken.) uses <em>ovat</em> from Lesson 16.',
 why:'Two sentences with plurals:<br><b>Ostin kaksi lippua.</b> (I bought two tickets.)<br><b>Tuotteet ovat rikki.</b> (The products are broken.)',
 drill:[['shops (one word)',['kaupat']],['tickets (one word)',['liput']],['two tickets',['kaksi lippua']]],
 next:'Lesson 34: the genitive (tilauksen numero, kaupan nimi) for of and possession.'},
{n:34,title:'Of and possession (tilauksen numero)',
 win:'Link two nouns with the genitive.',
 anchor:'Same coffee trigger. Write Tilauksen numero on ... once, then say "Yes!"',
 build:'The genitive uses the <strong>same <code>-n</code></strong> as the accusative in Lesson 32. Put the owner first and the owned thing second: <em>tilauksen numero</em> = the order\'s number = the order number.',
 eq:[['tilauksen','stem'],['numero','stem'],['tilauksen numero','res']],
 eqNote:'tilauksen numero = <em>the order number</em>',
 formula:'owner + n  +  owned thing',
 table:[['Finnish','English'],['tilauksen numero','the order number'],['kaupan nimi','the shop\'s name'],['tuotteen hinta','the price of the product'],['palvelun laatu','the quality of the service'],['ystävän työpaikka','my friend\'s workplace']],
 rule:'<strong>Handy.</strong> The <em>-n</em> attaches to the weak stem, so gradation applies exactly as in Lesson 32. <em>Hinta</em> (price) and <em>laatu</em> (quality) are useful in complaints.',
 why:'Useful sentences:<br><b>Tilauksen numero on 12345.</b> (The order number is 12345.)<br><b>Tuotteen hinta on liian korkea.</b> (The product price is too high.) <em>Liian</em> = too, <em>korkea</em> = high.',
 drill:[['the order number',['tilauksen numero']],['the price of the product',['tuotteen hinta']],['the shop\'s name',['kaupan nimi']]],
 next:'Lesson 35: having things (Minulla on kysymys).'},
{n:35,title:'Having things (Minulla on kysymys)',
 win:'Say what you have with the outer -lla ending.',
 anchor:'Same coffee trigger. Write Minulla on kysymys once, then say "Yes!"',
 build:'Finnish has no verb for to have in this sense. It says <em>at me is a question</em>: the possessor takes the outer <code>-lla/-llä</code> ending (Lesson 26) and the thing is the subject of <em>on</em>.',
 eq:[['Minulla','stem'],['on','mark'],['kysymys','end'],['Minulla on kysymys.','res']],
 eqNote:'= <em>I have a question.</em>',
 formula:'Possessor + lla/llä + on + thing',
 table:[['Person','At-form','Example'],['minä','minulla','Minulla on kysymys.'],['sinä','sinulla','Sinulla on aikaa.'],['hän','hänellä','Hänellä on ongelma.'],['me','meillä','Meillä on tilaus.'],['te','teillä','Teillä on hyvä palvelu.'],['he','heillä','Heillä on iso kauppa.']],
 rule:'<strong>Negative.</strong> Use <em>ei ole</em> (Lesson 18) and the partitive (Lesson 11): Minulla ei ole aikaa. (I have no time.)',

 next:'Lesson 36: asking permission and help (Saanko kysyä?, Saisinko lisätietoa?).'},
{n:36,title:'May I? Could I? (Saisinko lisätietoa?)',

 anchor:'Same coffee trigger. Write Saanko kysyä? once, then say "Yes!"',
 build:'<em>Saada</em> (to get, to be allowed) has the I-form <em>saan</em> (Lesson 28). Add <code>-ko</code> for <strong>Saanko?</strong> (May I?). Add the conditional marker from Lesson 2 for the polite <strong>Saisinko?</strong> (Could I get...?).',

 eqNote:'saisinko = <em>could I get</em>',
 formula:'Saanko + verb?   |   Saisinko + partitive noun?',
 table:[['Finnish','English'],['Saanko kysyä?','May I ask?'],['Saisinko lisätietoa?','Could I get more information?'],['Saisinko apua?','Could I get help?'],['Voinko auttaa?','Can I help?'],['Saisinko lisätietoa tilauksestani?','Could I get more information about my order?']],
 rule:'<strong>Register.</strong> <em>Saisinko</em> is polite and fits formal messages. <em>Saanko</em> fits both formal and informal.',
 why:'A polite formal request:<br><b>Saisinko lisätietoa tilauksestani?</b><br>(Could I get more information about my order?) It uses Lessons 11 and 15.',

 next:'Lesson 37: must and have to (Minun täytyy mennä).'},
{n:37,title:'Must (Minun täytyy mennä)',
 win:'Say what you must do.',
 anchor:'Same coffee trigger. Write Minun täytyy kirjoittaa once, then say "Yes!"',
 build:'Finnish says <em>of me it is necessary</em>: the person takes the genitive (<em>minun</em>, Lesson 34 style), then <em>täytyy</em> or <em>pitää</em>, then the -a/-ä form of the verb from Lesson 1.',
 eq:[['Minun','stem'],['täytyy','mark'],['kirjoittaa','end'],['Minun täytyy kirjoittaa.','res']],
 eqNote:'= <em>I must write.</em>',
 formula:'minun / sinun / hänen / meidän / teidän / heidän + täytyy (pitää) + verb in -a/-ä form',
 table:[['Person','Genitive','Example'],['minä','minun','Minun täytyy kirjoittaa.'],['sinä','sinun','Sinun pitää kertoa.'],['hän','hänen','Hänen täytyy mennä.'],['me','meidän','Meidän täytyy mennä.'],['te','teidän','Teidän pitää vastata.'],['he','heidän','Heidän täytyy tulla.']],

 next:'Lesson 38: comparing (parempi, halvempi, kuin).'},

 build:'The comparative adds <code>-mpi</code> to the adjective stem, and <em>kuin</em> means than. The superlative adds <code>-in</code>. <em>Tämä</em> = this, <em>tuo</em> = that.',

 next:'Lesson 39: structuring a reason list (Ensinnäkin, Toiseksi, Lopuksi).'},
{n:39,title:'Ordering your reasons (Ensinnäkin, Toiseksi)',
 win:'Give two reasons in order.',
 anchor:'Same coffee trigger. Write Ensinnäkin once with a reason, then say "Yes!"',
 build:'A paragraph is easier to read when reasons come in order. Three words do the job: <em>Ensinnäkin</em> (first of all), <em>Toiseksi</em> (secondly), <em>Lopuksi</em> (finally). Each starts a short sentence.',
 eq:[['Mielestäni','stem'],['Ensinnäkin','mark'],['Toiseksi','mark'],['Lopuksi','end'],['mielipide','res']],
 eqNote:'mielipide = <em>opinion</em>',
 formula:'Mielestäni ... Ensinnäkin ... Toiseksi ... Lopuksi ...',
 table:[['Role','Finnish','English'],['Opinion','Mielestäni se on hyvä.','In my opinion it is good.'],['Reason 1','Ensinnäkin se on halpa.','First of all it is cheap.'],['Reason 2','Toiseksi se on nopea.','Secondly it is fast.'],['Conclusion','Lopuksi haluan sanoa, että se on hyvä.','Finally I want to say that it is good.']],
 rule:'<strong>Handy.</strong> <em>Sanoa</em> (to say) has the I-form <em>sanon</em>. The conclusion reuses Lesson 1 (<em>haluan sanoa</em>) and Lesson 13 (<em>että</em>). This is the skeleton of every opinion text you will write later.',
 why:'A four-sentence mini opinion text:<br><b>Mielestäni se on hyvä. Ensinnäkin se on halpa. Toiseksi se on nopea. Lopuksi haluan sanoa, että se on hyvä.</b>',
 drill:[['first of all (one word)',['ensinnäkin']],['secondly (one word)',['toiseksi']],['finally (one word)',['lopuksi']]],
 next:'Lesson 40: checkpoint. Your first full informal message with story, need, invitation and question.'},
{n:40,title:'Checkpoint: the full informal message',
 win:'Write an informal message with story, need, invitation and question from memory.',
 anchor:'Same coffee trigger. Fill all seven slots once with your own details, then say "Yes!"',
 build:'Forty lessons have produced a full informal kit. This template mixes the story (Lessons 28 and 32), a need (Lesson 37), an invitation (Lesson 22), a time (Lessons 24 and 25) and a question (Lessons 27 and 31).',
 eq:[['Greeting','stem'],['Story','mark'],['Invitation','mark'],['Need','mark'],['Question','end'],['Closing','end'],['viesti','res']],
 eqNote:'viesti = <em>message</em>',
