<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple P2P ScreenCast</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; background: #f4f4f9; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        video { width: 100%; background: #000; border-radius: 8px; }
        textarea { width: 100%; height: 100px; margin: 10px 0; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Simple P2P ScreenCast</h1>
    <div class="grid">
        <div>
            <h3>Local Preview</h3>
            <video id="localVideo" autoplay playsinline muted></video>
            <button id="startBtn">1. Start Sharing Screen</button>
        </div>
        <div>
            <h3>Remote View</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div style="margin-top:20px;">
        <h3>Signaling (Manual)</h3>
        <textarea id="dataBox" placeholder="Paste signaling data here..."></textarea><br>
        <button id="acceptBtn">2. Accept Offer / Finalize</button>
    </div>

    <script>
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const dataBox = document.getElementById('dataBox');

        // Handle incoming stream
        pc.ontrack = e => remoteVideo.srcObject = e.streams[0];
        pc.onicecandidate = e => { if (e.candidate) console.log("New ICE Candidate: ", JSON.stringify(pc.localDescription)); };

        // 1. Start Sharing
        document.getElementById('startBtn').onclick = async () => {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            localVideo.srcObject = stream;
            stream.getTracks().forEach(track => pc.addTrack(track, stream));
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            dataBox.value = JSON.stringify(pc.localDescription);
            alert("Copy this Offer and paste it into the other device!");
        };

        // 2. Accept/Finalize
        document.getElementById('acceptBtn').onclick = async () => {
            const data = JSON.parse(dataBox.value);
            if (data.type === 'offer') {
                await pc.setRemoteDescription(data);
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                dataBox.value = JSON.stringify(pc.localDescription);
                alert("Copy this Answer and paste it back to the original device!");
            } else if (data.type === 'answer') {
                await pc.setRemoteDescription(data);
            }
        };
    </script>
</body>
</html>
